te{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:78px;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:8;box-shadow:0 -8px 25px rgba(35,65,100,.08)}.nav-inner{width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav-item{height:78px;background:transparent;color:#7a899c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:750;position:relative}.nav-icon{font-size:21px;line-height:1}.nav-item.active{color:var(--blue)}.nav-item.active:before{content:"";position:absolute;top:0;width:52px;height:3px;background:var(--blue);border-radius:0 0 8px 8px}.nav-item.disabled{opacity:.7}.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.authbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.authbox h2{margin:0 0 7px}.authbox p{color:var(--muted);font-size:13px}.field{display:block;margin:12px 0}.field span{display:block;color:#52657d;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#f8fbff;color:var(--text);outline:none}.msg{color:#e14d57;font-size:12px;min-height:18px;margin:8px 0}.hint{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:11px;color:#6f7f93;font-size:12px;line-height:1.7}.modal{position:fixed;inset:0;background:#16243a66;display:none;align-items:end;justify-content:center;padding:14px;z-index:10}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(25,45,75,.2)}.sheet h3{margin-top:0}.sheet input,.sheet select{width:100%;background:#f8fbff;color:var(--text);border:1px solid var(--line);border-radius:1 .category-stack{display:grid;gap:10px}.main-category{border:1px solid var(--line);border-radius:18px;background:#fbfdff;overflow:hidden}.main-category>.category-toggle{width:100%;background:transparent;text-align:right;padding:15px;display:flex;align-items:center;justify-content:space-between;color:var(--text);cursor:pointer}.category-toggle:focus{outline:2px solid #b9d7ff;outline-offset:-2px}.category-actions{display:flex;align-items:center;gap:6px}.category-actions .mini{padding:5px 7px}.main-left{display:flex;align-items:center;gap:10px}.main-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#eef5ff;color:var(--blue);font-weight:900}.main-category.income .main-icon{background:#eafaf3;color:var(--green)}.main-category.expense .main-icon{background:#fff0f1;color:var(--red)}.main-name{font-weight:850;font-size:15px}.main-total{font-weight:900;font-size:13px;color:#53657c}.chev{transition:.2s}.main-category.open .chev{transform:rotate(180deg)}.sub-list{display:none;padding:0 12px 12px;gap:8px}.main-category.open .sub-list{display:grid}.sub-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid #e7eef6}.sub-name{font-weight:750}.sub-main{color:var(--muted);font-size:10px;margin-top:3px}.sub-amount{font-weight:900}.sub-amount.income{color:var(--green)}.sub-amount.expense{color:var(--red)}.mini{background:#eef5ff;color:#1268df;border:1px solid #d7e7ff;border-radius:9px;padding:6px 8px;font-size:10px;font-weight:800}.mini.danger{color:#d93645;background:#fff1f2;border-color:#ffd9dc}.danger-solid{background:#ef4b55;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer}.confirm-box{background:#f7faff;border:1px solid #dce9f7;border-radius:14px;padding:16px;margin:10px 0}.confirm-title{font-size:18px;font-weight:900;color:var(--text)}.confirm-text{color:var(--muted);font-size:13px;margin-top:7px;line-height:1.7}. lor:var(--green);font-weight:850}.lock-badge.locked{background:#fff1f2;color:var(--red)}.report-actions{display:flex;gap:8px;flex-wrap:wrap}.report-btn{background:#fff;color:#176bd8;border:1px solid #d5e6ff;border-radius:11px;padding:9px 12px;font-size:11px;font-weight:850}.locked-overlay{position:absolute;inset:0;background:#ffffff99;backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:3}.section.is-locked .locked-overlay{display:flex}.lock-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:var(--shadow);font-size:12px;font-weight:850;color:#6a7b90}.section{position:relative}@media(max-width:760px){.finance-tools{grid-template-columns:1fr}.insights{grid-template-columns:1fr 1fr}.report-actions{width:100%}}

<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL="https://dwifylcibtawffnjyzmu.supabase.co";
const KEY_STORAGE="ibtisam_supabase_key";
const LOCAL_STORAGE="ibtisam_finance_entries";
const CAT_STORAGE="ibtisam_finance_categories";
const DEFAULT_CATS={income:["اشتراك الأطفال","دعم آخر"],expense:["الرواتب","الإيجار","الكهرباء","مصروفات أخرى"]};
let supabaseClient=null,entries=[],editId=null,busy=false,activeTab="all";
function money(n){return Number(n||0).toLocaleString("ar-SA",{maximumFractionDigits:2})+" ر.س"}
function monthValue(){return $("month")?.value||new Date().toISOString().slice(0,7)}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function showMessage(id,msg){if($(id))$(id).textContent=msg||""}
function getCats(){try{const x=JSON.parse(localStorage.getItem(CAT_STORAGE)||"null");if(x?.income&&x?.expense)return x}catch(e){}const fresh=JSON.parse(JSON.stringify(DEFAULT_CATS));saveCats(fresh);return fresh}
function saveCats(c){localStorage.setItem(CAT_STORAGE,JSON.stringify(c))}
function keyScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>ربط قاعدة البيانات</p></div></div><h2>مفتاح Supabase</h2><p>أدخل Publishable key الخاص بمشروعك.</p><label class="field"><span>Publishable key</span><input id="sbKey" type="password" placeholder="sb_publishable_..."></label><div class="hint">المفتاح يحفظ على هذا الجهاز فقط.</div><div id="keyMsg" class="msg">${esc(message)}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px" onclick="saveKey()">متابعة</button></div></div>`}
function authScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div><h2>تسجيل الدخول</h2><p>سجّل الدخول بحساب Supabase المرتبط بالموقع.</p><label class="field"><span>البريد الإلكتروني</span><input id="email" type="email" autocomplete="email"></label><label class="field"><span>كلمة المرور</span><input id="password" type="password" autocomplete="current-password"></label><div id="authMsg" class="msg">${esc(message)}</div><div style="display:flex;gap:8px"><button class="primary" style="flex:1;padding:13px;border-radius:13px" onclick="signIn()">دخول</button><button class="ghost" style="flex:1;padding:13px;border-radius:13px" onclick="signUp()">إنشاء حساب</button></div><button class="ghost" style="width:100%;margin-top:9px;padding:12px;border-radius:13px" onclick="changeKey()">تغيير المفتاح</button></div></div>`}
async function boot(){const key=localStorage.getItem(KEY_STORAGE);if(!key){$("root").innerHTML=keyScreen();return}try{supabaseClient=window.supabase.createClient(SUPABASE_URL,key);const {data:{session}}=await supabaseClient.auth.getSession();if(session){await loadEntries();showApp()}else $("root").innerHTML=authScreen()}catch(e){$("root").innerHTML=keyScreen("خطأ تهيئة Supabase: "+(e?.message||String(e))) }}
function saveKey(){const key=$("sbKey").value.trim();if(!key){showMessage("keyMsg","أدخل المفتاح أولًا.");return}localStorage.setItem(KEY_STORAGE,key);boot()}
function changeKey(){localStorage.removeItem(KEY_STORAGE);supabaseClient=null;$("root").innerHTML=keyScreen()}
async function signIn(){const email=$("email").value.trim(),password=$("password").value,key=localStorage.getItem(KEY_STORAGE)||"";if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}showMessage("authMsg","جاري الاتصال...");try{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);let r;try{r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":key},body:JSON.stringify({email,password}),signal:c.signal})}finally{clearTimeout(t)}const raw=await r.text();let b={};try{b=raw?JSON.parse(raw):{}}catch(_){b={raw}}if(!r.ok){showMessage("authMsg",`خطأ الدخول: ${b.error_description||b.msg||b.message||b.raw||"غير معروف"} (HTTP ${r.status})`);return}const s=await supabaseClient.auth.setSession({access_token:b.access_token,refresh_token:b.refresh_token});if(s.error){showMessage("authMsg",s.error.message);return}await loadEntries();showApp()}catch(e){showMessage("authMsg",`تعذر الاتصال بـ Supabase: ${e?.name==="AbortError"?"انتهت مهلة الاتصال":e.message||e}`)}}
async function signUp(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}if(password.length<6){showMessage("authMsg","كلمة المرور 6 أحرف على الأقل.");return}const {data,error}=await supabaseClient.auth.signUp({email,password});if(error){showMessage("authMsg",error.message);return}if(data.session){await loadEntries();showApp()}else showMessage("authMsg","تم إنشاء الحساب. إذا طُلب تأكيد البريد، أكده ثم سجّل الدخول.")}
async function loadEntries(){const {data,error}=await supabaseClient.from("financial_entries").select("id,month,type,category,amount,created_at").order("created_at",{ascending:true});if(error)throw new Error(error.message);entries=(data||[]).map(x=>({id:String(x.id),month:String(x.month).slice(0,10),type:x.type,category:x.category,amount:Number(x.amount)}));}
function splitCategory(v){const parts=String(v||'').split('::');return {main:parts[0]||'',detail:parts.slice(1).join('::')||''}}
function makeCategory(main,detail){return detail?.trim()?main+'::'+detail.trim():main}
function categoryHash(v){return 'cat_'+encodeURIComponent(String(v)).replace(/%/g,'_').replace(/[^a-zA-Z0-9_]/g,'').slice(0,80)}
function toggleCategory(id){const el=$(id);if(el)el.classList.toggle('open')}
function categoryGroups(type,list,search=''){const base=getCats()[type]||[];const q=String(search||'').trim().toLowerCase();const discovered=list.map(x=>splitCategory(x.category).main).filter(Boolean);let cats=[...base,...discovered.filter(c=>!base.includes(c))];if(q)cats=cats.filter(cat=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);return cat.toLowerCase().includes(q)||arr.length>0});return cats.map((cat,idx)=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);const sum=arr.reduce((a,x)=>a+x.amount,0);const id=categoryHash(type+'|'+cat+'|'+idx);const safeType=esc(type);const encodedCat=encodeURIComponent(String(cat));const matched=q&&arr.length>0;const open=matched||(!q&&false);return `<div class="main-category ${type}${open?' open':''}" id="${id}" data-category-type="${safeType}" data-category-key="${encodedCat}"><div class="category-toggle" role="button" tabindex="0" onclick="toggleCategory('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCategory('${id}')}"><div class="main-left"><div class="main-icon">${type==='income'?'↗':'↘'}</div><div><div class="main-name">${esc(cat)}</div><div class="main-total">${money(sum)}</div></div></div><div class="category-actions"><button type="button" class="mini" data-action="rename-main" data-type="${safeType}" data-name="${encodedCat}">تعديل</button><button type="button" class="mini danger" data-action="delete-main" data-type="${safeType}" data-name="${encodedCat}">حذف</button><span class="chev" aria-hidden="true">⌄</span></div></div><div class="sub-list">${arr.length?arr.map(x=>subEntryHtml(x)).join(''):`<div class="empty">${q?'لا توجد نتائج مطابقة':'لا توجد تفاصيل بعد'}</div>`}<button type="button" class="mini" style="justify-self:start" onclick="event.stopPropagation();openEntryModal('${safeType}',null,decodeURIComponent('${encodedCat}'))">+ إضافة عنوان فرعي</button></div></div>`}).join('')}
function mainCategoryAction(event,button){event.preventDefault();event.stopPropagation();const type=button.dataset.type;const name=decodeURIComponent(button.dataset.name||'');if(button.dataset.action==='rename-main')renameMainCategory(type,name);else if(button.dataset.action==='delete-main')removeMainCategory(type,name)}
document.addEventListener('click',function(event){
 const b=event.target.closest('[data-action="rename-main"],[data-action="delete-main"]');
 if(b){mainCategoryAction(event,b);return}
 const m=event.target.closest('[data-modal-action]');
 if(m){
  event.preventDefault();event.stopPropagation();
  const action=m.dataset.modalAction;
  const type=m.dataset.type||'';
  const name=decodeURIComponent(m.dataset.name||'');
  if(action==='apply-rename-main') applyRenameMainCategory(type,name);
  if(action==='apply-delete-main') applyRemoveMainCategory(type,name);
 }
});
function subEntryHtml(x){const p=splitCategory(x.category);const name=p.detail||'بدون عنوان فرعي';return `<div class="sub-row"><div><div class="sub-name">${esc(name)}</div><div class="sub-main">العنوان الفرعي · ${esc(p.month||x.month)}</div></div><div style="display:flex;align-items:center;gap:7px"><div class="sub-amount ${x.type}">${money(x.amount)}</div><button class="mini" onclick="event.stopPropagation();editEntry('${x.id}')">تعديل</button><button class="mini danger" onclick="event.stopPropagation();deleteEntry('${x.id}')">حذف</button></div></div>`}
function expenseChart(list){const income=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0);const expense=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);const remaining=income-expense;const positiveRemaining=Math.max(remaining,0);const chartTotal=income+expense+positiveRemaining;if(chartTotal<=0)return `<div class="empty">لا توجد بيانات مالية لعرض التشارت</div>`;const groups=[{name:'الدخل',total:income,color:'#16a06a'},{name:'المصروفات',total:expense,color:'#ef4b55'},{name:'المتبقي',total:positiveRemaining,color:'#1677ff'}].filter(x=>x.total>0);let cur=0;const stops=groups.map(g=>{const a=cur/chartTotal*100,b=(cur+g.total)/chartTotal*100;cur+=g.total;return `${g.color} ${a}% ${b}%`}).join(',');const center=remaining<0?`<div style="color:var(--red)">${money(Math.abs(remaining))}<br><span style="font-size:10px;color:var(--muted)">عجز</span></div>`:`<div>${money(remaining)}<br><span style="font-size:10px;color:var(--muted)">المتبقي</span></div>`;return `<div class="chart-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div class="chart-center">${center}</div></div><div class="legend">${groups.map(g=>{const pct=(g.total/chartTotal*100);return `<div class="legend-item"><div class="legend-name"><span class="dot" style="background:${g.color}"></span>${g.name}</div><div class="legend-val">${money(g.total)} · ${pct.toFixed(1)}%</div></div>`}).join('')}${remaining<0?`<div class="legend-item"><div class="legend-name"><span class="dot" style="background:#ef4b55"></span>العجز</div><div class="legend-val">${money(Math.abs(remaining))}</div></div>`:''}</div></div>`}

 <nav class="bottom-nav"><div class="nav-inner"><button class="nav-item disabled" onclick="return false"><span class="nav-icon">⌂</span><span>الرئيسية</span></button><button class="nav-item active"><span class="nav-icon">▥</span><span>المالية</span></button><button class="nav-item disabled" onclick="return false"><span class="nav-icon">♙</span><span>الأطفال</span></button><button class="nav-item disabled" onclick="return false"><span class="nav-icon">⚙</span><span>الإعدادات</span></button></div></nav>`;
}
function showApp(){$("root").innerHTML=appShell();const now=new Date();$("month").value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;render()}
function setTab(t){activeTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(t==='all'?'tabAll':t==='income'?'tabIncome':'tabExpense').classList.add('active');render()}
function setNav(el){document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function navFinancial(el){setNav(el);setTab('all')}
function showComing(el,name){setNav(el);alert(`قسم ${name} سيكون متاحًا لاحقًا.`)}
let financeFilter='all';
function setFinanceFilter(filter){financeFilter=filter;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));const id=filter==='all'?'filterAll':filter==='income'?'filterIncome':'filterExpense';$(id)?.classList.add('active');render()}
function previousMonthKey(m){const d=new Date(m+'-01T00:00:00');d.setMonth(d.getMonth()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function isMonthLocked(m=monthValue()){try{return JSON.parse(localStorage.getItem('ibtisam_locked_months')||'{}')[m]===true}catch(e){return false}}
function toggleMonthLock(){const m=monthValue();let x={};try{x=JSON.parse(localStorage.getItem('ibtisam_locked_months')||'{}')}catch(e){};x[m]=!isMonthLocked(m);localStorage.setItem('ibtisam_locked_months',JSON.stringify(x));render()}
function applyMonthLockUI(locked){const badge=$('lockBadge'),btn=$('lockBtn');if(badge){badge.textContent=locked?'مقفل':'مفتوح';badge.classList.toggle('locked',locked)}if(btn)btn.textContent=locked?'فتح الشهر':'إقفال الشهر';document.querySelectorAll('.add').forEach(b=>b.disabled=locked);document.querySelectorAll('.category-actions .mini,.sub-row .mini').forEach(b=>b.disabled=locked);}
function compareMonth(list,prevList){const now=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)-list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);const prev=prevList.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)-prevList.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);if(prev===0&&now===0)return ['—','لا يوجد تغير'];if(prev===0)return [now>0?'↑ '+money(now):'↓ '+money(Math.abs(now)),'لا توجد قيمة سابقة للمقارنة'];const pct=((now-prev)/Math.abs(prev))*100;return [(pct>=0?'↑ ':'↓ ')+Math.abs(pct).toFixed(1)+'%',pct>=0?'تحسن في المتبقي':'انخفاض في المتبقي']}
function clearFinanceSearch(){const el=$('financeSearch');if(el){el.value='';el.focus();}render()}
function searchResultsHtml(allMonth,search){const q=String(search||'').trim().toLowerCase();if(!q)return '';const matches=[];for(const x of allMonth){const p=splitCategory(x.category);const hay=`${p.main} ${p.detail} ${x.amount}`.toLowerCase();if(hay.includes(q))matches.push({x,p})}const seen=new Set();const rows=[];for(const {x,p} of matches){const key=`${x.type}|${p.main}|${p.detail}|${x.amount}`;if(seen.has(key))continue;seen.add(key);rows.push(`<button type="button" class="search-result" onclick="goToSearchResult('${esc(x.type)}','${encodeURIComponent(p.main)}','${encodeURIComponent(String(x.id))}')"><div><div class="search-result-main">${esc(p.detail||p.main)}</div><div class="search-result-detail">${esc(p.detail?p.main:'العنوان الرئيسي')} · ${x.type==='income'?'الدخل':'المصروفات'}</div></div><div class="search-result-amount">${money(x.amount)}</div></button>`)}return rows.length?rows.slice(0,12).join(''):`<div class="search-empty">لا توجد نتائج مطابقة</div>`}
function goToSearchResult(type,encodedMain,id){const main=decodeURIComponent(encodedMain||'');const el=document.querySelector(`.main-category[data-category-type="${type}"][data-category-key="${encodeURIComponent(main)}"]`);if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});const entry=document.querySelector(`.sub-row button[onclick*="editEntry('${id}')"]`)?.closest('.sub-row');if(entry){entry.scrollIntoView({behavior:'smooth',block:'center'});entry.animate([{transform:'scale(1)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:450})}}}
function renderSearchResults(allMonth,search){const box=$('searchResults');if(!box)return;const q=String(search||'').trim();if(!q){box.style.display='none';box.innerHTML='';return}box.innerHTML=searchResultsHtml(allMonth,q);box.style.display='block'}
function render(){const m=monthValue();const search=($('financeSearch')?.value||'').trim().toLowerCase();const clearSearch=$('clearSearch');if(clearSearch)clearSearch.style.display=search?'block':'none';let list=entries.filter(x=>x.month.slice(0,7)===m);const allMonth=list;renderSearchResults(allMonth,search);const prevKey=previousMonthKey(m);const prevList=entries.filter(x=>x.month.slice(0,7)===prevKey);const incAll=list.filter(x=>x.type==='income'),expAll=list.filter(x=>x.type==='expense');const ti=incAll.reduce((a,x)=>a+x.amount,0),te=expAll.reduce((a,x)=>a+x.amount,0),rem=ti-te;const match=x=>{const p=splitCategory(x.category);const hay=`${p.main} ${p.detail} ${x.amount}`.toLowerCase();return !search||hay.includes(search)};if(financeFilter!=='all')list=list.filter(x=>x.type===financeFilter);list=list.filter(match);$('totalIncome').textContent=money(ti);$('totalExpense').textContent=money(te);$('remaining').textContent=money(rem);$('remaining').style.color=rem<0?'var(--red)':'var(--blue)';$('incomeRows').innerHTML=categoryGroups('income',list.filter(x=>x.type==='income'),search);$('expenseRows').innerHTML=categoryGroups('expense',list.filter(x=>x.type==='expense'),search);$('incomeTotalSmall').textContent=money(incAll.reduce((a,x)=>a+x.amount,0));$('expenseTotalSmall').textContent=money(expAll.reduce((a,x)=>a+x.amount,0));const rate=ti?te/ti*100:0;$('expenseRate').textContent=rate.toFixed(1)+'%';const cmp=compareMonth(allMonth,prevList);$('monthCompare').textContent=cmp[0];$('monthCompare').className='insight-value '+(cmp[0].startsWith('↑')?'positive':cmp[0].startsWith('↓')?'negative':'');$('monthCompareNote').textContent=cmp[1];$('expenseChart').innerHTML=expenseChart(allMonth);applyMonthLockUI(isMonthLocked(m));}
function categorySection(type,title,icon,cats,list){const total=list.reduce((a,x)=>a+x.amount,0);const cards=cats.map(cat=>{const arr=list.filter(x=>x.category===cat),sum=arr.reduce((a,x)=>a+x.amount,0);return `<div class="category-card"><div class="category-top"><div class="category-name">${esc(cat)}</div><div class="category-actions"><button class="mini" onclick="openEntryModal('${type}',null,'${esc(cat).replace(/'/g,"&#039;")}')">+ إضافة</button></div></div><div class="category-total">${money(sum)}</div><div class="entry-list">${arr.length?arr.map(x=>entryHtml(x)).join(''):''}</div></div>`}).join('');return `<section class="section ${type}-section"><div class="section-head"><div class="section-title"><div class="section-badge ${type}-badge">${icon}</div><div><h3>${title}</h3><div class="section-total">${money(total)}</div></div></div><button class="manage" onclick="manageCategories('${type}')">إدارة العناوين</button></div><div class="category-grid">${cards||'<div class="empty">لا توجد عناوين رئيسية</div>'}</div></section>`}
function entryHtml(x){return `<div class="entry ${x.type}"><div class="entry-main"><div class="entry-name">${esc(x.category)}</div><div class="entry-meta">${x.month}</div></div><div class="entry-actions"><button class="mini" onclick="editEntry('${x.id}')">تعديل</button><button class="mini" onclick="deleteEntry('${x.id}')">حذف</button></div><div class="entry-amount">${money(x.amount)}</div></div>`}
function openEntryModal(type,id=null,preCat=''){if(isMonthLocked()&&!id){return}if(isMonthLocked()&&id){showMessage('authMsg','');return}editId=id;const x=id?entries.find(e=>String(e.id)===String(id)):null;const p=x?splitCategory(x.category):{main:preCat,detail:''};const cats=getCats()[type]||[];const options=cats.map(c=>`<option value="${esc(c)}"></option>`).join('');$("sheet").innerHTML=`<h3>${id?'تعديل الحركة':type==='income'?'إضافة دخل':'إضافة مصروف'}</h3><label class="field"><span>العنوان الرئيسي</span><input id="mCategory" list="categoryOptions" type="text" value="${esc(p.main)}" placeholder="اكتب أي عنوان تريده"><datalist id="categoryOptions">${options}</datalist></label><label class="field"><span>العنوان الفرعي</span><input id="mDetail" type="text" value="${esc(p.detail)}" placeholder="اكتب العنوان الفرعي"></label><label class="field"><span>المبلغ</span><input id="mAmount" type="number" inputmode="decimal" value="${x?.amount||''}" placeholder="0"></label><div id="mMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveEntry('${type}')">حفظ</button></div>`;$("modal").classList.add('show')}
function editEntry(id){if(isMonthLocked())return;const x=entries.find(e=>String(e.id)===String(id));if(x)openEntryModal(x.type,id)}
function closeModal(){$("modal").classList.remove('show');editId=null}
async function saveEntry(type){if(busy)return;const main=$("mCategory").value.trim(),detail=$("mDetail").value.trim(),amount=Number($("mAmount").value);if(!main||!amount){showMessage('mMsg','اكتب العنوان الرئيسي والمبلغ.');return}const cats=getCats();if(!cats[type].includes(main)){cats[type].push(main);saveCats(cats)}busy=true;showMessage('mMsg','جاري الحفظ...');const category=makeCategory(main,detail);try{if(editId){const x=entries.find(e=>String(e.id)===String(editId));const {data,error}=await supabaseClient.from('financial_entries').update({month:monthValue()+'-01',type,category,amount}).eq('id',Number(editId)).select('id,month,type,category,amount').single();if(error)throw error;Object.assign(x,{id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)})}else{const {data,error}=await supabaseClient.from('financial_entries').insert({month:monthValue()+'-01',type,category,amount}).select('id,month,type,category,amount').single();if(error)throw error;entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)})}closeModal();render()}catch(e){showMessage('mMsg','تعذر الحفظ: '+e.message)}finally{busy=false}}
async function deleteEntry(id){if(isMonthLocked())return;if(!confirm('حذف هذه الحركة؟'))return;const {error}=await supabaseClient.from('financial_entries').delete().eq('id',Number(id));if(error){alert('تعذر الحذف: '+error.message);return}entries=entries.filter(x=>String(x.id)!==String(id));render()}
function renameMainCategory(type,name){
 const old=String(name);
 const cats=getCats();
 const current=old;
 $("sheet").innerHTML=`<h3>تعديل العنوان الرئيسي</h3><div class="field"><span>العنوان الرئيسي</span><input id="mainRenameInput" type="text" value="${esc(current)}" autocomplete="off"></div><div id="mainActionMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" class="primary" data-modal-action="apply-rename-main" data-type="${esc(type)}" data-name="${encodeURIComponent(old)}">حفظ التعديل</button></div>`;
 $("modal").classList.add('show');
 setTimeout(()=>{$("mainRenameInput")?.focus();},50);
}
async function applyRenameMainCategory(type,old){
 const input=$("mainRenameInput");
 const next=input?.value.trim()||'';
 if(!next){showMessage('mainActionMsg','اكتب اسم العنوان الرئيسي.');return}
 if(next===old){closeModal();return}
 const cats=getCats();
 if((cats[type]||[]).includes(next)){showMessage('mainActionMsg','هذا العنوان موجود مسبقًا.');return}
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 try{
  for(const x of affected){const category=makeCategory(next,splitCategory(x.category).detail);const {error}=await supabaseClient.from('financial_entries').update({category}).eq('id',Number(x.id));if(error)throw error;x.category=category}
  cats[type]=(cats[type]||[]).map(c=>c===old?next:c);
  if(!cats[type].includes(next))cats[type].push(next);
  saveCats(cats);closeModal();render();
 }catch(e){showMessage('mainActionMsg','تعذر التعديل: '+(e.message||e));}
}
function removeMainCategory(type,name){
 const old=String(name);
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 const count=affected.length;
 $("sheet").innerHTML=`<h3>حذف العنوان الرئيسي</h3><div class="confirm-box"><div class="confirm-title">${esc(old)}</div><div class="confirm-text">${count?`سيتم حذف ${count} حركة مرتبطة بهذا العنوان من قاعدة البيانات.`:'لا توجد حركات مرتبطة بهذا العنوان.'}</div></div><div id="mainActionMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" class="danger-solid" data-modal-action="apply-delete-main" data-type="${esc(type)}" data-name="${encodeURIComponent(old)}">حذف العنوان</button></div>`;
 $("modal").classList.add('show');
}
async function applyRemoveMainCategory(type,old){
 const cats=getCats();
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 try{
  if(affected.length){const ids=affected.map(x=>Number(x.id));const {error}=await supabaseClient.from('financial_entries').delete().in('id',ids);if(error)throw error;entries=entries.filter(x=>!ids.includes(Number(x.id)))}
  cats[type]=(cats[type]||[]).filter(c=>c!==old);saveCats(cats);closeModal();render();
 }catch(e){showMessage('mainActionMsg','تعذر الحذف: '+(e.message||e));}
}
function manageCategories(type){const cats=getCats()[type]||[];$('sheet').innerHTML=`<h3>عناوين ${type==='income'?'الدخل':'المصروفات'}</h3><div class="menu-list">${cats.map(c=>`<div class="menu-item"><span class="menu-name">${esc(c)}</span><span><button class="mini" onclick="renameMainCategory('${type}',${JSON.stringify(c)})">تعديل</button> <button class="mini danger" onclick="removeMainCategory('${type}',${JSON.stringify(c)})">حذف</button></span></div>`).join('')||'<div class="empty">لا توجد عناوين رئيسية</div>'}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px;margin-top:12px" onclick="addCategory('${type}')">+ إضافة عنوان رئيسي</button><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:8px" onclick="closeModal()">إغلاق</button>`;$('modal').classList.add('show')}

function openMonthlyReport(){const m=monthValue();const list=entries.filter(x=>x.month.slice(0,7)===m);const inc=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),rem=inc-exp;const prev=previousMonthKey(m);const prevList=entries.filter(x=>x.month.slice(0,7)===prev);const cmp=compareMonth(list,prevList);const byType=t=>{const map={};list.filter(x=>x.type===t).forEach(x=>{const p=splitCategory(x.category);map[p.main]=(map[p.main]||0)+x.amount});return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="menu-item"><span class="menu-name">${esc(k)}</span><strong>${money(v)}</strong></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'};$('sheet').innerHTML=`<h3>تقرير ${m}</h3><div class="insights" style="margin-top:0"><div class="insight"><div class="insight-title">الدخل</div><div class="insight-value positive">${money(inc)}</div></div><div class="insight"><div class="insight-title">المصروفات</div><div class="insight-value negative">${money(exp)}</div></div><div class="insight"><div class="insight-title">المتبقي</div><div class="insight-value ${rem<0?'negative':'positive'}">${money(rem)}</div></div><div class="insight"><div class="insight-title">مقارنة السابق</div><div class="insight-value">${cmp[0]}</div></div></div><h4>تفاصيل الدخل</h4><div class="menu-list">${byType('income')}</div><h4>تفاصيل المصروفات</h4><div class="menu-list">${byType('expense')}</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إغلاق</button><button class="primary" onclick="printMonthlyReport('${m}')">طباعة / PDF</button></div>`;$('modal').classList.add('show')}
function printMonthlyReport(m){
 const list=entries.filter(x=>x.month.slice(0,7)===m),inc=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),rem=inc-exp,prev=previousMonthKey(m),prevList=entries.filter(x=>x.month.slice(0,7)===prev),cmp=compareMonth(list,prevList),rate=inc?exp/inc*100:0;
 const monthLabel=new Date(m+'-01T00:00:00').toLocaleDateString('ar-SA',{month:'long',year:'numeric'});
 const logoSrc=document.querySelector('.logo img')?.getAttribute('src')||'ibtisam-icon-full-512.png';
 function section(type,label){
  const groups={};
  list.filter(x=>x.type===type).forEach(x=>{const p=splitCategory(x.category);(groups[p.main]??=[]).push(x)});
  const names=Object.entries(groups).sort((a,b)=>b[1].reduce((q,x)=>q+x.amount,0)-a[1].reduce((q,x)=>q+x.amount,0));
  return `<div class="print-section"><h3>${label}</h3>${names.length?names.map(([main,items])=>{const total=items.reduce((q,x)=>q+x.amount,0);return `<div class="print-cat"><div class="print-cat-head"><span>${esc(main)}</span><span>${money(total)}</span></div>${items.map(x=>{const p=splitCategory(x.category);return `<div class="print-sub"><div><div class="print-sub-name">${esc(p.detail||'بدون عنوان فرعي')}</div><div class="print-sub-main">${esc(x.month)}</div></div><div class="print-sub-amount">${money(x.amount)}</div></div>`}).join('')}</div>`}).join(''):'<div class="empty">لا توجد بيانات لهذا الشهر.</div>'}</div>`;
 }
 $('printReport').innerHTML=`<div class="print-report"><header class="print-head"><div class="print-brand"><img class="print-logo" src="${esc(logoSrc)}"><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div><div class="print-title"><h2>التقرير المالي الشهري</h2><p>${esc(monthLabel)}</p></div></header><div class="print-summary"><div class="print-card print-income"><div class="k">إجمالي الدخل</div><div class="v">${money(inc)}</div></div><div class="print-card print-expense"><div class="k">إجمالي المصروفات</div><div class="v">${money(exp)}</div></div><div class="print-card print-remain"><div class="k">${rem<0?'العجز':'المتبقي'}</div><div class="v">${money(rem)}</div></div></div><div class="print-meta"><div class="print-meta-box"><strong>نسبة المصروفات من الدخل</strong><span>${rate.toFixed(1)}%</span></div><div class="print-meta-box"><strong>مقارنة بالشهر السابق</strong><span>${esc(cmp[0])} — ${esc(cmp[1])}</span></div></div>${section('income','تفاصيل الدخل')}${section('expense','تفاصيل المصروفات')}<footer class="print-footer"><span>تقرير ${esc(monthLabel)}</span><span>مركز ابتسام لرياض الأطفال</span></footer></div>`;
 $('printReport').setAttribute('aria-hidden','false'); const oldTitle=document.title; document.title=`تقرير مالي - ${monthLabel} - مركز ابتسام`;
 setTimeout(()=>{window.print();setTimeout(()=>{$('printReport').setAttribute('aria-hidden','true');document.title=oldTitle},700)},100);
}
function openSettings(){const c=getCats();$("sheet").innerHTML=`<h3>الإعدادات</h3><div class="menu-list"><button class="menu-item" onclick="manageCategories('income')"><span class="menu-name">عناوين الدخل</span><span>›</span></button><button class="menu-item" onclick="manageCategories('expense')"><span class="menu-name">عناوين المصروفات</span><span>›</span></button><button class="menu-item" onclick="signOut()"><span class="menu-name danger">تسجيل الخروج</span><span>›</span></button></div><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:12px" onclick="closeModal()">إغلاق</button>`;$("modal").classList.add('show')}
async function signOut(){closeModal();await supabaseClient.auth.signOut();$("root").innerHTML=authScreen()}
boot();
</script>
