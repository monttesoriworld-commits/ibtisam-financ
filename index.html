function seedChildrenFromOctoberIncome(){
  const targetMonth='2026-10';
  const source=entries.filter(x=>x.type==='income'&&x.month.slice(0,7)===targetMonth&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail.trim());
  if(!source.length)return 0;
  const list=getChildren();
  const counts=new Map();
  list.forEach(c=>{const name=String(c.name||'').trim();if(name)counts.set(name,(counts.get(name)||0)+1)});
  let added=0;
  source.forEach(x=>{
    const name=splitCategory(x.category).detail.trim();
    const amount=Number(x.amount)||0;
    const have=counts.get(name)||0;
    const needed=source.filter(y=>splitCategory(y.category).detail.trim()===name).length;
    if(have>=needed)return;
    list.push({id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+added,name,guardian:'',phone:'',subscriptionType:'شهري',subscription:amount,startDate:'2026-10-01',endDate:'',sessionsTotal:16,sessionsUsed:0,sessionRecords:{}});
    counts.set(name,have+1);

  });

}

function childRowFromLocal(c){return {id:String(c.id),name:String(c.name||''),guardian:String(c.guardian||''),phone:String(c.phone||''),subscription_type:String(c.subscriptionType||'شهري'),subscription:Number(c.subscription||0),start_date:c.startDate||null,end_date:c.endDate||null,sessions_total:Number(c.sessionsTotal||16),sessions_used:Number(c.sessionsUsed||0),session_records:c.sessionRecords&&typeof c.sessionRecords==='object'?c.sessionRecords:{},manual_remaining:Number.isFinite(Number(c.manualRemaining))?Number(c.manualRemaining):null,created_at:c.createdAt||undefined,updated_at:new Date().toISOString()}}

async function loadChildrenFromSupabase(){
  if(!supabaseClient) return;
  const {data,error}=await supabaseClient.from('children').select('*').order('created_at',{ascending:false});
  if(error) throw new Error(error.message);

  // Supabase هو المصدر الأساسي للأطفال. لا ندمج localStorage مع الخادم
  // لأن ذلك كان يسبب ظهور نفس الطفل مرتين عندما تختلف الـ IDs.
  const rows=Array.isArray(data)?data:[];
  const seen=new Map();
  const duplicates=[];

  for(const r of rows){
    const name=String(r.name||'').trim().replace(/\s+/g,' ').toLowerCase();
    const guardian=String(r.guardian||'').trim().replace(/\s+/g,' ').toLowerCase();
    const phone=String(r.phone||'').replace(/\s+/g,'');
    const key=name+'|'+guardian+'|'+phone;
    if(!name){
      duplicates.push(r);
      continue;
    }
    if(seen.has(key)){
      // البيانات مرتبة من الأحدث إلى الأقدم، لذلك نحتفظ بالأحدث.
      duplicates.push(r);
      continue;
    }
    seen.set(key,r);
  }

  const uniqueRows=[...seen.values()];
  const unique=uniqueRows.map(childFromRow);

  // حذف النسخ المكررة من Supabase حتى لا تعود في أي جهاز لاحقاً.
  if(duplicates.length){
    const ids=duplicates.map(r=>String(r.id)).filter(Boolean);
    if(ids.length){
      const {error:delErr}=await supabaseClient.from('children').delete().in('id',ids);
      if(delErr) console.warn('تعذر تنظيف النسخ المكررة من Supabase:',delErr.message);
    }
  }

  saveChildren(unique);
  return unique;
}
async function syncChildToSupabase(child){
  if(!supabaseClient||!child)return;

  const {error}=await supabaseClient.from('children').upsert(row,{onConflict:'id'});
  if(error) throw new Error(error.message);
}
async function deleteChildFromSupabase(id){

}

}

function sessionDate(child,n,m=childrenSessionMonth()){if(!child?.startDate)return null;const [y,mo]=m.split('-').map(Number);if(!y||!mo)return null;const monthStart=new Date(y,mo-1,1),monthEnd=new Date(y,mo,0),start=new Date(child.startDate+'T00:00:00'),end=child.endDate?new Date(child.endDate+'T00:00:00'):null;if(isMonthlyChild(child)&&String(child.startDate||'').slice(0,7)!==m)return null;if(start>monthEnd||(end&&end<monthStart))return null;const d=new Date(monthStart);if(start>monthStart)d.setTime(start.getTime());let count=0,guard=0;while(d.getMonth()===mo-1&&guard<40){if(isWorkday(d)){count++;if(count===n)return new Date(d)}d.setDate(d.getDate()+1);guard++}return null}
function sessionEffectiveStatus(child,n,m=childrenSessionMonth()){const records=getSessionRecords(child,m),explicit=records[String(n)];if(explicit)return explicit;const d=sessionDate(child,n,m);if(!d)return 'pending';const today=new Date();today.setHours(0,0,0,0);return d<today?'attended':'pending'}

function migrateSessionRecordsV3(){
  const flag='ibtisam_sessions_weekend_fix_v3';
  if(localStorage.getItem(flag)) return;
  const list=getChildren();
  let changed=false;
  list.forEach(c=>{
    if(c&&c.sessionRecords&&typeof c.sessionRecords==='object'){
      const cleaned={};
      Object.entries(c.sessionRecords).forEach(([k,v])=>{
        // Any old automatic attendance saved by the previous version is removed.
        // Keep explicit absences so the user's postponement records are not lost.
        if(v==='absent') cleaned[k]=v;
      });
      if(JSON.stringify(cleaned)!==JSON.stringify(c.sessionRecords)){
        c.sessionRecords=cleaned;
        c.sessionsUsed=undefined;
        changed=true;
      }
    }
  });
  if(changed) saveChildren(list);
  localStorage.setItem(flag,'1');
}

async function saveChild(){
  const btn=$('saveChildBtn');
  if(btn && btn.dataset.saving==='1') return;
  const name=$('cName')?.value.trim()||'',
        guardian=$('cGuardian')?.value.trim()||'',
        phone=$('cPhone')?.value.trim()||'',
        subscriptionType=$('cSubscriptionType')?.value.trim()||'شهري',
        subscription=Number($('cSubscription')?.value||0),
        sessionsTotal=Math.max(1,Number($('cSessions')?.value||16)),
        startDate=$('cStart')?.value||'',
        endDateInput=$('cEnd')?.value||'',
        endDate=endDateInput||calculatedChildEndDate(subscriptionType,startDate);
  if(!name){showMessage('cMsg','اكتب اسم الطفل.');$('cName')?.focus();return}
  if(subscription<0){showMessage('cMsg','قيمة الاشتراك غير صحيحة.');return}
  if(startDate&&endDate&&endDate<startDate){showMessage('cMsg','تاريخ نهاية الاشتراك يجب أن يكون بعد تاريخ البداية.');return}
  if(btn){btn.dataset.saving='1';btn.disabled=true}
  try{
    const list=getChildren();
    const normalizedName=normalizeChildName(name);
    const duplicate=list.find(x=>normalizeChildName(x.name)===normalizedName && String(x.id)!==String(childrenEditId||''));
    if(duplicate){showMessage('cMsg','هذا الطفل موجود مسبقًا. استخدم «تعديل» بدل إضافة نسخة جديدة.');if(btn){btn.disabled=false;btn.dataset.saving='0'}return}

    if(childrenEditId){
      const i=list.findIndex(x=>String(x.id)===String(childrenEditId));
      if(i<0) throw new Error('تعذر العثور على الطفل.');
      const old=list[i];
      const updated={...old,name,guardian,phone,subscriptionType,subscription,sessionsTotal,
        sessionsUsed:Math.min(childSessionsUsed(old),sessionsTotal),
        sessionRecords:old.sessionRecords||{},
        manualRemaining:Number.isFinite(Number(old.manualRemaining))?Math.min(Number(old.manualRemaining),sessionsTotal):undefined,
        startDate,endDate};
      await syncChildToSupabase(updated);
      list[i]=updated;
      saveChildren(list);
      closeModal();renderChildren();return;
    }

    const created={id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name,guardian,phone,subscriptionType,subscription,sessionsTotal,sessionsUsed:0,sessionRecords:{},startDate,endDate};
    await syncChildToSupabase(created);
    list.unshift(created);
    saveChildren(list);
    renderChildren();
    $('cName').value='';$('cGuardian').value='';$('cPhone').value='';$('cSubscriptionType').value='شهري';$('cSubscription').value='';$('cSessions').value='16';$('cStart').value='';$('cEnd').value='';
    showMessage('cMsg','انضاف الطفل بنجاح ✓');
    if(btn){btn.disabled=false;btn.dataset.saving='0';btn.textContent='حفظ وإضافة طفل آخر'}
    setTimeout(()=>$('cName')?.focus(),50);
  }catch(e){
    showMessage('cMsg','تعذر حفظ الطفل: '+(e?.message||'خطأ غير معروف'));
    if(btn){btn.disabled=false;btn.dataset.saving='0'}
  }
}

function openEditChildPayment(childId,paymentId){const c=getChildren().find(x=>String(x.id)===String(childId));const p=entries.find(x=>String(x.id)===String(paymentId));if(!c||!p)return;const m=String(p.month).slice(0,7);if(isMonthLocked(m)){alert('هذا الشهر مقفل ولا يمكن تعديل الدفعة.');return}const otherPaid=entries.filter(x=>String(x.id)!==String(p.id)&&x.type==='income'&&x.month.slice(0,7)===m&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===c.name).reduce((a,x)=>a+x.amount,0);const max=Math.max(Number(c.subscription||0)-otherPaid,0);const currentDate=p.createdAt?String(p.createdAt).slice(0,10):String(p.month).slice(0,7)+'-01';$('sheet').innerHTML=`<h3>تعديل الدفعة</h3><div class="hint" style="margin-bottom:10px"><strong>${esc(c.name)}</strong><br>قيمة الاشتراك: ${money(c.subscription)} · الدفعة الحالية: ${money(p.amount)} · أقصى مبلغ: ${money(max)}</div><label class="field"><span>المبلغ المقبوض الفعلي</span><input id="epAmount" type="number" inputmode="decimal" value="${Number(p.amount)||0}" max="${max}" placeholder="0"></label><label class="field"><span>تاريخ القبض</span><input id="epDate" type="date" value="${esc(currentDate)}"></label><div class="hint">إذا استلمت جزءًا فقط من المبلغ، عدّل المبلغ والتاريخ حسب المقبوض الفعلي.</div><div id="epMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveEditedChildPayment('${esc(c.id)}','${esc(p.id)}')">حفظ التعديل</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('epAmount')?.focus(),50)}
async function saveEditedChildPayment(childId,paymentId){if(busy)return;const c=getChildren().find(x=>String(x.id)===String(childId));const p=entries.find(x=>String(x.id)===String(paymentId));if(!c||!p)return;const amount=Number($('epAmount').value),date=$('epDate').value||String(p.month).slice(0,7)+'-01',m=date.slice(0,7);if(isMonthLocked(String(p.month).slice(0,7))||isMonthLocked(m)){showMessage('epMsg','هذا الشهر مقفل ولا يمكن تعديل الدفعة.');return}const otherPaid=entries.filter(x=>String(x.id)!==String(p.id)&&x.type==='income'&&x.month.slice(0,7)===m&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===c.name).reduce((a,x)=>a+x.amount,0);const max=Math.max(Number(c.subscription||0)-otherPaid,0);if(!amount||amount<=0){showMessage('epMsg','اكتب مبلغ المقبوض الفعلي.');return}if(amount>max){showMessage('epMsg',`أقصى مبلغ مسموح لهذه الدفعة ${money(max)}.`);return}busy=true;showMessage('epMsg','جاري حفظ التعديل...');try{const {data,error}=await supabaseClient.from('financial_entries').update({month:m+'-01',amount,created_at:paymentTimestamp(date)}).eq('id',Number(p.id)).select('id,month,type,category,amount,created_at').single();if(error)throw error;Object.assign(p,{id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount),createdAt:data.created_at||paymentTimestamp(date)});closeModal();renderChildren();setTimeout(()=>openChildDetails(childId),80)}catch(e){showMessage('epMsg','تعذر تعديل الدفعة: '+e.message)}finally{busy=false}}
async function saveChildPayment(id){if(busy)return;const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;const amount=Number($('pAmount').value),date=$('pDate').value||new Date().toISOString().slice(0,10);const m=date.slice(0,7);const paid=childPaidThisMonth(c.name,m),remain=Math.max(Number(c.subscription||0)-paid,0);if(!amount||amount<=0){showMessage('pMsg','اكتب مبلغ المقبوض.');return}if(amount>remain){showMessage('pMsg',`المتبقي فقط ${money(remain)}.`);return}busy=true;showMessage('pMsg','جاري تسجيل الدفعة...');try{const {data,error}=await supabaseClient.from('financial_entries').insert({month:m+'-01',type:'income',category:makeCategory('اشتراك الأطفال',c.name),amount,created_at:paymentTimestamp(date)}).select('id,month,type,category,amount,created_at').single();if(error)throw error;entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount),createdAt:data.created_at||paymentTimestamp(date)});closeModal();localStorage.setItem('ibtisam_children_month',m);renderChildren()}catch(e){showMessage('pMsg','تعذر تسجيل الدفعة: '+e.message)}finally{busy=false}}

function authScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div><h2>تسجيل الدخول</h2><p>سجّل الدخول بحساب Supabase المرتبط بالموقع.</p><label class="field"><span>البريد الإلكتروني</span><input id="email" type="email" autocomplete="email"></label><label class="field"><span>كلمة المرور</span><input id="password" type="password" autocomplete="current-password"></label><div id="authMsg" class="msg">${esc(message)}</div><div style="display:flex;gap:8px"><button class="primary" style="flex:1;padding:13px;border-radius:13px" onclick="signIn()">دخول</button><button class="ghost" style="flex:1;padding:13px;border-radius:13px" onclick="signUp()">إنشاء حساب</button></div><button class="ghost" style="width:100%;margin-top:9px;padding:12px;border-radius:13px" onclick="changeKey()">تغيير المفتاح</button></div></div>`}
async function boot(){const key=localStorage.getItem(KEY_STORAGE);if(!key){$("root").innerHTML=keyScreen();return}try{supabaseClient=window.supabase.createClient(SUPABASE_URL,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data:{session},error}=await supabaseClient.auth.getSession();if(error)throw error;if(session){await loadEntries();await loadChildrenFromSupabase();await loadEmployeesFromSupabase();showApp()}else $("root").innerHTML=authScreen()}catch(e){console.error("Supabase boot error",e);$("root").innerHTML=authScreen("تعذر الاتصال بـ Supabase حالياً. اضغط دخول مرة أخرى للمحاولة.") }}
function saveKey(){const key=$("sbKey").value.trim();if(!key){showMessage("keyMsg","أدخل المفتاح أولًا.");return}localStorage.setItem(KEY_STORAGE,key);boot()}

async function signIn(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}if(!supabaseClient){showMessage("authMsg","تعذر تهيئة الاتصال. اضغط تغيير المفتاح ثم أدخل المفتاح مرة أخرى.");return}showMessage("authMsg","جاري الاتصال بـ Supabase...");let lastError=null;for(let attempt=1;attempt<=3;attempt++){try{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){showMessage("authMsg",error.message||"تعذر تسجيل الدخول");return}if(!data?.session){showMessage("authMsg","تم الاتصال لكن لم يتم إنشاء جلسة دخول. حاول مرة أخرى.");return}await loadEntries();await loadChildrenFromSupabase();await loadEmployeesFromSupabase();showApp();return}catch(e){lastError=e;const msg=String(e?.message||e||"");console.error("Supabase sign-in attempt",attempt,e);if(!/load failed|failed to fetch|network|fetch/i.test(msg))break;if(attempt<3){showMessage("authMsg","تعذر الاتصال مؤقتاً... إعادة المحاولة "+attempt+"/2");await new Promise(r=>setTimeout(r,1200*attempt))}}}const msg=String(lastError?.message||lastError||"");if(/load failed|failed to fetch|network|fetch/i.test(msg)){showMessage("authMsg","الاتصال بخدمة Supabase لم يكتمل. جرّبت الاتصال 3 مرات. لا تغيّر المفتاح؛ جرّب بعد دقيقة أو من شبكة أخرى.")}else showMessage("authMsg","تعذر تسجيل الدخول: "+msg)}
async function signUp(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}if(password.length<6){showMessage("authMsg","كلمة المرور 6 أحرف على الأقل.");return}const {data,error}=await supabaseClient.auth.signUp({email,password});if(error){showMessage("authMsg",error.message);return}if(data.session){await loadEntries();await loadChildrenFromSupabase();await loadEmployeesFromSupabase();showApp()}else showMessage("authMsg","تم إنشاء الحساب. إذا طُلب تأكيد البريد، أكده ثم سجّل الدخول.")}
async function loadEntries(){const {data,error}=await supabaseClient.from("financial_entries").select("id,month,type,category,amount,created_at").order("created_at",{ascending:true});if(error)throw new Error(error.message);entries=(data||[]).map(x=>({id:String(x.id),month:String(x.month).slice(0,10),type:x.type,category:x.category,amount:Number(x.amount),createdAt:x.created_at||''}));}
function splitCategory(v){const parts=String(v||'').split('::');return {main:parts[0]||'',detail:parts.slice(1).join('::')||''}}
function makeCategory(main,detail){return detail?.trim()?main+'::'+detail.trim():main}
function categoryHash(v){return 'cat_'+encodeURIComponent(String(v)).replace(/%/g,'_').replace(/[^a-zA-Z0-9_]/g,'').slice(0,80)}
function toggleCategory(id){const el=$(id);if(el)el.classList.toggle('open')}
function categoryGroups(type,list,search=''){const base=getCats()[type]||[];const q=String(search||'').trim().toLowerCase();const discovered=list.map(x=>splitCategory(x.category).main).filter(Boolean);let cats=[...base,...discovered.filter(c=>!base.includes(c))];if(q)cats=cats.filter(cat=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);return cat.toLowerCase().includes(q)||arr.length>0});return cats.map((cat,idx)=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);const sum=arr.reduce((a,x)=>a+x.amount,0);const id=categoryHash(type+'|'+cat+'|'+idx);const safeType=esc(type);const encodedCat=encodeURIComponent(String(cat));const matched=q&&arr.length>0;const open=matched||(!q&&false);return `<div class="main-category ${type}${open?' open':''}" id="${id}" data-category-type="${safeType}" data-category-key="${encodedCat}"><div class="category-toggle" role="button" tabindex="0" onclick="toggleCategory('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCategory('${id}')}"><div class="main-left"><div class="main-icon">${type==='income'?'↗':'↘'}</div><div><div class="main-name">${esc(cat)}</div><div class="main-total">${money(sum)}</div></div></div><div class="category-actions"><button type="button" class="mini" data-action="rename-main" data-type="${safeType}" data-name="${encodedCat}">تعديل</button><button type="button" class="mini danger" data-action="delete-main" data-type="${safeType}" data-name="${encodedCat}"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button><span class="chev" aria-hidden="true">⌄</span></div></div><div class="sub-list">${arr.length?arr.map(x=>subEntryHtml(x)).join(''):`<div class="empty">${q?'لا توجد نتائج مطابقة':'لا توجد تفاصيل بعد'}</div>`}<button type="button" class="mini" style="justify-self:start" onclick="event.stopPropagation();openEntryModal('${safeType}',null,decodeURIComponent('${encodedCat}'))">+ إضافة عنوان فرعي</button></div></div>`}).join('')}
function mainCategoryAction(event,button){event.preventDefault();event.stopPropagation();const type=button.dataset.type;const name=decodeURIComponent(button.dataset.name||'');if(button.dataset.action==='rename-main')renameMainCategory(type,name);else if(button.dataset.action==='delete-main')removeMainCategory(type,name)}

function employeePayrollStatus(e,m=monthValue()){const paid=employeePaidThisMonth(e,m),due=payrollAmount(e);return {paid,due,done:due>0&&paid>=due}}
async function setEmployeeOfMonth(id){
 const list=getEmployees(),m=monthValue();
 const currentId=employeeOfMonthIdForMonth(m);
 const same=currentId&&String(currentId)===String(id);
 list.forEach(e=>{e.employeeOfMonthByMonth={...(e.employeeOfMonthByMonth||{})};e.employeeOfMonthByMonth[m]=null;});
 if(!same){const selected=list.find(e=>String(e.id)===String(id));if(selected)selected.employeeOfMonthByMonth[m]=String(id)}
 saveEmployees(list);
 renderEmployeesPage();
 try{
   if(supabaseClient){
     for(const e of list){
       const {error}=await supabaseClient.from('employees').update({employee_of_month_by_month:e.employeeOfMonthByMonth,updated_at:new Date().toISOString()}).eq('id',String(e.id));
       if(error)throw error
     }
   }
 }catch(e){console.warn('تعذر مزامنة موظفة الشهر مع Supabase:',e.message||e);}
}
function employeeTodayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function employeeLeaveForDate(e,date){return (e.leaveRecords||[]).find(x=>x.start<=date&&x.end>=date)||null}
function annualLeaveSummary(e,year=new Date().getFullYear()){
 const records=Array.isArray(e?.leaveRecords)?e.leaveRecords:[];
 const used=records.filter(x=>x&&x.type==='سنوية'&&String(x.start||'').slice(0,4)===String(year))
  .reduce((sum,x)=>{
   const stored=Number(x.days);
   if(Number.isFinite(stored)&&stored>=0)return sum+stored;
   const start=String(x.start||''),end=String(x.end||'');
   if(!start||!end||end<start)return sum;
   return sum+Math.floor((new Date(end+'T12:00:00')-new Date(start+'T12:00:00'))/86400000)+1;
  },0);
 const total=22;
 return {total,used,remaining:Math.max(total-used,0)};
}

function employeeDayStatus(e,date){const leave=employeeLeaveForDate(e,date);if(leave)return 'إجازة';return e.attendanceByMonth?.[date.slice(0,7)]?.[date]||'حضور'}
function employeeAttendanceSummary(e,m=monthValue()){const records=e.attendanceByMonth?.[m]||{},[y,mo]=m.split('-').map(Number),start=new Date(y,mo-1,1),today=new Date();today.setHours(0,0,0,0);const end=m===today.toISOString().slice(0,7)?today:new Date(y,mo,0);let workdays=0,leave=0,absent=0,late=0;for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){if(!isWorkday(d))continue;workdays++;const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,lv=employeeLeaveForDate(e,key);if(lv)leave++;else if(records[key]==='غياب')absent++;else if(records[key]==='تأخير')late++}return {present:Math.max(0,workdays-leave-absent),absent,late,leave,workdays}}
function employeeAttendanceCalendarHtml(e,m){const [y,mo]=m.split('-').map(Number),today=new Date();today.setHours(0,0,0,0);const last=m===today.toISOString().slice(0,7)?today:new Date(y,mo,0);let html='';for(let d=new Date(y,mo-1,1);d<=last;d.setDate(d.getDate()+1)){if(!isWorkday(d))continue;const date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,status=employeeDayStatus(e,date),cls=status==='غياب'?'absent':status==='تأخير'?'late':status==='إجازة'?'leave':'attended',mark=status==='غياب'?'×':status==='تأخير'?'!':status==='إجازة'?'إ':'✓';const dateLabel=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;html+=`<button type="button" class="employee-day ${cls}" ${status==='إجازة'?'disabled':''} aria-label="${dateLabel} · ${status}" title="${dateLabel} · ${status}" onclick="markEmployeeAttendance('${esc(e.id)}','${date}')"><strong>${d.getDate()}</strong><span>${mark}</span><small>${dateLabel}</small></button>`}return `<div class="employee-calendar">${html||'<small>لا توجد أيام عمل في هذا الشهر حتى الآن.</small>'}</div>`}
async function markEmployeeAttendance(id,date){const e=getEmployees().find(x=>String(x.id)===String(id));if(!e)return;const m=date.slice(0,7);if(employeeLeaveForDate(e,date)){alert('هذا اليوم مسجل إجازة، ولا يُحتسب حضورًا.');return}e.attendanceByMonth={...(e.attendanceByMonth||{})};e.attendanceByMonth[m]={...(e.attendanceByMonth[m]||{})};const day=e.attendanceByMonth[m],current=day[date]||'حضور';if(current==='حضور')day[date]='غياب';else if(current==='غياب')day[date]='تأخير';else delete day[date];try{await saveEmployeeExtra(e);openEmployeeDetails(e.id)}catch(err){alert('تعذر حفظ التحضير: '+(err.message||err))}}

async function saveEmployee(id=''){const name=$('eName')?.value.trim()||'',employeeNo=$('eNo')?.value.trim()||'',job=$('eJob')?.value.trim()||'',email=$('eEmail')?.value.trim()||'',phone=$('ePhone')?.value.trim()||'',salary=Number($('eSalary')?.value||0),allowancesEnabled=$('eAllow')?.value==='1',allowanceAmount=Number($('eAllowanceAmount')?.value||0),contractStart=$('eContract')?.value||'',active=$('eActive')?.value!=='0';if(!name){showMessage('eMsg','اكتبي اسم الموظفة.');return}if(!Number.isFinite(salary)||salary<0){showMessage('eMsg','اكتبي راتبًا أساسيًا صحيحًا.');return}if(!contractStart){showMessage('eMsg','اختاري تاريخ بداية العقد.');return}const list=getEmployees();const old=id?list.find(x=>String(x.id)===String(id)):null;const ratings={...(old?.ratings||{})};const current=$('eRateCurrent')?.value||'';const prev=$('eRatePrev')?.value||'';if(current)ratings[monthValue()]=current;else delete ratings[monthValue()];if(prev)ratings[previousMonthKey(monthValue())]=prev;else delete ratings[previousMonthKey(monthValue())];const contractEnd=employeeContractEnd({contractStart,startDate:contractStart});const data={name,employeeNo,job,email,phone,salary,allowancesEnabled,allowanceAmount,contractStart,startDate:contractStart,contractEnd,active,ratings,isEmployeeOfMonth:!!old?.isEmployeeOfMonth,employeeOfMonthByMonth:{...(old?.employeeOfMonthByMonth||{})},attendanceByMonth:{...(old?.attendanceByMonth||{})},leaveRecords:[...(old?.leaveRecords||[])]};let saved;if(id){const i=list.findIndex(x=>String(x.id)===String(id));if(i<0)return;list[i]={...list[i],...data};saved=list[i]}else{saved={id:'e_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),...data,createdAt:new Date().toISOString()};list.unshift(saved)}try{await syncEmployeeToSupabase(saved);saveEmployees(list);closeModal();renderEmployeesPage()}catch(e){showMessage('eMsg','تعذر حفظ الموظفة في Supabase: '+(e.message||e))}}

async function payEmployeeSalary(id){if(busy)return;const e=getEmployees().find(x=>String(x.id)===String(id));if(!e)return;const m=monthValue(),pay=employeePayrollStatus(e,m);if(isMonthLocked(m))return alert('هذا الشهر مقفل ولا يمكن تعديل حالة الراتب.');busy=true;try{if(pay.done){if(!confirm(`إلغاء تسليم راتب ${e.name} وإعادته إلى حالة «لم يتم التسليم»؟`)){busy=false;return}const matches=entries.filter(x=>x.type==='expense'&&x.month.slice(0,7)===m&&splitCategory(x.category).main==='الرواتب'&&splitCategory(x.category).detail.trim()===String(e.name||'').trim());for(const x of matches){const {error}=await supabaseClient.from('financial_entries').delete().eq('id',Number(x.id));if(error)throw error}entries=entries.filter(x=>!matches.some(y=>String(y.id)===String(x.id)));renderEmployeesPage();return}const amount=pay.due;if(!amount)return alert('حددي الراتب الأساسي أولاً.');if(!confirm(`تسجيل تسليم راتب ${e.name} بمبلغ ${money(amount)} ضمن مصروفات الرواتب؟`))return;const date=new Date().toISOString().slice(0,10);const {data,error}=await supabaseClient.from('financial_entries').insert({month:m+'-01',type:'expense',category:makeCategory('الرواتب',e.name),amount,created_at:paymentTimestamp(date)}).select('id,month,type,category,amount,created_at').single();if(error)throw error;entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount),createdAt:data.created_at||paymentTimestamp(date)});renderEmployeesPage()}catch(err){alert('تعذر تعديل حالة الراتب: '+(err.message||err))}finally{busy=false}}
function employeeOfMonthHtml(){const id=employeeOfMonthIdForMonth();const e=getEmployees().find(x=>String(x.id)===String(id));if(!e)return '';return `<section class="employee-of-month"><div class="employee-of-month-head"><h3>موظفة الشهر</h3><span>${esc(monthValue())}</span></div><div class="employee-of-month-box"><div class="employee-avatar">${esc(String(e.name||'م').trim().slice(0,1))}</div><div><div class="employee-of-month-name">${esc(e.name)}</div><div class="employee-of-month-job">${esc(e.job||'')}</div></div></div></section>`}

function previousMonthKey(m){const d=new Date(m+'-01T00:00:00');d.setMonth(d.getMonth()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}

function applyMonthLockUI(locked){const badge=$('lockBadge'),btnText=$('lockBtnText'),btnIcon=$('lockBtnIcon'),icon=$('lockIcon'),iconWrap=$('lockIconWrap');if(badge){badge.textContent=locked?'مقفل':'مفتوح';badge.classList.toggle('locked',locked)}if(btnText)btnText.textContent=locked?'فتح الشهر':'قفل الشهر';if(btnIcon)btnIcon.textContent=locked?'♙':'⌑';if(icon)icon.textContent=locked?'♙':'⌑';if(iconWrap){iconWrap.style.background=locked?'#fff0f1':'#eafaf3';iconWrap.style.borderColor=locked?'#f3c7d0':'#ccefe0';iconWrap.style.color=locked?'var(--red)':'var(--green)'}document.querySelectorAll('.add').forEach(b=>b.disabled=locked);document.querySelectorAll('.category-actions .mini,.sub-row .mini').forEach(b=>b.disabled=locked);}
function compareMonth(list,prevList){const now=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)-list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);const prev=prevList.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)-prevList.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);if(prev===0&&now===0)return ['—','لا يوجد تغير'];if(prev===0)return [now>0?'↑ '+money(now):'↓ '+money(Math.abs(now)),'لا توجد قيمة سابقة للمقارنة'];const pct=((now-prev)/Math.abs(prev))*100;return [(pct>=0?'↑ ':'↓ ')+Math.abs(pct).toFixed(1)+'%',pct>=0?'تحسن في المتبقي':'انخفاض في المتبقي']}

function searchResultsHtml(allMonth,search){const q=String(search||'').trim().toLowerCase();if(!q)return '';const matches=[];for(const x of allMonth){const p=splitCategory(x.category);const hay=`${p.main} ${p.detail} ${x.amount}`.toLowerCase();if(hay.includes(q))matches.push({x,p})}const seen=new Set();const rows=[];for(const {x,p} of matches){const key=`${x.type}|${p.main}|${p.detail}|${x.amount}`;if(seen.has(key))continue;seen.add(key);rows.push(`<button type="button" class="search-result" onclick="goToSearchResult('${esc(x.type)}','${encodeURIComponent(p.main)}','${encodeURIComponent(String(x.id))}')"><div><div class="search-result-main">${esc(p.detail||p.main)}</div><div class="search-result-detail">${esc(p.detail?p.main:'العنوان الرئيسي')} · ${x.type==='income'?'الدخل':'المصروفات'}</div></div><div class="search-result-amount">${money(x.amount)}</div></button>`)}return rows.length?rows.slice(0,12).join(''):`<div class="search-empty">لا توجد نتائج مطابقة</div>`}
function goToSearchResult(type,encodedMain,id){const main=decodeURIComponent(encodedMain||'');const el=document.querySelector(`.main-category[data-category-type="${type}"][data-category-key="${encodeURIComponent(main)}"]`);if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});const entry=document.querySelector(`.sub-row button[onclick*="editEntry('${id}')"]`)?.closest('.sub-row');if(entry){entry.scrollIntoView({behavior:'smooth',block:'center'});entry.animate([{transform:'scale(1)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:450})}}}
function renderSearchResults(allMonth,search){const box=$('searchResults');if(!box)return;const q=String(search||'').trim();if(!q){box.style.display='none';box.innerHTML='';return}box.innerHTML=searchResultsHtml(allMonth,q);box.style.display='block'}
function render(){const m=monthValue();const search=($('financeSearch')?.value||'').trim().toLowerCase();const clearSearch=$('clearSearch');if(clearSearch)clearSearch.style.display=search?'block':'none';let list=entries.filter(x=>x.month.slice(0,7)===m);const allMonth=list;renderSearchResults(allMonth,search);const prevKey=previousMonthKey(m);const prevList=entries.filter(x=>x.month.slice(0,7)===prevKey);const incAll=list.filter(x=>x.type==='income'),expAll=list.filter(x=>x.type==='expense');const ti=incAll.reduce((a,x)=>a+x.amount,0),te=expAll.reduce((a,x)=>a+x.amount,0),rem=ti-te;const match=x=>{const p=splitCategory(x.category);const hay=`${p.main} ${p.detail} ${x.amount}`.toLowerCase();return !search||hay.includes(search)};if(financeFilter!=='all')list=list.filter(x=>x.type===financeFilter);list=list.filter(match);$('totalIncome').textContent=money(ti);$('totalExpense').textContent=money(te);$('remaining').textContent=money(rem);$('remaining').style.color=rem<0?'var(--red)':'var(--blue)';$('incomeRows').innerHTML=categoryGroups('income',list.filter(x=>x.type==='income'),search);$('expenseRows').innerHTML=categoryGroups('expense',list.filter(x=>x.type==='expense'),search);$('incomeTotalSmall').textContent=money(incAll.reduce((a,x)=>a+x.amount,0));$('expenseTotalSmall').textContent=money(expAll.reduce((a,x)=>a+x.amount,0));const rate=ti?te/ti*100:0;$('expenseRate').textContent=rate.toFixed(1)+'%';const cmp=compareMonth(allMonth,prevList);$('monthCompare').textContent=cmp[0];$('monthCompare').className='insight-value '+(cmp[0].startsWith('↑')?'positive':cmp[0].startsWith('↓')?'negative':'');$('monthCompareNote').textContent=cmp[1];$('expenseChart').innerHTML=expenseChart(allMonth);applyMonthLockUI(isMonthLocked(m));}
function categorySection(type,title,icon,cats,list){const total=list.reduce((a,x)=>a+x.amount,0);const cards=cats.map(cat=>{const arr=list.filter(x=>x.category===cat),sum=arr.reduce((a,x)=>a+x.amount,0);return `<div class="category-card"><div class="category-top"><div class="category-name">${esc(cat)}</div><div class="category-actions"><button class="mini" onclick="openEntryModal('${type}',null,'${esc(cat).replace(/'/g,"&#039;")}')">+ إضافة</button></div></div><div class="category-total">${money(sum)}</div><div class="entry-list">${arr.length?arr.map(x=>entryHtml(x)).join(''):''}</div></div>`}).join('');return `<section class="section ${type}-section"><div class="section-head"><div class="section-title"><div class="section-badge ${type}-badge">${icon}</div><div><h3>${title}</h3><div class="section-total">${money(total)}</div></div></div><button class="manage" onclick="manageCategories('${type}')">إدارة العناوين</button></div><div class="category-grid">${cards||'<div class="empty">لا توجد عناوين رئيسية</div>'}</div></section>`}
function entryHtml(x){const d=formatPaymentDate(x.createdAt)||String(x.month).slice(0,10);return `<div class="entry ${x.type}"><div class="entry-main"><div class="entry-name">${esc(x.category)}</div><div class="entry-meta">${d}</div></div><div class="entry-actions"><button class="mini" onclick="editEntry('${x.id}')">تعديل</button><button class="mini" onclick="deleteEntry('${x.id}')">حذف</button></div><div class="entry-amount">${money(x.amount)}</div></div>`}
function openEntryModal(type,id=null,preCat=''){if(isMonthLocked()&&!id){return}if(isMonthLocked()&&id){showMessage('authMsg','');return}editId=id;const x=id?entries.find(e=>String(e.id)===String(id)):null;const p=x?splitCategory(x.category):{main:preCat,detail:''};const cats=getCats()[type]||[];const options=cats.map(c=>`<option value="${esc(c)}"></option>`).join('');$("sheet").innerHTML=`<h3>${id?'تعديل الحركة':type==='income'?'إضافة دخل':'إضافة مصروف'}</h3><label class="field"><span>العنوان الرئيسي</span><input id="mCategory" list="categoryOptions" type="text" value="${esc(p.main)}" placeholder="اكتب أي عنوان تريده"><datalist id="categoryOptions">${options}</datalist></label><label class="field"><span>العنوان الفرعي</span><input id="mDetail" type="text" value="${esc(p.detail)}" placeholder="اكتب العنوان الفرعي"></label><label class="field"><span>المبلغ</span><input id="mAmount" type="number" inputmode="decimal" value="${x?.amount||''}" placeholder="0"></label><div id="mMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveEntry('${type}')">حفظ</button></div>`;$("modal").classList.add('show')}
function editEntry(id){if(isMonthLocked())return;const x=entries.find(e=>String(e.id)===String(id));if(x)openEntryModal(x.type,id)}
function closeModal(){$("modal").classList.remove('show');editId=null}
async function saveEntry(type){if(busy)return;const main=$("mCategory").value.trim(),detail=$("mDetail").value.trim(),amount=Number($("mAmount").value);if(!main||!amount){showMessage('mMsg','اكتب العنوان الرئيسي والمبلغ.');return}const cats=getCats();if(!cats[type].includes(main)){cats[type].push(main);saveCats(cats)}busy=true;showMessage('mMsg','جاري الحفظ...');const category=makeCategory(main,detail);try{if(editId){const x=entries.find(e=>String(e.id)===String(editId));const {data,error}=await supabaseClient.from('financial_entries').update({month:monthValue()+'-01',type,category,amount}).eq('id',Number(editId)).select('id,month,type,category,amount').single();if(error)throw error;Object.assign(x,{id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)});closeModal();render()}else{const {data,error}=await supabaseClient.from('financial_entries').insert({month:monthValue()+'-01',type,category,amount}).select('id,month,type,category,amount').single();if(error)throw error;entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)});render();editId=null;$("mDetail").value='';$("mAmount").value='';$("mMsg").innerHTML='<span style="color:var(--green);font-weight:800">انضافت بنجاح ✓</span>';$("mDetail").focus();$("sheet").querySelector('.modal-actions').innerHTML='<button class="ghost" onclick="closeModal()">إغلاق</button><button class="primary" onclick="saveEntry(\''+type+'\')">+ إضافة أخرى</button>';}}catch(e){showMessage('mMsg','تعذر الحفظ: '+e.message)}finally{busy=false}}
async function deleteEntry(id){if(isMonthLocked())return;if(!confirm('حذف هذه الحركة؟'))return;const {error}=await supabaseClient.from('financial_entries').delete().eq('id',Number(id));if(error){alert('تعذر الحذف: '+error.message);return}entries=entries.filter(x=>String(x.id)!==String(id));render()}
function renameMainCategory(type,name){
 const old=String(name);
 const cats=getCats();
 const current=old;
 $("sheet").innerHTML=`<h3>تعديل العنوان الرئيسي</h3><div class="field"><span>العنوان الرئيسي</span><input id="mainRenameInput" type="text" value="${esc(current)}" autocomplete="off"></div><div id="mainActionMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" class="primary" data-modal-action="apply-rename-main" data-type="${esc(type)}" data-name="${encodeURIComponent(old)}">حفظ التعديل</button></div>`;
 $("modal").classList.add('show');
 setTimeout(()=>{$("mainRenameInput")?.focus();},50);
}
async function applyRenameMainCategory(type,old){
 const input=$("mainRenameInput");
 const next=input?.value.trim()||'';
 if(!next){showMessage('mainActionMsg','اكتب اسم العنوان الرئيسي.');return}
 if(next===old){closeModal();return}
 const cats=getCats();
 if((cats[type]||[]).includes(next)){showMessage('mainActionMsg','هذا العنوان موجود مسبقًا.');return}
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 try{
  for(const x of affected){const category=makeCategory(next,splitCategory(x.category).detail);const {error}=await supabaseClient.from('financial_entries').update({category}).eq('id',Number(x.id));if(error)throw error;x.category=category}
  cats[type]=(cats[type]||[]).map(c=>c===old?next:c);
  if(!cats[type].includes(next))cats[type].push(next);
  saveCats(cats);closeModal();render();
 }catch(e){showMessage('mainActionMsg','تعذر التعديل: '+(e.message||e));}
}
function removeMainCategory(type,name){
 const old=String(name);
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 const count=affected.length;
 $("sheet").innerHTML=`<h3>حذف العنوان الرئيسي</h3><div class="confirm-box"><div class="confirm-title">${esc(old)}</div><div class="confirm-text">${count?`سيتم حذف ${count} عملية مرتبطة بهذا العنوان من قاعدة البيانات.`:'لا توجد عمليات مرتبطة بهذا العنوان.'}</div></div><div id="mainActionMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" class="danger-solid" data-modal-action="apply-delete-main" data-type="${esc(type)}" data-name="${encodeURIComponent(old)}">حذف العنوان</button></div>`;
 $("modal").classList.add('show');
}
async function applyRemoveMainCategory(type,old){
 const cats=getCats();
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 try{
  if(affected.length){const ids=affected.map(x=>Number(x.id));const {error}=await supabaseClient.from('financial_entries').delete().in('id',ids);if(error)throw error;entries=entries.filter(x=>!ids.includes(Number(x.id)))}
  cats[type]=(cats[type]||[]).filter(c=>c!==old);saveCats(cats);closeModal();render();
 }catch(e){showMessage('mainActionMsg','تعذر الحذف: '+(e.message||e));}
}
function manageCategories(type){const cats=getCats()[type]||[];$('sheet').innerHTML=`<h3>عناوين ${type==='income'?'الدخل':'المصروفات'}</h3><div class="menu-list">${cats.map(c=>`<div class="menu-item"><span class="menu-name">${esc(c)}</span><span><button class="mini" onclick="renameMainCategory('${type}',${JSON.stringify(c)})">تعديل</button> <button class="mini danger" onclick="removeMainCategory('${type}',${JSON.stringify(c)})"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button></span></div>`).join('')||'<div class="empty">لا توجد عناوين رئيسية</div>'}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px;margin-top:12px" onclick="addCategory('${type}')">+ إضافة عنوان رئيسي</button><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:8px" onclick="closeModal()">إغلاق</button>`;$('modal').classList.add('show')}

function openMonthlyReport(){const m=monthValue();const list=entries.filter(x=>x.month.slice(0,7)===m);const inc=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),rem=inc-exp;const prev=previousMonthKey(m);const prevList=entries.filter(x=>x.month.slice(0,7)===prev);const cmp=compareMonth(list,prevList);const byType=t=>{const map={};list.filter(x=>x.type===t).forEach(x=>{const p=splitCategory(x.category);map[p.main]=(map[p.main]||0)+x.amount});return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="menu-item"><span class="menu-name">${esc(k)}</span><strong>${money(v)}</strong></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'};$('sheet').innerHTML=`<h3>تقرير ${m}</h3><div class="insights" style="margin-top:0"><div class="insight"><div class="insight-title">الدخل</div><div class="insight-value positive">${money(inc)}</div></div><div class="insight"><div class="insight-title">المصروفات</div><div class="insight-value negative">${money(exp)}</div></div><div class="insight"><div class="insight-title">المتبقي</div><div class="insight-value ${rem<0?'negative':'positive'}">${money(rem)}</div></div><div class="insight"><div class="insight-title">مقارنة السابق</div><div class="insight-value">${cmp[0]}</div></div></div><h4>تفاصيل الدخل</h4><div class="menu-list">${byType('income')}</div><h4>تفاصيل المصروفات</h4><div class="menu-list">${byType('expense')}</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إغلاق</button><button class="ghost" onclick="printMonthlyReport('${m}')">طباعة</button><button class="primary" onclick="saveMonthlyPDF('${m}')">حفظ PDF</button></div>`;$('modal').classList.add('show')}
function itemsLabel(n){if(n===0)return '0 عمليات'; if(n===1)return '1 عملية'; if(n===2)return 'عمليتان'; return n+' عملية'}
function buildMonthlyReport(m){
 const list=entries.filter(x=>x.month.slice(0,7)===m),inc=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),rem=inc-exp,prev=previousMonthKey(m),prevList=entries.filter(x=>x.month.slice(0,7)===prev),cmp=compareMonth(list,prevList),rate=inc?exp/inc*100:0;
 const d=new Date(m+'-01T00:00:00');
 const monthLabel=d.toLocaleDateString('ar-SA-u-ca-gregory',{month:'long',year:'numeric'});
 const logoSrc=document.querySelector('.logo img')?.getAttribute('src')||'ibtisam-icon-full-512.png';
 const ordered=[...list].sort((a,b)=>String(a.created_at||a.month).localeCompare(String(b.created_at||b.month)));
 const makeMini=(type)=>{
   const items=ordered.filter(x=>x.type===type);
   if(!items.length)return `<div class="ledger-empty">لا توجد عمليات</div>`;
   const mid=Math.ceil(items.length/2), cols=[items.slice(0,mid),items.slice(mid)];
   return `<div class="ledger-mini-grid">${cols.map((col,ci)=>`<table class="ledger-mini"><tbody>${col.map((x,i)=>{const p=splitCategory(x.category);const n=ci*mid+i+1;return `<tr><td>${n}</td><td><span class="ledger-mini-name">${esc(p.detail||p.main)}</span><span class="ledger-mini-sub">${esc(p.detail?p.main:x.month)}</span></td><td>${money(x.amount)}</td></tr>`}).join('')}</tbody></table>`).join('')}</div>`;
 };
 const incomeRows=makeMini('income'), expenseRows=makeMini('expense');
 $('printReport').innerHTML=`<div class="print-report">
  <header class="print-head">
   <div class="print-brand"><img class="print-logo" src="${esc(logoSrc)}"><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div>
   <div class="print-title"><div class="print-official">كشف حساب شهري</div><h2>التقرير المالي</h2><p class="print-greg">${esc(monthLabel)}</p></div>
  </header>
  <div class="print-summary">
   <div class="print-card print-income"><div class="k">إجمالي الدخل</div><div class="v">${money(inc)}</div></div>
   <div class="print-card print-expense"><div class="k">إجمالي المصروفات</div><div class="v">${money(exp)}</div></div>
   <div class="print-card print-remain"><div class="k">${rem<0?'العجز':'المتبقي'}</div><div class="v">${money(rem)}</div></div>
  </div>
  <div class="print-meta">
   <div class="print-meta-box"><strong>نسبة المصروفات من الدخل</strong><span>${rate.toFixed(1)}%</span></div>
   <div class="print-meta-box"><strong>عدد العمليات</strong><span>${list.length} عملية</span></div>
   <div class="print-meta-box"><strong>مقارنة بالشهر السابق</strong><span>${esc(cmp[0])} — ${esc(cmp[1])}</span></div>
  </div>
  <div class="ledger-title"><span>كشف تفاصيل الشهر</span><small>الدخل والمصروفات في صفحة واحدة</small></div>
  <div class="ledger-columns">
   <section class="ledger-section income"><div class="ledger-section-head"><strong>الدخل</strong><span>${itemsLabel(list.filter(x=>x.type==='income').length)}</span></div>${incomeRows}<div class="ledger-total"><span>إجمالي الدخل</span><strong>${money(inc)}</strong></div></section>
   <section class="ledger-section expense"><div class="ledger-section-head"><strong>المصروفات</strong><span>${itemsLabel(list.filter(x=>x.type==='expense').length)}</span></div>${expenseRows}<div class="ledger-total"><span>إجمالي المصروفات</span><strong>${money(exp)}</strong></div></section>
  </div>
  <footer class="print-footer"><span>تقرير ${esc(monthLabel)}</span><span>مركز ابتسام لرياض الأطفال</span><span>الإدارة المالية</span></footer>
 </div>`;
 $('printReport').setAttribute('aria-hidden','false');
 return {monthLabel};
}
function printMonthlyReport(m){
 const {monthLabel}=buildMonthlyReport(m);
 const oldTitle=document.title;
 document.title=`تقرير مالي - ${monthLabel} - مركز ابتسام`;
 setTimeout(()=>{window.print();setTimeout(()=>{$('printReport').setAttribute('aria-hidden','true');document.title=oldTitle},700)},100);
}
async function saveMonthlyPDF(m){
 const {monthLabel}=buildMonthlyReport(m);
 const report=$('printReport');
 try{
  report.style.display='block';
  if(!window.html2canvas || !window.jspdf){
   alert('تعذر تجهيز ملف PDF. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.');
   return;
  }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const canvas=await html2canvas(report,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:Math.max(report.scrollWidth,794)});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  const pageW=210,pageH=297,margin=7;
  const imgW=pageW-margin*2;
  const imgH=canvas.height*imgW/canvas.width;
  const pageContentH=pageH-margin*2;
  if(imgH<=pageContentH){
   pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,imgW,imgH,undefined,'FAST');
  }else{
   const pxPerMm=canvas.width/imgW;
   const pagePx=Math.floor(pageContentH*pxPerMm);
   let offset=0;
   let page=0;
   while(offset<canvas.height){
    const sliceH=Math.min(pagePx,canvas.height-offset);
    const slice=document.createElement('canvas');
    slice.width=canvas.width;slice.height=sliceH;
    const ctx=slice.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas,0,offset,canvas.width,sliceH,0,0,canvas.width,sliceH);
    if(page>0)pdf.addPage();
    pdf.addImage(slice.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,imgW,sliceH/pxPerMm,undefined,'FAST');
    offset+=sliceH;page++;
   }
  }
  pdf.save(`تقرير مالي - ${monthLabel} - مركز ابتسام.pdf`);
 }catch(e){
  alert('تعذر حفظ ملف PDF: '+(e.message||'خطأ غير معروف'));
 }finally{
  report.style.display='';
  report.setAttribute('aria-hidden','true');
 }
}
function openSettings(){const c=getCats();$("sheet").innerHTML=`<h3>الإعدادات</h3><div class="menu-list"><button class="menu-item" onclick="manageCategories('income')"><span class="menu-name">عناوين الدخل</span><span>›</span></button><button class="menu-item" onclick="manageCategories('expense')"><span class="menu-name">عناوين المصروفات</span><span>›</span></button><button class="menu-item" onclick="signOut()"><span class="menu-name danger">تسجيل الخروج</span><span>›</span></button></div><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:12px" onclick="closeModal()">إغلاق</button>`;$("modal").classList.add('show')}
async function signOut(){closeModal();await supabaseClient.auth.signOut();$("root").innerHTML=authScreen()}
applyTheme();
boot();
</script>
