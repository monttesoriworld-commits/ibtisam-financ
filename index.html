<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL="https://dwifylcibtawffnjyzmu.supabase.co";
const KEY_STORAGE="ibtisam_supabase_key";

const DEFAULT_CATS={income:["اشتراك الأطفال","دعم آخر"],expense:["الرواتب","الإيجار","الكهرباء","مصروفات أخرى"]};
let supabaseClient=null,entries=[],editId=null,busy=false,activeTab="all",childrenEditId=null;
function money(n){return Number(n||0).toLocaleString("ar-SA",{maximumFractionDigits:2})+" ر.س"}
function monthValue(){return $("month")?.value||new Date().toISOString().slice(0,7)}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function showMessage(id,msg){if($(id))$(id).textContent=msg||""}
function getCats(){try{const x=JSON.parse(localStorage.getItem(CAT_STORAGE)||"null");if(x?.income&&x?.expense)return x}catch(e){}const fresh=JSON.parse(JSON.stringify(DEFAULT_CATS));saveCats(fresh);return fresh}
function saveCats(c){localStorage.setItem(CAT_STORAGE,JSON.stringify(c))}
function getChildren(){try{const x=JSON.parse(localStorage.getItem(CHILDREN_STORAGE)||"[]");return Array.isArray(x)?x:[]}catch(e){return []}}
function seedChildrenFromOctoberIncome(){
  const targetMonth='2026-10';
  const source=entries.filter(x=>x.type==='income'&&x.month.slice(0,7)===targetMonth&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail.trim());
  if(!source.length)return 0;
  const list=getChildren();
  const counts=new Map();
  list.forEach(c=>{const name=String(c.name||'').trim();if(name)counts.set(name,(counts.get(name)||0)+1)});
  let added=0;
  source.forEach(x=>{
    const name=splitCategory(x.category).detail.trim();
    const amount=Number(x.amount)||0;
    const have=counts.get(name)||0;
    const needed=source.filter(y=>splitCategory(y.category).detail.trim()===name).length;
    if(have>=needed)return;
    list.push({id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+added,name,guardian:'',phone:'',subscriptionType:'شهري',subscription:amount,startDate:'2026-10-01',endDate:'2026-11-01',sessionsTotal:16,sessionsUsed:0,sessionRecords:{}});
    counts.set(name,have+1);
    added++;
  });
  if(added)saveChildren(list);
  return added;
}
function saveChildren(list){localStorage.setItem(CHILDREN_STORAGE,JSON.stringify(list));return list}
function childPaidThisMonth(childName,m=monthValue()){return entries.filter(x=>x.type==='income'&&x.month.slice(0,7)===m&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===childName).reduce((a,x)=>a+x.amount,0)}
function childStatus(child,paid){const total=Number(child.subscription||0);if(total<=0)return ['غير محدد','neutral'];if(paid<=0)return ['غير مدفوع','danger'];if(paid<total)return ['مدفوع جزئي','warn'];return ['مدفوع','good']}
function childLifeStatus(child){const today=new Date();today.setHours(0,0,0,0);if(child.endDate){const end=new Date(child.endDate+'T00:00:00');if(end<today)return ['منتهي','danger']}if(child.startDate){const start=new Date(child.startDate+'T00:00:00');if(start>today)return ['لم يبدأ','neutral']}return ['نشط','good']}
function childSessionsTotal(child){const n=Number(child.sessionsTotal);return Number.isFinite(n)&&n>0?n:16}
function getSessionRecords(child){const total=childSessionsTotal(child);const raw=child&&child.sessionRecords&&typeof child.sessionRecords==='object'?child.sessionRecords:{};const out={};for(let i=1;i<=total;i++){const v=raw[String(i)];if(v==='absent'||v==='attended')out[String(i)]=v}return out}
function isWorkday(d){const day=d.getDay();return day!==5&&day!==6}
function sessionDate(child,n){if(!child?.startDate)return null;const d=new Date(child.startDate+'T00:00:00');let count=0;while(count<n){if(isWorkday(d))count++;if(count<n)d.setDate(d.getDate()+1)}return d}
function sessionEffectiveStatus(child,n){const records=getSessionRecords(child),explicit=records[String(n)];if(explicit)return explicit;const d=sessionDate(child,n);if(!d)return 'pending';const today=new Date();today.setHours(0,0,0,0);return d<today?'attended':'pending'}
function sessionStats(child){const total=childSessionsTotal(child),records=getSessionRecords(child),vals=[];for(let i=1;i<=total;i++)vals.push(sessionEffectiveStatus(child,i));const attended=vals.filter(v=>v==='attended').length,absent=vals.filter(v=>v==='absent').length,postponed=Math.min(absent,3),chargedAbsences=Math.max(absent-3,0),autoUsed=attended+chargedAbsences;const manual=Number.isFinite(Number(child.manualRemaining))?Math.max(0,Math.min(total,Number(child.manualRemaining))):null;const used=manual===null?autoUsed:Math.max(0,total-manual);return {records,attended,absent,postponed,chargedAbsences,used,remaining:manual===null?Math.max(total-used,0):manual}}
function childSessionsUsed(child){return sessionStats(child).used}
function childSessionsRemaining(child){return sessionStats(child).remaining}
function sessionPillsHtml(child){
  const total=childSessionsTotal(child),st=sessionStats(child);
  let h='';
  let absenceRank=0;
  for(let i=1;i<=total;i++){
    const v=sessionEffectiveStatus(child,i);
    let cls='';
    let label=String(i);
    if(v==='absent'){absenceRank++;cls=absenceRank<=3?'absent':'absent charged';label='×';}
    else if(v==='attended'){cls='attended';label='✓';}
    h+=`<button type="button" class="session-pill ${cls}" title="الجلسة ${i}" onclick="event.preventDefault();event.stopPropagation();toggleSession('${esc(child.id)}',${i})">${label}</button>`;
  }
  return h;
}
function sessionButtonsHtml(child){
  const st=sessionStats(child);

}
function compactSessionPrepHtml(child){
  return `<div class="session-prep compact" onclick="event.stopPropagation()"><div class="session-pills">${sessionPillsHtml(child)}</div></div>`;
}
function toggleSession(id,n){const list=getChildren(),i=list.findIndex(x=>String(x.id)===String(id));if(i<0)return;const c=list[i],records=getSessionRecords(c),key=String(n),explicit=records[key];if(explicit==='absent'){records[key]='attended'}else if(explicit==='attended'){delete records[key]}else{records[key]='absent'}const updated={...c,sessionRecords:records,manualRemaining:undefined};updated.sessionsUsed=sessionStats(updated).used;list[i]=updated;saveChildren(list);renderChildren();if($('modal')?.classList.contains('show'))setTimeout(()=>openChildDetails(id),0)}
function editRemainingSessions(id){const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;const st=sessionStats(c);const value=prompt('اكتب عدد الجلسات المتبقية:',String(st.remaining));if(value===null)return;const n=Math.max(0,Math.min(childSessionsTotal(c),Math.floor(Number(value))));if(!Number.isFinite(n)){alert('اكتب رقمًا صحيحًا.');return}const list=getChildren(),i=list.findIndex(x=>String(x.id)===String(id));if(i<0)return;const total=childSessionsTotal(c),used=total-n;list[i]={...c,manualRemaining:n,sessionManualUsed:used,sessionsUsed:used};saveChildren(list);renderChildren()}

function childCardHtml(child,m){const paid=childPaidThisMonth(child.name,m),total=Number(child.subscription||0),remain=Math.max(total-paid,0),st=childStatus(child,paid),life=childLifeStatus(child),sessionsTotal=childSessionsTotal(child),sessionsUsed=childSessionsUsed(child),sessionsRemain=childSessionsRemaining(child);return `<div class="child-card" onclick="openChildDetails('${esc(child.id)}')"><div class="child-card-top"><div class="child-avatar">${esc((child.name||'ط').trim().slice(0,1))}</div><div class="child-main"><div class="child-name">${esc(child.name)}</div><div class="child-meta">${esc(child.guardian||'ولي الأمر غير مضاف')}${child.phone?' · '+esc(child.phone):''}</div></div><span class="child-status ${life[1]}">${life[0]}</span></div><div class="child-finance"><div><span>نوع الاشتراك</span><strong>${esc(child.subscriptionType||'شهري')}</strong></div><div><span>قيمة الاشتراك</span><strong>${money(total)}</strong></div><div><span>المقبوض هذا الشهر</span><strong class="paid">${money(paid)}</strong></div></div><div class="session-summary"><div><span>الجلسات</span><strong>${sessionsTotal}</strong></div><div><span>المتبقي</span><strong>${sessionsRemain}</strong></div><small>تأجيل ${sessionStats(child).postponed}/3</small></div>${compactSessionPrepHtml(child)}<div class="child-footer"><div class="child-dates">${child.startDate?`من ${esc(child.startDate)}`:''}${child.endDate?` إلى ${esc(child.endDate)}`:''}<br><span class="${st[1]}">${st[0]} · المتبقي ${money(remain)}</span></div><div class="child-actions" onclick="event.stopPropagation()"><button class="mini child-pay" onclick="openChildPayment('${esc(child.id)}')">+ تسجيل دفعة</button><button class="mini" onclick="openChildModal('${esc(child.id)}')">تعديل</button><button class="mini danger" onclick="deleteChild('${esc(child.id)}')"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button></div></div></div>`}

function renderChildren(){const root=$('root');if(!root)return;const searchValue=window.childrenSearch||'';const oldInput=document.querySelector('.children-tools .search-box');const keepSearchFocus=!!(oldInput&&document.activeElement===oldInput);root.innerHTML=childrenShell();applyTheme();const input=document.querySelector('.children-tools .search-box');if(input&&keepSearchFocus){input.focus();try{input.setSelectionRange(searchValue.length,searchValue.length)}catch(e){}}}
function migrateSessionRecordsV3(){
  const flag='ibtisam_sessions_weekend_fix_v3';
  if(localStorage.getItem(flag)) return;
  const list=getChildren();
  let changed=false;
  list.forEach(c=>{
    if(c&&c.sessionRecords&&typeof c.sessionRecords==='object'){
      const cleaned={};
      Object.entries(c.sessionRecords).forEach(([k,v])=>{
        // Any old automatic attendance saved by the previous version is removed.
        // Keep explicit absences so the user's postponement records are not lost.
        if(v==='absent') cleaned[k]=v;
      });
      if(JSON.stringify(cleaned)!==JSON.stringify(c.sessionRecords)){
        c.sessionRecords=cleaned;
        c.sessionsUsed=undefined;
        changed=true;
      }
    }
  });
  if(changed) saveChildren(list);
  localStorage.setItem(flag,'1');
}

v>`;$('modal').classList.add('show');setTimeout(()=>$('cName')?.focus(),50)}
function saveChild(){

        guardian=$('cGuardian')?.value.trim()||'',
        phone=$('cPhone')?.value.trim()||'',
        subscriptionType=$('cSubscriptionType')?.value.trim()||'شهري',
        subscription=Number($('cSubscription')?.value||0),
        sessionsTotal=Math.max(1,Number($('cSessions')?.value||16)),
        startDate=$('cStart')?.value||'',
        endDate=$('cEnd')?.value||'';
  if(!name){showMessage('cMsg','اكتب اسم الطفل.');$('cName')?.focus();return}
  if(subscription<0){showMessage('cMsg','قيمة الاشتراك غير صحيحة.');return}
  if(btn) { btn.dataset.saving='1'; btn.disabled=true; }
  try{
    let list=getChildren();
    if(childrenEditId){
      const i=list.findIndex(x=>String(x.id)===String(childrenEditId));
      if(i>=0) list[i]={...list[i],name,guardian,phone,subscriptionType,subscription,sessionsTotal,sessionsUsed:Math.min(childSessionsUsed(list[i]),sessionsTotal),sessionRecords:list[i].sessionRecords||{},manualRemaining:Number.isFinite(Number(list[i].manualRemaining))?Math.min(Number(list[i].manualRemaining),sessionsTotal):undefined,startDate,endDate};
      saveChildren(list);
      closeModal();
      renderChildren();
      return;
    }
    list.unshift({id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name,guardian,phone,subscriptionType,subscription,sessionsTotal,sessionsUsed:0,sessionRecords:{},startDate,endDate});
    saveChildren(list);
    renderChildren();
    $('cName').value='';
    $('cGuardian').value='';
    $('cPhone').value='';
    $('cSubscriptionType').value='شهري';
    $('cSubscription').value='';
    $('cStart').value='';
    $('cEnd').value='';
    showMessage('cMsg','انضاف الطفل بنجاح ✓');
    if(btn){
      btn.disabled=false;
      btn.dataset.saving='0';
      btn.textContent='حفظ وإضافة طفل آخر';
    }
    setTimeout(()=>$('cName')?.focus(),50);

function compareMonth(list,prevList){const now=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)-list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);const prev=prevList.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)-prevList.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);if(prev===0&&now===0)return ['—','لا يوجد تغير'];if(prev===0)return [now>0?'↑ '+money(now):'↓ '+money(Math.abs(now)),'لا توجد قيمة سابقة للمقارنة'];const pct=((now-prev)/Math.abs(prev))*100;return [(pct>=0?'↑ ':'↓ ')+Math.abs(pct).toFixed(1)+'%',pct>=0?'تحسن في المتبقي':'انخفاض في المتبقي']}

 $("sheet").innerHTML=`<h3>تعديل العنوان الرئيسي</h3><div class="field"><span>العنوان الرئيسي</span><input id="mainRenameInput" type="text" value="${esc(current)}" autocomplete="off"></div><div id="mainActionMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" class="primary" data-modal-action="apply-rename-main" data-type="${esc(type)}" data-name="${encodeURIComponent(old)}">حفظ التعديل</button></div>`;
 $("modal").classList.add('show');
 setTimeout(()=>{$("mainRenameInput")?.focus();},50);
}
async function applyRenameMainCategory(type,old){
 const input=$("mainRenameInput");
 const next=input?.value.trim()||'';
 if(!next){showMessage('mainActionMsg','اكتب اسم العنوان الرئيسي.');return}
 if(next===old){closeModal();return}
 const cats=getCats();
 if((cats[type]||[]).includes(next)){showMessage('mainActionMsg','هذا العنوان موجود مسبقًا.');return}
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 try{
  for(const x of affected){const category=makeCategory(next,splitCategory(x.category).detail);const {error}=await supabaseClient.from('financial_entries').update({category}).eq('id',Number(x.id));if(error)throw error;x.category=category}
  cats[type]=(cats[type]||[]).map(c=>c===old?next:c);
  if(!cats[type].includes(next))cats[type].push(next);
  saveCats(cats);closeModal();render();
 }catch(e){showMessage('mainActionMsg','تعذر التعديل: '+(e.message||e));}
}
function removeMainCategory(type,name){
 const old=String(name);
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 const count=affected.length;
 $("sheet").innerHTML=`<h3>حذف العنوان الرئيسي</h3><div class="confirm-box"><div class="confirm-title">${esc(old)}</div><div class="confirm-text">${count?`سيتم حذف ${count} عملية مرتبطة بهذا العنوان من قاعدة البيانات.`:'لا توجد عمليات مرتبطة بهذا العنوان.'}</div></div><div id="mainActionMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" class="danger-solid" data-modal-action="apply-delete-main" data-type="${esc(type)}" data-name="${encodeURIComponent(old)}">حذف العنوان</button></div>`;
 $("modal").classList.add('show');
}
async function applyRemoveMainCategory(type,old){
 const cats=getCats();
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 try{
  if(affected.length){const ids=affected.map(x=>Number(x.id));const {error}=await supabaseClient.from('financial_entries').delete().in('id',ids);if(error)throw error;entries=entries.filter(x=>!ids.includes(Number(x.id)))}
  cats[type]=(cats[type]||[]).filter(c=>c!==old);saveCats(cats);closeModal();render();
 }catch(e){showMessage('mainActionMsg','تعذر الحذف: '+(e.message||e));}
}
function manageCategories(type){const cats=getCats()[type]||[];$('sheet').innerHTML=`<h3>عناوين ${type==='income'?'الدخل':'المصروفات'}</h3><div class="menu-list">${cats.map(c=>`<div class="menu-item"><span class="menu-name">${esc(c)}</span><span><button class="mini" onclick="renameMainCategory('${type}',${JSON.stringify(c)})">تعديل</button> <button class="mini danger" onclick="removeMainCategory('${type}',${JSON.stringify(c)})"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button></span></div>`).join('')||'<div class="empty">لا توجد عناوين رئيسية</div>'}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px;margin-top:12px" onclick="addCategory('${type}')">+ إضافة عنوان رئيسي</button><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:8px" onclick="closeModal()">إغلاق</button>`;$('modal').classList.add('show')}

function openMonthlyReport(){const m=monthValue();const list=entries.filter(x=>x.month.slice(0,7)===m);const inc=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),rem=inc-exp;const prev=previousMonthKey(m);const prevList=entries.filter(x=>x.month.slice(0,7)===prev);const cmp=compareMonth(list,prevList);const byType=t=>{const map={};list.filter(x=>x.type===t).forEach(x=>{const p=splitCategory(x.category);map[p.main]=(map[p.main]||0)+x.amount});return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="menu-item"><span class="menu-name">${esc(k)}</span><strong>${money(v)}</strong></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'};$('sheet').innerHTML=`<h3>تقرير ${m}</h3><div class="insights" style="margin-top:0"><div class="insight"><div class="insight-title">الدخل</div><div class="insight-value positive">${money(inc)}</div></div><div class="insight"><div class="insight-title">المصروفات</div><div class="insight-value negative">${money(exp)}</div></div><div class="insight"><div class="insight-title">المتبقي</div><div class="insight-value ${rem<0?'negative':'positive'}">${money(rem)}</div></div><div class="insight"><div class="insight-title">مقارنة السابق</div><div class="insight-value">${cmp[0]}</div></div></div><h4>تفاصيل الدخل</h4><div class="menu-list">${byType('income')}</div><h4>تفاصيل المصروفات</h4><div class="menu-list">${byType('expense')}</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إغلاق</button><button class="ghost" onclick="printMonthlyReport('${m}')">طباعة</button><button class="primary" onclick="saveMonthlyPDF('${m}')">حفظ PDF</button></div>`;$('modal').classList.add('show')}
function itemsLabel(n){if(n===0)return '0 عمليات'; if(n===1)return '1 عملية'; if(n===2)return 'عمليتان'; return n+' عملية'}
function buildMonthlyReport(m){
 const list=entries.filter(x=>x.month.slice(0,7)===m),inc=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),rem=inc-exp,prev=previousMonthKey(m),prevList=entries.filter(x=>x.month.slice(0,7)===prev),cmp=compareMonth(list,prevList),rate=inc?exp/inc*100:0;
 const d=new Date(m+'-01T00:00:00');
 const monthLabel=d.toLocaleDateString('ar-SA-u-ca-gregory',{month:'long',year:'numeric'});
 const logoSrc=document.querySelector('.logo img')?.getAttribute('src')||'ibtisam-icon-full-512.png';
 const ordered=[...list].sort((a,b)=>String(a.created_at||a.month).localeCompare(String(b.created_at||b.month)));
 const makeMini=(type)=>{
   const items=ordered.filter(x=>x.type===type);
   if(!items.length)return `<div class="ledger-empty">لا توجد عمليات</div>`;
   const mid=Math.ceil(items.length/2), cols=[items.slice(0,mid),items.slice(mid)];
   return `<div class="ledger-mini-grid">${cols.map((col,ci)=>`<table class="ledger-mini"><tbody>${col.map((x,i)=>{const p=splitCategory(x.category);const n=ci*mid+i+1;return `<tr><td>${n}</td><td><span class="ledger-mini-name">${esc(p.detail||p.main)}</span><span class="ledger-mini-sub">${esc(p.detail?p.main:x.month)}</span></td><td>${money(x.amount)}</td></tr>`}).join('')}</tbody></table>`).join('')}</div>`;
 };
 const incomeRows=makeMini('income'), expenseRows=makeMini('expense');
 $('printReport').innerHTML=`<div class="print-report">
  <header class="print-head">
   <div class="print-brand"><img class="print-logo" src="${esc(logoSrc)}"><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div>
   <div class="print-title"><div class="print-official">كشف حساب شهري</div><h2>التقرير المالي</h2><p class="print-greg">${esc(monthLabel)}</p></div>
  </header>
  <div class="print-summary">
   <div class="print-card print-income"><div class="k">إجمالي الدخل</div><div class="v">${money(inc)}</div></div>
   <div class="print-card print-expense"><div class="k">إجمالي المصروفات</div><div class="v">${money(exp)}</div></div>
   <div class="print-card print-remain"><div class="k">${rem<0?'العجز':'المتبقي'}</div><div class="v">${money(rem)}</div></div>
  </div>
  <div class="print-meta">
   <div class="print-meta-box"><strong>نسبة المصروفات من الدخل</strong><span>${rate.toFixed(1)}%</span></div>
   <div class="print-meta-box"><strong>عدد العمليات</strong><span>${list.length} عملية</span></div>
   <div class="print-meta-box"><strong>مقارنة بالشهر السابق</strong><span>${esc(cmp[0])} — ${esc(cmp[1])}</span></div>
  </div>
  <div class="ledger-title"><span>كشف تفاصيل الشهر</span><small>الدخل والمصروفات في صفحة واحدة</small></div>
  <div class="ledger-columns">
   <section class="ledger-section income"><div class="ledger-section-head"><strong>الدخل</strong><span>${itemsLabel(list.filter(x=>x.type==='income').length)}</span></div>${incomeRows}<div class="ledger-total"><span>إجمالي الدخل</span><strong>${money(inc)}</strong></div></section>
   <section class="ledger-section expense"><div class="ledger-section-head"><strong>المصروفات</strong><span>${itemsLabel(list.filter(x=>x.type==='expense').length)}</span></div>${expenseRows}<div class="ledger-total"><span>إجمالي المصروفات</span><strong>${money(exp)}</strong></div></section>
  </div>
  <footer class="print-footer"><span>تقرير ${esc(monthLabel)}</span><span>مركز ابتسام لرياض الأطفال</span><span>الإدارة المالية</span></footer>
 </div>`;
 $('printReport').setAttribute('aria-hidden','false');
 return {monthLabel};
}
function printMonthlyReport(m){
 const {monthLabel}=buildMonthlyReport(m);
 const oldTitle=document.title;
 document.title=`تقرير مالي - ${monthLabel} - مركز ابتسام`;
 setTimeout(()=>{window.print();setTimeout(()=>{$('printReport').setAttribute('aria-hidden','true');document.title=oldTitle},700)},100);
}
async function saveMonthlyPDF(m){
 const {monthLabel}=buildMonthlyReport(m);
 const report=$('printReport');
 try{
  report.style.display='block';
  if(!window.html2canvas || !window.jspdf){
   alert('تعذر تجهيز ملف PDF. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.');
   return;
  }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const canvas=await html2canvas(report,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:Math.max(report.scrollWidth,794)});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  const pageW=210,pageH=297,margin=7;
  const imgW=pageW-margin*2;
  const imgH=canvas.height*imgW/canvas.width;
  const pageContentH=pageH-margin*2;
  if(imgH<=pageContentH){
   pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,imgW,imgH,undefined,'FAST');
  }else{
   const pxPerMm=canvas.width/imgW;
   const pagePx=Math.floor(pageContentH*pxPerMm);
   let offset=0;
   let page=0;
   while(offset<canvas.height){
    const sliceH=Math.min(pagePx,canvas.height-offset);
    const slice=document.createElement('canvas');
    slice.width=canvas.width;slice.height=sliceH;
    const ctx=slice.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas,0,offset,canvas.width,sliceH,0,0,canvas.width,sliceH);
    if(page>0)pdf.addPage();
    pdf.addImage(slice.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,imgW,sliceH/pxPerMm,undefined,'FAST');
    offset+=sliceH;page++;
   }
  }
  pdf.save(`تقرير مالي - ${monthLabel} - مركز ابتسام.pdf`);
 }catch(e){
  alert('تعذر حفظ ملف PDF: '+(e.message||'خطأ غير معروف'));
 }finally{
  report.style.display='';
  report.setAttribute('aria-hidden','true');
 }
}
function openSettings(){const c=getCats();$("sheet").innerHTML=`<h3>الإعدادات</h3><div class="menu-list"><button class="menu-item" onclick="manageCategories('income')"><span class="menu-name">عناوين الدخل</span><span>›</span></button><button class="menu-item" onclick="manageCategories('expense')"><span class="menu-name">عناوين المصروفات</span><span>›</span></button><button class="menu-item" onclick="signOut()"><span class="menu-name danger">تسجيل الخروج</span><span>›</span></button></div><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:12px" onclick="closeModal()">إغلاق</button>`;$("modal").classList.add('show')}
async function signOut(){closeModal();await supabaseClient.auth.signOut();$("root").innerHTML=authScreen()}
applyTheme();
boot();
</script>
