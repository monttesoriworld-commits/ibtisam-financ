<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>مركز ابتسام | الإدارة المالية</title>
<link rel="icon" type="image/png" href="ibtisam-icon-full-512.png">
<link rel="apple-touch-icon" href="ibtisam-icon-full-512.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f8fc;--panel:#fff;--line:#e3ebf4;--text:#172033;--muted:#718096;--blue:#1677ff;--green:#159a63;--red:#ef4b55;--shadow:0 10px 30px rgba(35,65,100,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f9fbff,#f1f6fb);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1120px;margin:auto;padding:18px 18px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:15px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow)}.logo img{width:100%;height:100%;object-fit:contain}.brand h1{font-size:19px;margin:0;font-weight:850}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.ghost,.primary{padding:10px 14px;border-radius:13px}.ghost{background:#fff;color:#52657d;border:1px solid var(--line)}.primary{background:linear-gradient(135deg,var(--blue),#3b8dff);color:#fff;box-shadow:0 8px 20px #1677ff22}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 15px}.toolbar h2{font-size:28px;margin:0;font-weight:900}.month{background:#fff;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{position:relative;min-height:145px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);overflow:hidden}.card:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;left:-45px;bottom:-65px;background:#1677ff08}.card-top{display:flex;align-items:center;justify-content:space-between}.card-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;font-weight:900;background:#eef5ff;border:1px solid #dceaff}.income .card-icon{color:var(--green);background:#eafaf3}.expense .card-icon{color:var(--red);background:#fff0f1}.remain .card-icon{color:var(--blue);background:#eef5ff}.label{color:#6f7f93;font-size:13px;font-weight:650}.amount{font-size:29px;font-weight:900;margin-top:16px}.income .amount{color:var(--green)}.expense .amount{color:var(--red)}.remain .amount{color:var(--blue)}.card-sub{color:#8a98a9;font-size:11px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.section{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title{display:flex;align-items:center;gap:9px}.section-badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f1f6fb;border:1px solid var(--line);font-weight:900}.income-badge{color:var(--green);background:#eafaf3}.expense-badge{color:var(--red);background:#fff0f1}.section h3{margin:0;font-size:17px}.section-total{font-size:11px;color:#8794a5;margin-top:3px}.add{background:#eef5ff;color:#0f62d6;border:1px solid #d5e6ff;border-radius:12px;padding:9px 12px;font-weight:800}.rows{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;background:#fbfdff;border:1px solid #e7eef6;padding:12px;border-radius:16px;min-height:65px}.row-info{min-width:0}.cat{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-amount{font-size:12px;font-weight:850;margin-top:4px}.income .row-amount{color:var(--green)}.expense .row-amount{color:var(--red)}.row-actions{display:flex;gap:6px;flex-shrink:0}.row-actions .ghost{padding:7px 9px;border-radius:10px;font-size:11px;background:#fff}.empty{color:var(--muted);text-align:center;padding:24px 5px;border:1px dashed #d9e3ee;border-radius:15px}.bottom{margin-top:14px}.bar-wrap{height:11px;background:#edf2f7;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#1677ff,#65a5ff);border-radius:99px}.footnote{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:78px;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:8;box-shadow:0 -8px 25px rgba(35,65,100,.08)}.nav-inner{width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav-item{height:78px;background:transparent;color:#7a899c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:750;position:relative}.nav-icon{font-size:21px;line-height:1}.nav-item.active{color:var(--blue)}.nav-item.active:before{content:"";position:absolute;top:0;width:52px;height:3px;background:var(--blue);border-radius:0 0 8px 8px}.nav-item.disabled{opacity:.7}.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.authbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.authbox h2{margin:0 0 7px}.authbox p{color:var(--muted);font-size:13px}.field{display:block;margin:12px 0}.field span{display:block;color:#52657d;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#f8fbff;color:var(--text);outline:none}.msg{color:#e14d57;font-size:12px;min-height:18px;margin:8px 0}.hint{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:11px;color:#6f7f93;font-size:12px;line-height:1.7}.modal{position:fixed;inset:0;background:#16243a66;display:none;align-items:end;justify-content:center;padding:14px;z-index:10}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(25,45,75,.2)}.sheet h3{margin-top:0}.sheet input,.sheet select{width:100%;background:#f8fbff;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;margin:7px 0 12px}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}@media(max-width:760px){.app{padding:14px 12px 96px}.brand h1{font-size:17px}.actions .ghost{display:none}.toolbar{gap:10px}.toolbar h2{font-size:25px}.month{padding:10px 11px}.cards{grid-template-columns:repeat(3,1fr);gap:8px}.card{min-height:124px;padding:12px;border-radius:18px}.card-icon{width:32px;height:32px;border-radius:10px;font-size:14px}.amount{font-size:18px;margin-top:12px}.label{font-size:10px}.card-sub{font-size:8px}.grid{grid-template-columns:1fr;gap:11px}.section{padding:13px;border-radius:18px}.section h3{font-size:15px}.add{padding:8px 9px;font-size:11px}.row{padding:10px}.row-actions .ghost{padding:6px 8px}.bottom-nav,.nav-item{height:72px}}

.category-stack{display:grid;gap:10px}.main-category{border:1px solid var(--line);border-radius:18px;background:#fbfdff;overflow:hidden}.main-category>button{width:100%;background:transparent;text-align:right;padding:15px;display:flex;align-items:center;justify-content:space-between;color:var(--text)}.main-left{display:flex;align-items:center;gap:10px}.main-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#eef5ff;color:var(--blue);font-weight:900}.main-category.income .main-icon{background:#eafaf3;color:var(--green)}.main-category.expense .main-icon{background:#fff0f1;color:var(--red)}.main-name{font-weight:850;font-size:15px}.main-total{font-weight:900;font-size:13px;color:#53657c}.chev{transition:.2s}.main-category.open .chev{transform:rotate(180deg)}.sub-list{display:none;padding:0 12px 12px;gap:8px}.main-category.open .sub-list{display:grid}.sub-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid #e7eef6}.sub-name{font-weight:750}.sub-main{color:var(--muted);font-size:10px;margin-top:3px}.sub-amount{font-weight:900}.sub-amount.income{color:var(--green)}.sub-amount.expense{color:var(--red)}.mini{background:#eef5ff;color:#1268df;border:1px solid #d7e7ff;border-radius:9px;padding:6px 8px;font-size:10px;font-weight:800}.mini.danger{color:#d93645;background:#fff1f2;border-color:#ffd9dc}.chart-wrap{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.donut{width:170px;height:170px;border-radius:50%;position:relative;background:conic-gradient(#1677ff 0 25%,#55b5ff 25% 50%,#78d6b0 50% 75%,#ff7780 75% 100%)}.donut:after{content:"";position:absolute;inset:38px;border-radius:50%;background:#fff}.chart-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1;font-weight:900}.legend{display:grid;gap:10px}.legend-item{display:flex;align-items:center;justify-content:space-between;gap:10px}.legend-name{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750}.dot{width:10px;height:10px;border-radius:50%}.legend-val{font-size:11px;color:var(--muted);font-weight:800}@media(max-width:760px){.chart-wrap{grid-template-columns:1fr}.donut{margin:auto;width:145px;height:145px}.donut:after{inset:32px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL="https://dwifylcibtawffnjyzmu.supabase.co";
const KEY_STORAGE="ibtisam_supabase_key";
const LOCAL_STORAGE="ibtisam_finance_entries";
const CAT_STORAGE="ibtisam_finance_categories";
const DEFAULT_CATS={income:["اشتراك الأطفال","دعم آخر"],expense:["الرواتب","الإيجار","الكهرباء","مصروفات أخرى"]};
let supabaseClient=null,entries=[],editId=null,busy=false,activeTab="all";
function money(n){return Number(n||0).toLocaleString("ar-SA",{maximumFractionDigits:2})+" ر.س"}
function monthValue(){return $("month")?.value||new Date().toISOString().slice(0,7)}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function showMessage(id,msg){if($(id))$(id).textContent=msg||""}
function getCats(){try{const x=JSON.parse(localStorage.getItem(CAT_STORAGE)||"null");if(x?.income&&x?.expense){let changed=false;for(const t of ["income","expense"]){for(const c of DEFAULT_CATS[t])if(!x[t].includes(c)){x[t].push(c);changed=true}}if(changed)saveCats(x);return x}}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_CATS))}
function saveCats(c){localStorage.setItem(CAT_STORAGE,JSON.stringify(c))}
function keyScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>ربط قاعدة البيانات</p></div></div><h2>مفتاح Supabase</h2><p>أدخل Publishable key الخاص بمشروعك.</p><label class="field"><span>Publishable key</span><input id="sbKey" type="password" placeholder="sb_publishable_..."></label><div class="hint">المفتاح يحفظ على هذا الجهاز فقط.</div><div id="keyMsg" class="msg">${esc(message)}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px" onclick="saveKey()">متابعة</button></div></div>`}
function authScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div><h2>تسجيل الدخول</h2><p>سجّل الدخول بحساب Supabase المرتبط بالموقع.</p><label class="field"><span>البريد الإلكتروني</span><input id="email" type="email" autocomplete="email"></label><label class="field"><span>كلمة المرور</span><input id="password" type="password" autocomplete="current-password"></label><div id="authMsg" class="msg">${esc(message)}</div><div style="display:flex;gap:8px"><button class="primary" style="flex:1;padding:13px;border-radius:13px" onclick="signIn()">دخول</button><button class="ghost" style="flex:1;padding:13px;border-radius:13px" onclick="signUp()">إنشاء حساب</button></div><button class="ghost" style="width:100%;margin-top:9px;padding:12px;border-radius:13px" onclick="changeKey()">تغيير المفتاح</button></div></div>`}
async function boot(){const key=localStorage.getItem(KEY_STORAGE);if(!key){$("root").innerHTML=keyScreen();return}try{supabaseClient=window.supabase.createClient(SUPABASE_URL,key);const {data:{session}}=await supabaseClient.auth.getSession();if(session){await loadEntries();showApp()}else $("root").innerHTML=authScreen()}catch(e){$("root").innerHTML=keyScreen("خطأ تهيئة Supabase: "+(e?.message||String(e))) }}
function saveKey(){const key=$("sbKey").value.trim();if(!key){showMessage("keyMsg","أدخل المفتاح أولًا.");return}localStorage.setItem(KEY_STORAGE,key);boot()}
function changeKey(){localStorage.removeItem(KEY_STORAGE);supabaseClient=null;$("root").innerHTML=keyScreen()}
async function signIn(){const email=$("email").value.trim(),password=$("password").value,key=localStorage.getItem(KEY_STORAGE)||"";if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}showMessage("authMsg","جاري الاتصال...");try{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);let r;try{r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":key},body:JSON.stringify({email,password}),signal:c.signal})}finally{clearTimeout(t)}const raw=await r.text();let b={};try{b=raw?JSON.parse(raw):{}}catch(_){b={raw}}if(!r.ok){showMessage("authMsg",`خطأ الدخول: ${b.error_description||b.msg||b.message||b.raw||"غير معروف"} (HTTP ${r.status})`);return}const s=await supabaseClient.auth.setSession({access_token:b.access_token,refresh_token:b.refresh_token});if(s.error){showMessage("authMsg",s.error.message);return}await loadEntries();showApp()}catch(e){showMessage("authMsg",`تعذر الاتصال بـ Supabase: ${e?.name==="AbortError"?"انتهت مهلة الاتصال":e.message||e}`)}}
async function signUp(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}if(password.length<6){showMessage("authMsg","كلمة المرور 6 أحرف على الأقل.");return}const {data,error}=await supabaseClient.auth.signUp({email,password});if(error){showMessage("authMsg",error.message);return}if(data.session){await loadEntries();showApp()}else showMessage("authMsg","تم إنشاء الحساب. إذا طُلب تأكيد البريد، أكده ثم سجّل الدخول.")}
async function loadEntries(){const {data,error}=await supabaseClient.from("financial_entries").select("id,month,type,category,amount,created_at").order("created_at",{ascending:true});if(error)throw new Error(error.message);entries=(data||[]).map(x=>({id:String(x.id),month:String(x.month).slice(0,10),type:x.type,category:x.category,amount:Number(x.amount)}));}
function splitCategory(v){const parts=String(v||'').split('::');return {main:parts[0]||'',detail:parts.slice(1).join('::')||''}}
function makeCategory(main,detail){return detail?.trim()?main+'::'+detail.trim():main}
function categoryHash(v){return 'cat_'+btoa(unescape(encodeURIComponent(v))).replace(/[^a-zA-Z0-9]/g,'').slice(0,18)}
function toggleCategory(id){const el=$(id);if(el)el.classList.toggle('open')}
function categoryGroups(type,list){const cats=getCats()[type];return cats.map((cat,idx)=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);const sum=arr.reduce((a,x)=>a+x.amount,0);const id=categoryHash(type+cat+idx);return `<div class="main-category ${type}" id="${id}"><button onclick="toggleCategory('${id}')"><div class="main-left"><div class="main-icon">${type==='income'?'↗':'↘'}</div><div><div class="main-name">${esc(cat)}</div><div class="main-total">${money(sum)}</div></div></div><span class="chev">⌄</span></button><div class="sub-list">${arr.length?arr.map(x=>subEntryHtml(x)).join(''):`<div class="empty">لا توجد تفاصيل بعد</div>`}<button class="mini" style="justify-self:start" onclick="openEntryModal('${type}',null,'${esc(cat).replace(/'/g,"&#039;")}')">+ إضافة ${type==='income'?'اسم':'تفصيل'}</button></div></div>`}).join('')}
function subEntryHtml(x){const p=splitCategory(x.category);const name=p.detail||'حركة عامة';return `<div class="sub-row"><div><div class="sub-name">${esc(name)}</div><div class="sub-main">${esc(p.main)} · ${esc(x.month)}</div></div><div style="display:flex;align-items:center;gap:7px"><div class="sub-amount ${x.type}">${money(x.amount)}</div><button class="mini" onclick="editEntry('${x.id}')">تعديل</button><button class="mini danger" onclick="deleteEntry('${x.id}')">حذف</button></div></div>`}
function expenseChart(list){const exp=list.filter(x=>x.type==='expense');const groups=getCats().expense.map(c=>({name:c,total:exp.filter(x=>splitCategory(x.category).main===c).reduce((a,x)=>a+x.amount,0)})).filter(x=>x.total>0);const total=groups.reduce((a,x)=>a+x.total,0);if(!total)return `<div class="empty">لا توجد مصروفات لعرض التشارت</div>`;const colors=['#1677ff','#55b5ff','#78d6b0','#ff7780','#9b7cff'];let cur=0;const stops=groups.map((g,i)=>{const a=cur/total*100,b=(cur+g.total)/total*100;cur+=g.total;return `${colors[i%colors.length]} ${a}% ${b}%`}).join(',');return `<div class="chart-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div class="chart-center"><div>${Math.round(total?100:0)}%<br><span style="font-size:10px;color:var(--muted)">المصروفات</span></div></div></div><div class="legend">${groups.map((g,i)=>`<div class="legend-item"><div class="legend-name"><span class="dot" style="background:${colors[i%colors.length]}"></span>${esc(g.name)}</div><div class="legend-val">${money(g.total)} · ${Math.round(g.total/total*100)}%</div></div>`).join('')}</div></div>`}
function appShell(){
 return `<div class="app">
  <div class="top"><div class="brand"><div class="logo"><img src="ibtisam-icon-full-512.png" alt="مركز ابتسام"></div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div><div class="actions"><button class="ghost" onclick="signOut()">تسجيل الخروج</button></div></div>
  <div class="toolbar"><h2>الملخص المالي</h2><input id="month" class="month" type="month" onchange="render()"></div>
  <div class="cards">
   <div class="card income"><div class="card-top"><span class="label">إجمالي الدخل</span><div class="card-icon">↗</div></div><div id="totalIncome" class="amount">0 ر.س</div><div class="card-sub">لهذا الشهر</div></div>
   <div class="card expense"><div class="card-top"><span class="label">إجمالي المصروفات</span><div class="card-icon">↘</div></div><div id="totalExpense" class="amount">0 ر.س</div><div class="card-sub">لهذا الشهر</div></div>
   <div class="card remain"><div class="card-top"><span class="label">المتبقي</span><div class="card-icon">✓</div></div><div id="remaining" class="amount">0 ر.س</div><div class="card-sub">بعد خصم المصروفات</div></div>
  </div>
  <div class="grid">
   <div class="section income"><div class="section-head"><div class="section-title"><div class="section-badge income-badge">↗</div><div><h3>الدخل</h3><div id="incomeTotalSmall" class="section-total">0 ر.س</div></div></div><button class="add" onclick="openEntryModal('income')">+ إضافة دخل</button></div><div id="incomeRows" class="category-stack"></div></div>
   <div class="section expense"><div class="section-head"><div class="section-title"><div class="section-badge expense-badge">↘</div><div><h3>المصروفات</h3><div id="expenseTotalSmall" class="section-total">0 ر.س</div></div></div><button class="add" onclick="openEntryModal('expense')">+ إضافة مصروف</button></div><div id="expenseRows" class="category-stack"></div></div>
  </div>
  <div class="section bottom"><div class="section-head"><h3>توزيع المصروفات</h3><span class="label">حسب العنوان الرئيسي</span></div><div id="expenseChart"></div></div>
 </div>
 <nav class="bottom-nav"><div class="nav-inner"><button class="nav-item disabled" onclick="return false"><span class="nav-icon">⌂</span><span>الرئيسية</span></button><button class="nav-item active"><span class="nav-icon">▥</span><span>المالية</span></button><button class="nav-item disabled" onclick="return false"><span class="nav-icon">♙</span><span>الأطفال</span></button><button class="nav-item disabled" onclick="return false"><span class="nav-icon">⚙</span><span>الإعدادات</span></button></div></nav>`;
}
function showApp(){$("root").innerHTML=appShell();const now=new Date();$("month").value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;render()}
function setTab(t){activeTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(t==='all'?'tabAll':t==='income'?'tabIncome':'tabExpense').classList.add('active');render()}
function setNav(el){document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function navFinancial(el){setNav(el);setTab('all')}
function showComing(el,name){setNav(el);alert(`قسم ${name} سيكون متاحًا لاحقًا.`)}
function render(){const m=monthValue(),list=entries.filter(x=>x.month.slice(0,7)===m),inc=list.filter(x=>x.type==='income'),exp=list.filter(x=>x.type==='expense');const ti=inc.reduce((a,x)=>a+x.amount,0),te=exp.reduce((a,x)=>a+x.amount,0);$("totalIncome").textContent=money(ti);$("totalExpense").textContent=money(te);$("remaining").textContent=money(ti-te);$("remaining").style.color=ti-te<0?'var(--red)':'var(--blue)';$("incomeRows").innerHTML=categoryGroups('income',inc);$("expenseRows").innerHTML=categoryGroups('expense',exp);$("incomeTotalSmall").textContent=money(ti);$("expenseTotalSmall").textContent=money(te);$("expenseChart").innerHTML=expenseChart(list)}
function categorySection(type,title,icon,cats,list){const total=list.reduce((a,x)=>a+x.amount,0);const cards=cats.map(cat=>{const arr=list.filter(x=>x.category===cat),sum=arr.reduce((a,x)=>a+x.amount,0);return `<div class="category-card"><div class="category-top"><div class="category-name">${esc(cat)}</div><div class="category-actions"><button class="mini" onclick="openEntryModal('${type}',null,'${esc(cat).replace(/'/g,"&#039;")}')">+ إضافة</button></div></div><div class="category-total">${money(sum)}</div><div class="entry-list">${arr.length?arr.map(x=>entryHtml(x)).join(''):''}</div></div>`}).join('');return `<section class="section ${type}-section"><div class="section-head"><div class="section-title"><div class="section-badge ${type}-badge">${icon}</div><div><h3>${title}</h3><div class="section-total">${money(total)}</div></div></div><button class="manage" onclick="manageCategories('${type}')">إدارة العناوين</button></div><div class="category-grid">${cards||'<div class="empty">لا توجد عناوين رئيسية</div>'}</div></section>`}
function entryHtml(x){return `<div class="entry ${x.type}"><div class="entry-main"><div class="entry-name">${esc(x.category)}</div><div class="entry-meta">${x.month}</div></div><div class="entry-actions"><button class="mini" onclick="editEntry('${x.id}')">تعديل</button><button class="mini" onclick="deleteEntry('${x.id}')">حذف</button></div><div class="entry-amount">${money(x.amount)}</div></div>`}
function openEntryModal(type,id=null,preCat=''){editId=id;const x=id?entries.find(e=>String(e.id)===String(id)):null;const p=x?splitCategory(x.category):{main:preCat,detail:''};const cats=getCats()[type];const options=cats.map(c=>`<option value="${esc(c)}" ${p.main===c?'selected':''}>${esc(c)}</option>`).join('');$("sheet").innerHTML=`<h3>${id?'تعديل الحركة':type==='income'?'إضافة دخل':'إضافة مصروف'}</h3><label class="field"><span>العنوان الرئيسي</span><select id="mCategory">${options}</select></label><label class="field"><span>${type==='income'?'اسم الطفل / المستفيد':'اسم الموظف / البيان'}</span><input id="mDetail" type="text" value="${esc(p.detail)}" placeholder="اكتب الاسم أو البيان"></label><label class="field"><span>المبلغ</span><input id="mAmount" type="number" inputmode="decimal" value="${x?.amount||''}" placeholder="0"></label><div id="mMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveEntry('${type}')">حفظ</button></div>`;$("modal").classList.add('show')}
function editEntry(id){const x=entries.find(e=>String(e.id)===String(id));if(x)openEntryModal(x.type,id)}
function closeModal(){$("modal").classList.remove('show');editId=null}
async function saveEntry(type){if(busy)return;const main=$("mCategory").value,detail=$("mDetail").value.trim(),amount=Number($("mAmount").value);if(!main||!amount){showMessage('mMsg','اختر العنوان واكتب المبلغ.');return}busy=true;showMessage('mMsg','جاري الحفظ...');const category=makeCategory(main,detail);try{if(editId){const x=entries.find(e=>String(e.id)===String(editId));const {data,error}=await supabaseClient.from('financial_entries').update({month:monthValue()+'-01',type,category,amount}).eq('id',Number(editId)).select('id,month,type,category,amount').single();if(error)throw error;Object.assign(x,{id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)})}else{const {data,error}=await supabaseClient.from('financial_entries').insert({month:monthValue()+'-01',type,category,amount}).select('id,month,type,category,amount').single();if(error)throw error;entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)})}closeModal();render()}catch(e){showMessage('mMsg','تعذر الحفظ: '+e.message)}finally{busy=false}}
async function deleteEntry(id){if(!confirm('حذف هذه الحركة؟'))return;const {error}=await supabaseClient.from('financial_entries').delete().eq('id',Number(id));if(error){alert('تعذر الحذف: '+error.message);return}entries=entries.filter(x=>String(x.id)!==String(id));render()}
function manageCategories(type){const cats=getCats()[type];$("sheet").innerHTML=`<h3>عناوين ${type==='income'?'الدخل':'المصروفات'}</h3><div class="menu-list">${cats.map((c,i)=>`<div class="menu-item"><span class="menu-name">${esc(c)}</span><span><button class="mini" onclick="renameCategory('${type}',${i})">تعديل</button> <button class="mini danger" onclick="removeCategory('${type}',${i})">حذف</button></span></div>`).join('')}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px;margin-top:12px" onclick="addCategory('${type}')">+ إضافة عنوان رئيسي</button><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:8px" onclick="closeModal()">إغلاق</button>`;$("modal").classList.add('show')}
function addCategory(type){const name=prompt('اكتب اسم العنوان الرئيسي');if(!name?.trim())return;const c=getCats();if(c[type].includes(name.trim()))return alert('العنوان موجود مسبقًا.');c[type].push(name.trim());saveCats(c);manageCategories(type);render()}
function renameCategory(type,i){const c=getCats(),old=c[type][i],name=prompt('تعديل اسم العنوان',old);if(!name?.trim()||name.trim()===old)return;if(c[type].includes(name.trim()))return alert('العنوان موجود مسبقًا.');c[type][i]=name.trim();saveCats(c);manageCategories(type);render()}
function removeCategory(type,i){const c=getCats(),name=c[type][i];if(c[type].length<=1)return alert('يجب إبقاء عنوان واحد على الأقل.');if(entries.some(x=>x.type===type&&x.category===name))return alert('لا يمكن حذف عنوان مرتبط بحركات مالية. يمكنك تعديل اسم العنوان بدلًا من حذفه.');if(!confirm('حذف العنوان؟'))return;c[type].splice(i,1);saveCats(c);manageCategories(type);render()}
function openSettings(){const c=getCats();$("sheet").innerHTML=`<h3>الإعدادات</h3><div class="menu-list"><button class="menu-item" onclick="manageCategories('income')"><span class="menu-name">عناوين الدخل</span><span>›</span></button><button class="menu-item" onclick="manageCategories('expense')"><span class="menu-name">عناوين المصروفات</span><span>›</span></button><button class="menu-item" onclick="signOut()"><span class="menu-name danger">تسجيل الخروج</span><span>›</span></button></div><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:12px" onclick="closeModal()">إغلاق</button>`;$("modal").classList.add('show')}
async function signOut(){closeModal();await supabaseClient.auth.signOut();$("root").innerHTML=authScreen()}
boot();
</script>
</body>
</html>
