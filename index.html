<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL="https://dwifylcibtawffnjyzmu.supabase.co";
const KEY_STORAGE="ibtisam_supabase_key";
const LOCAL_STORAGE="ibtisam_finance_entries";
const CAT_STORAGE="ibtisam_finance_categories";
const CHILDREN_STORAGE="ibtisam_children";
const EMPLOYEES_STORAGE="ibtisam_employees";
const DEFAULT_CATS={income:["اشتراك الأطفال","دعم آخر"],expense:["الرواتب","الإيجار","الكهرباء","مصروفات أخرى"]};
let supabaseClient=null,entries=[],editId=null,busy=false,activeTab="all",childrenEditId=null;
function money(n){return Number(n||0).toLocaleString("ar-SA",{maximumFractionDigits:2})+" ر.س"}
function monthValue(){return $("month")?.value||new Date().toISOString().slice(0,7)}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function showMessage(id,msg){if($(id))$(id).textContent=msg||""}
function getCats(){try{const x=JSON.parse(localStorage.getItem(CAT_STORAGE)||"null");if(x?.income&&x?.expense)return x}catch(e){}const fresh=JSON.parse(JSON.stringify(DEFAULT_CATS));saveCats(fresh);return fresh}
function saveCats(c){localStorage.setItem(CAT_STORAGE,JSON.stringify(c))}
function getChildren(){try{const x=JSON.parse(localStorage.getItem(CHILDREN_STORAGE)||"[]");return Array.isArray(x)?x:[]}catch(e){return []}}
function seedChildrenFromOctoberIncome(){
  const targetMonth='2026-10';
  const source=entries.filter(x=>x.type==='income'&&x.month.slice(0,7)===targetMonth&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail.trim());
  if(!source.length)return 0;
  const list=getChildren();
  const counts=new Map();
  list.forEach(c=>{const name=String(c.name||'').trim();if(name)counts.set(name,(counts.get(name)||0)+1)});
  let added=0;
  source.forEach(x=>{
    const name=splitCategory(x.category).detail.trim();
    const amount=Number(x.amount)||0;
    const have=counts.get(name)||0;
    const needed=source.filter(y=>splitCategory(y.category).detail.trim()===name).length;
    if(have>=needed)return;
    list.push({id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+added,name,guardian:'',phone:'',subscriptionType:'شهري',subscription:amount,startDate:'2026-10-01',endDate:'2026-11-01',sessionsTotal:16,sessionsUsed:0,sessionRecords:{}});
    counts.set(name,have+1);
    added++;
  });
  if(added)saveChildren(list);
  return added;
}
function saveChildren(list){localStorage.setItem(CHILDREN_STORAGE,JSON.stringify(list));return list}
function childRowFromLocal(c){return {id:String(c.id),name:String(c.name||''),guardian:String(c.guardian||''),phone:String(c.phone||''),subscription_type:String(c.subscriptionType||'شهري'),subscription:Number(c.subscription||0),start_date:c.startDate||null,end_date:c.endDate||null,sessions_total:Number(c.sessionsTotal||16),sessions_used:Number(c.sessionsUsed||0),session_records:c.sessionRecords&&typeof c.sessionRecords==='object'?c.sessionRecords:{},manual_remaining:Number.isFinite(Number(c.manualRemaining))?Number(c.manualRemaining):null,created_at:c.createdAt||undefined,updated_at:new Date().toISOString()}}
function childFromRow(r){return {id:String(r.id),name:r.name||'',guardian:r.guardian||'',phone:r.phone||'',subscriptionType:r.subscription_type||'شهري',subscription:Number(r.subscription||0),startDate:r.start_date||'',endDate:r.end_date||'',sessionsTotal:Number(r.sessions_total||16),sessionsUsed:Number(r.sessions_used||0),sessionRecords:r.session_records&&typeof r.session_records==='object'?r.session_records:{},manualRemaining:r.manual_remaining==null?undefined:Number(r.manual_remaining),createdAt:r.created_at||''}}
async function loadChildrenFromSupabase(){
  if(!supabaseClient) return;
  const {data,error}=await supabaseClient.from('children').select('*').order('created_at',{ascending:false});
  if(error) throw new Error(error.message);

  // Supabase هو المصدر الأساسي للأطفال. لا ندمج localStorage مع الخادم
  // لأن ذلك كان يسبب ظهور نفس الطفل مرتين عندما تختلف الـ IDs.
  const rows=Array.isArray(data)?data:[];
  const seen=new Map();
  const duplicates=[];

  for(const r of rows){
    const name=String(r.name||'').trim().replace(/\s+/g,' ').toLowerCase();
    const guardian=String(r.guardian||'').trim().replace(/\s+/g,' ').toLowerCase();
    const phone=String(r.phone||'').replace(/\s+/g,'');
    const key=name+'|'+guardian+'|'+phone;
    if(!name){
      duplicates.push(r);
      continue;
    }
    if(seen.has(key)){
      // البيانات مرتبة من الأحدث إلى الأقدم، لذلك نحتفظ بالأحدث.
      duplicates.push(r);
      continue;
    }
    seen.set(key,r);
  }

  const uniqueRows=[...seen.values()];
  const unique=uniqueRows.map(childFromRow);

  // حذف النسخ المكررة من Supabase حتى لا تعود في أي جهاز لاحقاً.
  if(duplicates.length){
    const ids=duplicates.map(r=>String(r.id)).filter(Boolean);
    if(ids.length){
      const {error:delErr}=await supabaseClient.from('children').delete().in('id',ids);
      if(delErr) console.warn('تعذر تنظيف النسخ المكررة من Supabase:',delErr.message);
    }
  }

  saveChildren(unique);
  return unique;
}
async function syncChildToSupabase(child){
  if(!supabaseClient||!child)return;
  const row=childRowFromLocal(child); delete row.created_at;
  const {error}=await supabaseClient.from('children').upsert(row,{onConflict:'id'});
  if(error) throw new Error(error.message);
}
async function deleteChildFromSupabase(id){
  if(!supabaseClient)return;
  const {error}=await supabaseClient.from('children').delete().eq('id',String(id));
  if(error) throw new Error(error.message);
}
async function syncAllChildren(){
  const list=getChildren();
  if(!supabaseClient||!list.length)return;
  const {error}=await supabaseClient.from('children').upsert(list.map(childRowFromLocal),{onConflict:'id'});
  if(error) throw new Error(error.message);
}
function childPaidThisMonth(childName,m=monthValue()){return entries.filter(x=>x.type==='income'&&x.month.slice(0,7)===m&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===childName).reduce((a,x)=>a+x.amount,0)}
function childStatus(child,paid){const total=Number(child.subscription||0);if(total<=0)return ['غير محدد','neutral'];if(paid<=0)return ['غير مدفوع','danger'];if(paid<total)return ['مدفوع جزئي','warn'];return ['مدفوع','good']}
function childLifeStatus(child){const today=new Date();today.setHours(0,0,0,0);if(child.endDate){const end=new Date(child.endDate+'T00:00:00');if(end<today)return ['منتهي','danger']}if(child.startDate){const start=new Date(child.startDate+'T00:00:00');if(start>today)return ['لم يبدأ','neutral']}return ['نشط','good']}
function childSessionsTotal(child){const n=Number(child.sessionsTotal);return Number.isFinite(n)&&n>0?n:16}
function getSessionRecords(child){const total=childSessionsTotal(child);const raw=child&&child.sessionRecords&&typeof child.sessionRecords==='object'?child.sessionRecords:{};const out={};for(let i=1;i<=total;i++){const v=raw[String(i)];if(v==='absent'||v==='attended')out[String(i)]=v}return out}
function isWorkday(d){const day=d.getDay();return day!==5&&day!==6}
function sessionDate(child,n){if(!child?.startDate)return null;const d=new Date(child.startDate+'T00:00:00');const end=child.endDate?new Date(child.endDate+'T00:00:00'):null;let count=0,guard=0;while(count<n&&guard<370){if(end&&d>end)return null;if(isWorkday(d))count++;if(count<n)d.setDate(d.getDate()+1);guard++}return count===n?d:null}
function sessionEffectiveStatus(child,n){const records=getSessionRecords(child),explicit=records[String(n)];if(explicit)return explicit;const d=sessionDate(child,n);if(!d)return 'pending';const today=new Date();today.setHours(0,0,0,0);return d<today?'attended':'pending'}
function sessionStats(child){const total=childSessionsTotal(child),records=getSessionRecords(child),vals=[];for(let i=1;i<=total;i++)vals.push(sessionEffectiveStatus(child,i));const attended=vals.filter(v=>v==='attended').length,absent=vals.filter(v=>v==='absent').length,postponed=Math.min(absent,3),chargedAbsences=Math.max(absent-3,0),autoUsed=attended+chargedAbsences;const manual=Number.isFinite(Number(child.manualRemaining))?Math.max(0,Math.min(total,Number(child.manualRemaining))):null;const used=manual===null?autoUsed:Math.max(0,total-manual);return {records,attended,absent,postponed,chargedAbsences,used,remaining:manual===null?Math.max(total-used,0):manual}}
function childSessionsUsed(child){return sessionStats(child).used}
function childSessionsRemaining(child){return sessionStats(child).remaining}
function sessionPillsHtml(child){
  const total=childSessionsTotal(child),st=sessionStats(child);
  let h='';
  let absenceRank=0;
  for(let i=1;i<=total;i++){
    const v=sessionEffectiveStatus(child,i);
    let cls='';
    let label=String(i);
    if(v==='absent'){absenceRank++;cls=absenceRank<=3?'absent':'absent charged';label='×';}
    else if(v==='attended'){cls='attended';label='✓';}
    h+=`<button type="button" class="session-pill ${cls}" title="الجلسة ${i}" onclick="event.preventDefault();event.stopPropagation();toggleSession('${esc(child.id)}',${i})">${label}</button>`;
  }
  return h;
}
function sessionListHtml(child,interactive=false){
  const total=childSessionsTotal(child),st=sessionStats(child);
  let h='';
  let absenceRank=0;
  for(let i=1;i<=total;i++){
    const v=sessionEffectiveStatus(child,i),d=sessionDate(child,i),date=d?d.toLocaleDateString('ar-SA-u-ca-gregory',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
    let cls=v==='attended'?'attended':v==='absent'?'absent':'';
    if(v==='absent'){absenceRank++;if(absenceRank>3)cls+=' charged';}
    const state=v==='attended'?'✓':v==='absent'?'×':'—';
    const inner=`<span><span class="session-no">الجلسة ${i}</span><span class="session-date">${date}</span></span><span class="session-state">${state}</span>`;
    if(interactive){
      h+=`<button type="button" class="session-item ${cls} ${v==='pending'?'pending':''}" title="تغيير حالة الجلسة ${i}" onclick="event.preventDefault();event.stopPropagation();toggleSession('${esc(child.id)}',${i})">${inner}</button>`;
    }else h+=`<div class="session-item ${cls} ${v==='pending'?'pending':''}">${inner}</div>`;
  }
  return h;
}
function sessionButtonsHtml(child){
  const st=sessionStats(child);
  return `<div class="session-prep"><div class="session-prep-head"><span class="session-prep-title">تفاصيل الجلسات</span><button type="button" class="session-edit-btn" onclick="event.stopPropagation();editRemainingSessions('${esc(child.id)}')">تعديل المتبقي</button></div><div class="session-list">${sessionListHtml(child,true)}</div><div class="session-legend"><span><b>✓</b> حضور</span><span><b>×</b> غياب وتأجيل</span><span>الجمعة والسبت إجازة</span></div><div class="session-delay">المؤجل: ${st.postponed} · المحتسب: ${st.chargedAbsences}</div></div>`;
}
function compactSessionPrepHtml(child){
  const st=sessionStats(child);
  return `<div class="session-prep compact" onclick="event.stopPropagation()"><div class="session-prep-head"><span class="session-prep-title">التحضير</span><span class="session-prep-note">${st.remaining} متبقية</span></div><div class="session-pills">${sessionPillsHtml(child)}</div></div>`;
}
async function toggleSession(id,n){
  if(busy)return;
  const list=getChildren(),i=list.findIndex(x=>String(x.id)===String(id));if(i<0)return;
  const c=list[i],records=getSessionRecords(c),key=String(n),explicit=records[key];
  if(explicit==='absent')records[key]='attended';else if(explicit==='attended')delete records[key];else records[key]='absent';
  const updated={...c,sessionRecords:records,manualRemaining:undefined};
  updated.sessionsUsed=sessionStats(updated).used;
  busy=true;
  try{
    await syncChildToSupabase(updated);
    list[i]=updated;saveChildren(list);renderChildren();
    if($('modal')?.classList.contains('show'))setTimeout(()=>openChildDetails(id),0);
  }catch(e){console.error(e);alert('تعذر حفظ الجلسة على الخادم. لم يتم تغيير البيانات.')}finally{busy=false}
}
async function editRemainingSessions(id){
  const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;
  const st=sessionStats(c),value=prompt('اكتب عدد الجلسات المتبقية:',String(st.remaining));if(value===null)return;
  const n=Number(value);if(!Number.isFinite(n)||!Number.isInteger(n)){alert('اكتب رقمًا صحيحًا.');return}
  const total=childSessionsTotal(c),remaining=Math.max(0,Math.min(total,n));
  const list=getChildren(),i=list.findIndex(x=>String(x.id)===String(id));if(i<0)return;
  const used=total-remaining,updated={...c,manualRemaining:remaining,sessionManualUsed:used,sessionsUsed:used};
  try{await syncChildToSupabase(updated);list[i]=updated;saveChildren(list);renderChildren()}catch(e){console.error(e);alert('تعذر حفظ تعديل الجلسات على الخادم. لم يتم تغيير البيانات.')}
}

function renderChildren(){const root=$('root');if(!root)return;const searchValue=window.childrenSearch||'';const oldInput=document.querySelector('.children-tools .search-box');const keepSearchFocus=!!(oldInput&&document.activeElement===oldInput);root.innerHTML=childrenShell();applyTheme();const input=document.querySelector('.children-tools .search-box');if(input&&keepSearchFocus){input.focus();try{input.setSelectionRange(searchValue.length,searchValue.length)}catch(e){}}}
function migrateSessionRecordsV3(){
  const flag='ibtisam_sessions_weekend_fix_v3';
  if(localStorage.getItem(flag)) return;
  const list=getChildren();
  let changed=false;
  list.forEach(c=>{
    if(c&&c.sessionRecords&&typeof c.sessionRecords==='object'){
      const cleaned={};
      Object.entries(c.sessionRecords).forEach(([k,v])=>{
        // Any old automatic attendance saved by the previous version is removed.
        // Keep explicit absences so the user's postponement records are not lost.
        if(v==='absent') cleaned[k]=v;
      });
      if(JSON.stringify(cleaned)!==JSON.stringify(c.sessionRecords)){
        c.sessionRecords=cleaned;
        c.sessionsUsed=undefined;
        changed=true;
      }
    }
  });
  if(changed) saveChildren(list);
  localStorage.setItem(flag,'1');
}
function showChildren(el){setNav(el);window.childrenSearch='';migrateSessionRecordsV3();renderChildren()}

function openChildModal(id=null){childrenEditId=id;const c=id?getChildren().find(x=>String(x.id)===String(id)):null;$('sheet').innerHTML=`<h3>${c?'تعديل بيانات الطفل':'إضافة طفل'}</h3><label class="field"><span>اسم الطفل</span><input id="cName" value="${esc(c?.name||'')}" placeholder="اسم الطفل"></label><label class="field"><span>ولي الأمر</span><input id="cGuardian" value="${esc(c?.guardian||'')}" placeholder="اسم ولي الأمر"></label><label class="field"><span>رقم التواصل</span><input id="cPhone" type="tel" inputmode="tel" value="${esc(c?.phone||'')}" placeholder="05xxxxxxxx"></label><label class="field"><span>نوع الاشتراك</span><input id="cSubscriptionType" value="${esc(c?.subscriptionType||'شهري')}" placeholder="شهري"></label><label class="field"><span>قيمة الاشتراك</span><input id="cSubscription" type="number" inputmode="decimal" value="${c?.subscription??''}" placeholder="1000"></label><label class="field"><span>عدد الجلسات</span><input id="cSessions" type="number" inputmode="numeric" min="1" value="${c?.sessionsTotal??16}" placeholder="16"></label><div class="date-fields"><label class="field date-field"><span><i>◷</i> بداية الاشتراك</span><div class="date-input-wrap"><input id="cStart" type="date" value="${esc(c?.startDate||'')}" onclick="this.showPicker&&this.showPicker()" onfocus="this.showPicker&&this.showPicker()"></div></label><label class="field date-field"><span><i>◷</i> نهاية الاشتراك</span><div class="date-input-wrap"><input id="cEnd" type="date" value="${esc(c?.endDate||'')}" onclick="this.showPicker&&this.showPicker()" onfocus="this.showPicker&&this.showPicker()"></div></label></div><div class="hint">تسجيل الطفل لا يُسجل دخلًا. الدخل يُضاف فقط عند تسجيل مبلغ مقبوض فعليًا.</div><div id="cMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">${c?'إلغاء':'إنهاء'}</button><button type="button" id="saveChildBtn" class="primary" onclick="saveChild();return false;">${c?'حفظ التعديل':'حفظ وإضافة طفل آخر'}</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('cName')?.focus(),50)}
async function saveChild(){
  const btn=$('saveChildBtn');
  if(btn && btn.dataset.saving==='1') return;
  const name=$('cName')?.value.trim()||'',
        guardian=$('cGuardian')?.value.trim()||'',
        phone=$('cPhone')?.value.trim()||'',
        subscriptionType=$('cSubscriptionType')?.value.trim()||'شهري',
        subscription=Number($('cSubscription')?.value||0),
        sessionsTotal=Math.max(1,Number($('cSessions')?.value||16)),
        startDate=$('cStart')?.value||'',
        endDate=$('cEnd')?.value||'';
  if(!name){showMessage('cMsg','اكتب اسم الطفل.');$('cName')?.focus();return}
  if(subscription<0){showMessage('cMsg','قيمة الاشتراك غير صحيحة.');return}
  if(startDate&&endDate&&endDate<startDate){showMessage('cMsg','تاريخ نهاية الاشتراك يجب أن يكون بعد تاريخ البداية.');return}
  if(btn){btn.dataset.saving='1';btn.disabled=true}
  try{
    const list=getChildren();
    const normalizedName=normalizeChildName(name);
    const duplicate=list.find(x=>normalizeChildName(x.name)===normalizedName && String(x.id)!==String(childrenEditId||''));
    if(duplicate){showMessage('cMsg','هذا الطفل موجود مسبقًا. استخدم «تعديل» بدل إضافة نسخة جديدة.');if(btn){btn.disabled=false;btn.dataset.saving='0'}return}

    if(childrenEditId){
      const i=list.findIndex(x=>String(x.id)===String(childrenEditId));
      if(i<0) throw new Error('تعذر العثور على الطفل.');
      const old=list[i];
      const updated={...old,name,guardian,phone,subscriptionType,subscription,sessionsTotal,
        sessionsUsed:Math.min(childSessionsUsed(old),sessionsTotal),
        sessionRecords:old.sessionRecords||{},
        manualRemaining:Number.isFinite(Number(old.manualRemaining))?Math.min(Number(old.manualRemaining),sessionsTotal):undefined,
        startDate,endDate};
      await syncChildToSupabase(updated);
      list[i]=updated;
      saveChildren(list);
      closeModal();renderChildren();return;
    }

    const created={id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name,guardian,phone,subscriptionType,subscription,sessionsTotal,sessionsUsed:0,sessionRecords:{},startDate,endDate};
    await syncChildToSupabase(created);
    list.unshift(created);
    saveChildren(list);
    renderChildren();
    $('cName').value='';$('cGuardian').value='';$('cPhone').value='';$('cSubscriptionType').value='شهري';$('cSubscription').value='';$('cSessions').value='16';$('cStart').value='';$('cEnd').value='';
    showMessage('cMsg','انضاف الطفل بنجاح ✓');
    if(btn){btn.disabled=false;btn.dataset.saving='0';btn.textContent='حفظ وإضافة طفل آخر'}
    setTimeout(()=>$('cName')?.focus(),50);
  }catch(e){
    showMessage('cMsg','تعذر حفظ الطفل: '+(e?.message||'خطأ غير معروف'));
    if(btn){btn.disabled=false;btn.dataset.saving='0'}
  }
}
function formatPaymentDate(v){if(!v)return '';try{return new Date(v).toLocaleDateString('ar-SA-u-ca-gregory',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return ''}}
function paymentTimestamp(date){return String(date||'')+'T12:00:00+03:00'}
function childPaymentHistory(childName){return entries.filter(x=>x.type==='income'&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===childName).sort((a,b)=>String(b.createdAt||b.month).localeCompare(String(a.createdAt||a.month))).map(x=>({amount:Number(x.amount)||0,date:formatPaymentDate(x.createdAt)||String(x.month).slice(0,10),month:String(x.month).slice(0,7),id:x.id}))}
function openChildDetails(id){const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;const m=localStorage.getItem('ibtisam_children_month')||monthValue(),paid=childPaidThisMonth(c.name,m),total=Number(c.subscription||0),remain=Math.max(total-paid,0),life=childLifeStatus(c),st=childStatus(c,paid),history=childPaymentHistory(c.name),historyHtml=history.length?history.map((p,i)=>`<div class="payment-row"><div class="payment-row-main"><strong>دفعة ${history.length-i}</strong><span>${esc(p.date)} · ${esc(p.month)}</span></div><div class="payment-row-amount">${money(p.amount)}</div><button type="button" class="mini payment-edit" onclick="event.stopPropagation();openEditChildPayment('${esc(c.id)}','${esc(p.id)}')">تعديل</button></div>`).join(''):`<div class="payment-empty">ما فيه دفعات مسجلة لهذا الطفل حتى الآن</div>`;$('sheet').innerHTML=`<h3>${esc(c.name)}</h3><div class="child-detail-grid"><div><span>ولي الأمر</span><strong>${esc(c.guardian||'غير مضاف')}</strong></div><div><span>رقم التواصل</span><strong>${esc(c.phone||'غير مضاف')}</strong></div><div><span>نوع الاشتراك</span><strong>${esc(c.subscriptionType||'شهري')}</strong></div><div><span>قيمة الاشتراك</span><strong>${money(total)}</strong></div><div><span>المقبوض هذا الشهر</span><strong class="good-text">${money(paid)}</strong></div><div><span>المتبقي</span><strong class="warn-text">${money(remain)}</strong></div><div><span>حالة الاشتراك</span><strong>${life[0]}</strong></div><div><span>حالة الدفع</span><strong>${st[0]}</strong></div><div><span>عدد الجلسات</span><strong>${childSessionsTotal(c)}</strong></div><div><span>الجلسات المتبقية</span><strong class="warn-text">${childSessionsRemaining(c)}</strong></div></div><div class="hint">من ${esc(c.startDate||'غير محدد')} إلى ${esc(c.endDate||'غير محدد')}<br>الجمعة والسبت إجازة، والجلسة تُحسب حضورًا تلقائيًا بعد موعدها ما لم تسجل غيابًا.</div>${sessionButtonsHtml(c)}<div class="payment-history"><div class="payment-history-head"><strong>سجل الدفعات</strong><span class="payment-count">${history.length} ${history.length===1?'دفعة':'دفعات'}</span></div><div class="payment-list">${historyHtml}</div>${history.length?`<div class="payment-total"><span>إجمالي الدفعات</span><strong>${money(history.reduce((a,p)=>a+p.amount,0))}</strong></div>`:''}</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إغلاق</button><button class="primary" onclick="openChildPayment('${esc(c.id)}')">+ تسجيل دفعة</button></div>`;$('modal').classList.add('show')}

async function deleteChild(id){const c=getChildren().find(x=>String(x.id)===String(id));if(!c||busy)return;const linked=entries.filter(x=>x.type==='income'&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===c.name);const msg=linked.length?`حذف الطفل ${c.name}؟\nسيتم حذف الطفل وجميع دفعات اشتراك الأطفال المرتبطة باسمه (${linked.length} حركة مالية).`:`حذف الطفل ${c.name}؟\nسيتم حذف بيانات الطفل فقط.`;if(!confirm(msg))return;busy=true;try{if(linked.length){const ids=linked.map(x=>Number(x.id)).filter(Number.isFinite);if(ids.length){const {error}=await supabaseClient.from('financial_entries').delete().in('id',ids);if(error)throw error;}}const next=getChildren().filter(x=>String(x.id)!==String(id));await deleteChildFromSupabase(id);saveChildren(next);entries=entries.filter(x=>!linked.some(y=>String(y.id)===String(x.id)));renderChildren();closeModal()}catch(e){alert('تعذر حذف الطفل بالكامل: '+(e?.message||e))}finally{busy=false}}
function openChildPayment(id){const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;const paid=childPaidThisMonth(c.name,localStorage.getItem('ibtisam_children_month')||monthValue());const remain=Math.max(Number(c.subscription||0)-paid,0);if(remain<=0){alert('الاشتراك مدفوع بالكامل لهذا الشهر.');return}childrenEditId=null;$('sheet').innerHTML=`<h3>تسجيل دفعة</h3><div class="hint" style="margin-bottom:10px"><strong>${esc(c.name)}</strong><br>قيمة الاشتراك: ${money(c.subscription)} · المقبوض: ${money(paid)} · المتبقي: ${money(remain)}</div><label class="field"><span>المبلغ المقبوض</span><input id="pAmount" type="number" inputmode="decimal" value="${remain}" max="${remain}" placeholder="0"></label><label class="field"><span>تاريخ القبض</span><input id="pDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><div id="pMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveChildPayment('${esc(c.id)}')">حفظ الدفعة</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('pAmount')?.focus(),50)}
function openEditChildPayment(childId,paymentId){const c=getChildren().find(x=>String(x.id)===String(childId));const p=entries.find(x=>String(x.id)===String(paymentId));if(!c||!p)return;const m=String(p.month).slice(0,7);if(isMonthLocked(m)){alert('هذا الشهر مقفل ولا يمكن تعديل الدفعة.');return}const otherPaid=entries.filter(x=>String(x.id)!==String(p.id)&&x.type==='income'&&x.month.slice(0,7)===m&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===c.name).reduce((a,x)=>a+x.amount,0);const max=Math.max(Number(c.subscription||0)-otherPaid,0);const currentDate=p.createdAt?String(p.createdAt).slice(0,10):String(p.month).slice(0,7)+'-01';$('sheet').innerHTML=`<h3>تعديل الدفعة</h3><div class="hint" style="margin-bottom:10px"><strong>${esc(c.name)}</strong><br>قيمة الاشتراك: ${money(c.subscription)} · الدفعة الحالية: ${money(p.amount)} · أقصى مبلغ: ${money(max)}</div><label class="field"><span>المبلغ المقبوض الفعلي</span><input id="epAmount" type="number" inputmode="decimal" value="${Number(p.amount)||0}" max="${max}" placeholder="0"></label><label class="field"><span>تاريخ القبض</span><input id="epDate" type="date" value="${esc(currentDate)}"></label><div class="hint">إذا استلمت جزءًا فقط من المبلغ، عدّل المبلغ والتاريخ حسب المقبوض الفعلي.</div><div id="epMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveEditedChildPayment('${esc(c.id)}','${esc(p.id)}')">حفظ التعديل</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('epAmount')?.focus(),50)}
async function saveEditedChildPayment(childId,paymentId){if(busy)return;const c=getChildren().find(x=>String(x.id)===String(childId));const p=entries.find(x=>String(x.id)===String(paymentId));if(!c||!p)return;const amount=Number($('epAmount').value),date=$('epDate').value||String(p.month).slice(0,7)+'-01',m=date.slice(0,7);if(isMonthLocked(String(p.month).slice(0,7))||isMonthLocked(m)){showMessage('epMsg','هذا الشهر مقفل ولا يمكن تعديل الدفعة.');return}const otherPaid=entries.filter(x=>String(x.id)!==String(p.id)&&x.type==='income'&&x.month.slice(0,7)===m&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===c.name).reduce((a,x)=>a+x.amount,0);const max=Math.max(Number(c.subscription||0)-otherPaid,0);if(!amount||amount<=0){showMessage('epMsg','اكتب مبلغ المقبوض الفعلي.');return}if(amount>max){showMessage('epMsg',`أقصى مبلغ مسموح لهذه الدفعة ${money(max)}.`);return}busy=true;showMessage('epMsg','جاري حفظ التعديل...');try{const {data,error}=await supabaseClient.from('financial_entries').update({month:m+'-01',amount,created_at:paymentTimestamp(date)}).eq('id',Number(p.id)).select('id,month,type,category,amount,created_at').single();if(error)throw error;Object.assign(p,{id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount),createdAt:data.created_at||paymentTimestamp(date)});closeModal();renderChildren();setTimeout(()=>openChildDetails(childId),80)}catch(e){showMessage('epMsg','تعذر تعديل الدفعة: '+e.message)}finally{busy=false}}
async function saveChildPayment(id){if(busy)return;const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;const amount=Number($('pAmount').value),date=$('pDate').value||new Date().toISOString().slice(0,10);const m=date.slice(0,7);const paid=childPaidThisMonth(c.name,m),remain=Math.max(Number(c.subscription||0)-paid,0);if(!amount||amount<=0){showMessage('pMsg','اكتب مبلغ المقبوض.');return}if(amount>remain){showMessage('pMsg',`المتبقي فقط ${money(remain)}.`);return}busy=true;showMessage('pMsg','جاري تسجيل الدفعة...');try{const {data,error}=await supabaseClient.from('financial_entries').insert({month:m+'-01',type:'income',category:makeCategory('اشتراك الأطفال',c.name),amount,created_at:paymentTimestamp(date)}).select('id,month,type,category,amount,created_at').single();if(error)throw error;entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount),createdAt:data.created_at||paymentTimestamp(date)});closeModal();localStorage.setItem('ibtisam_children_month',m);renderChildren()}catch(e){showMessage('pMsg','تعذر تسجيل الدفعة: '+e.message)}finally{busy=false}}

function keyScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>ربط قاعدة البيانات</p></div></div><h2>مفتاح Supabase</h2><p>أدخل Publishable key الخاص بمشروعك.</p><label class="field"><span>Publishable key</span><input id="sbKey" type="password" placeholder="sb_publishable_..."></label><div class="hint">المفتاح يحفظ على هذا الجهاز فقط.</div><div id="keyMsg" class="msg">${esc(message)}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px" onclick="saveKey()">متابعة</button></div></div>`}
function authScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div><h2>تسجيل الدخول</h2><p>سجّل الدخول بحساب Supabase المرتبط بالموقع.</p><label class="field"><span>البريد الإلكتروني</span><input id="email" type="email" autocomplete="email"></label><label class="field"><span>كلمة المرور</span><input id="password" type="password" autocomplete="current-password"></label><div id="authMsg" class="msg">${esc(message)}</div><div style="display:flex;gap:8px"><button class="primary" style="flex:1;padding:13px;border-radius:13px" onclick="signIn()">دخول</button><button class="ghost" style="flex:1;padding:13px;border-radius:13px" onclick="signUp()">إنشاء حساب</button></div><button class="ghost" style="width:100%;margin-top:9px;padding:12px;border-radius:13px" onclick="changeKey()">تغيير المفتاح</button></div></div>`}
async function boot(){const key=localStorage.getItem(KEY_STORAGE);if(!key){$("root").innerHTML=keyScreen();return}try{supabaseClient=window.supabase.createClient(SUPABASE_URL,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data:{session},error}=await supabaseClient.auth.getSession();if(error)throw error;if(session){await loadEntries();await loadChildrenFromSupabase();showApp()}else $("root").innerHTML=authScreen()}catch(e){console.error("Supabase boot error",e);$("root").innerHTML=authScreen("تعذر الاتصال بـ Supabase حالياً. اضغط دخول مرة أخرى للمحاولة.") }}
function saveKey(){const key=$("sbKey").value.trim();if(!key){showMessage("keyMsg","أدخل المفتاح أولًا.");return}localStorage.setItem(KEY_STORAGE,key);boot()}
function changeKey(){localStorage.removeItem(KEY_STORAGE);supabaseClient=null;$("root").innerHTML=keyScreen()}
async function signIn(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}if(!supabaseClient){showMessage("authMsg","تعذر تهيئة الاتصال. اضغط تغيير المفتاح ثم أدخل المفتاح مرة أخرى.");return}showMessage("authMsg","جاري الاتصال بـ Supabase...");let lastError=null;for(let attempt=1;attempt<=3;attempt++){try{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){showMessage("authMsg",error.message||"تعذر تسجيل الدخول");return}if(!data?.session){showMessage("authMsg","تم الاتصال لكن لم يتم إنشاء جلسة دخول. حاول مرة أخرى.");return}await loadEntries();await loadChildrenFromSupabase();showApp();return}catch(e){lastError=e;const msg=String(e?.message||e||"");console.error("Supabase sign-in attempt",attempt,e);if(!/load failed|failed to fetch|network|fetch/i.test(msg))break;if(attempt<3){showMessage("authMsg","تعذر الاتصال مؤقتاً... إعادة المحاولة "+attempt+"/2");await new Promise(r=>setTimeout(r,1200*attempt))}}}const msg=String(lastError?.message||lastError||"");if(/load failed|failed to fetch|network|fetch/i.test(msg)){showMessage("authMsg","الاتصال بخدمة Supabase لم يكتمل. جرّبت الاتصال 3 مرات. لا تغيّر المفتاح؛ جرّب بعد دقيقة أو من شبكة أخرى.")}else showMessage("authMsg","تعذر تسجيل الدخول: "+msg)}
async function signUp(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}if(password.length<6){showMessage("authMsg","كلمة المرور 6 أحرف على الأقل.");return}const {data,error}=await supabaseClient.auth.signUp({email,password});if(error){showMessage("authMsg",error.message);return}if(data.session){await loadEntries();await loadChildrenFromSupabase();showApp()}else showMessage("authMsg","تم إنشاء الحساب. إذا طُلب تأكيد البريد، أكده ثم سجّل الدخول.")}
async function loadEntries(){const {data,error}=await supabaseClient.from("financial_entries").select("id,month,type,category,amount,created_at").order("created_at",{ascending:true});if(error)throw new Error(error.message);entries=(data||[]).map(x=>({id:String(x.id),month:String(x.month).slice(0,10),type:x.type,category:x.category,amount:Number(x.amount),createdAt:x.created_at||''}));}
function splitCategory(v){const parts=String(v||'').split('::');return {main:parts[0]||'',detail:parts.slice(1).join('::')||''}}
function makeCategory(main,detail){return detail?.trim()?main+'::'+detail.trim():main}
function categoryHash(v){return 'cat_'+encodeURIComponent(String(v)).replace(/%/g,'_').replace(/[^a-zA-Z0-9_]/g,'').slice(0,80)}
function toggleCategory(id){const el=$(id);if(el)el.classList.toggle('open')}
function categoryGroups(type,list,search=''){const base=getCats()[type]||[];const q=String(search||'').trim().toLowerCase();const discovered=list.map(x=>splitCategory(x.category).main).filter(Boolean);let cats=[...base,...discovered.filter(c=>!base.includes(c))];if(q)cats=cats.filter(cat=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);return cat.toLowerCase().includes(q)||arr.length>0});return cats.map((cat,idx)=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);const sum=arr.reduce((a,x)=>a+x.amount,0);const id=categoryHash(type+'|'+cat+'|'+idx);const safeType=esc(type);const encodedCat=encodeURIComponent(String(cat));const matched=q&&arr.length>0;const open=matched||(!q&&false);return `<div class="main-category ${type}${open?' open':''}" id="${id}" data-category-type="${safeType}" data-category-key="${encodedCat}"><div class="category-toggle" role="button" tabindex="0" onclick="toggleCategory('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCategory('${id}')}"><div class="main-left"><div class="main-icon">${type==='income'?'↗':'↘'}</div><div><div class="main-name">${esc(cat)}</div><div class="main-total">${money(sum)}</div></div></div><div class="category-actions"><button type="button" class="mini" data-action="rename-main" data-type="${safeType}" data-name="${encodedCat}">تعديل</button><button type="button" class="mini danger" data-action="delete-main" data-type="${safeType}" data-name="${encodedCat}"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button><span class="chev" aria-hidden="true">⌄</span></div></div><div class="sub-list">${arr.length?arr.map(x=>subEntryHtml(x)).join(''):`<div class="empty">${q?'لا توجد نتائج مطابقة':'لا توجد تفاصيل بعد'}</div>`}<button type="button" class="mini" style="justify-self:start" onclick="event.stopPropagation();openEntryModal('${safeType}',null,decodeURIComponent('${encodedCat}'))">+ إضافة عنوان فرعي</button></div></div>`}).join('')}
function mainCategoryAction(event,button){event.preventDefault();event.stopPropagation();const type=button.dataset.type;const name=decodeURIComponent(button.dataset.name||'');if(button.dataset.action==='rename-main')renameMainCategory(type,name);else if(button.dataset.action==='delete-main')removeMainCategory(type,name)}
document.addEventListener('click',function(event){
 const b=event.target.closest('[data-action="rename-main"],[data-action="delete-main"]');
 if(b){mainCategoryAction(event,b);return}
 const m=event.target.closest('[data-modal-action]');
 if(m){
  event.preventDefault();event.stopPropagation();
  const action=m.dataset.modalAction;
  const type=m.dataset.type||'';
  const name=decodeURIComponent(m.dataset.name||'');
  if(action==='apply-rename-main') applyRenameMainCategory(type,name);
  if(action==='apply-delete-main') applyRemoveMainCategory(type,name);
 }
});
function subEntryHtml(x){const p=splitCategory(x.category);const name=p.detail||'بدون عنوان فرعي';const paymentDate=x.createdAt?formatPaymentDate(x.createdAt):'';const dateText=paymentDate||String(x.month).slice(0,10);return `<div class="sub-row"><div><div class="sub-name">${esc(name)}</div><div class="sub-main">العنوان الفرعي · تاريخ القبض: ${esc(dateText)}</div></div><div style="display:flex;align-items:center;gap:7px"><div class="sub-amount ${x.type}">${money(x.amount)}</div><button class="mini" onclick="event.stopPropagation();editEntry('${x.id}')">تعديل</button><button class="mini danger" onclick="event.stopPropagation();deleteEntry('${x.id}')"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button></div></div>`}
function expenseChart(list){const income=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0);const expense=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);const remaining=income-expense;const positiveRemaining=Math.max(remaining,0);const chartTotal=income+expense+positiveRemaining;if(chartTotal<=0)return `<div class="empty">لا توجد بيانات مالية لعرض التشارت</div>`;const groups=[{name:'الدخل',total:income,color:'#16a06a'},{name:'المصروفات',total:expense,color:'#ef4b55'},{name:'المتبقي',total:positiveRemaining,color:'#1677ff'}].filter(x=>x.total>0);let cur=0;const stops=groups.map(g=>{const a=cur/chartTotal*100,b=(cur+g.total)/chartTotal*100;cur+=g.total;return `${g.color} ${a}% ${b}%`}).join(',');const center=remaining<0?`<div style="color:var(--red)">${money(Math.abs(remaining))}<br><span style="font-size:10px;color:var(--muted)">عجز</span></div>`:`<div>${money(remaining)}<br><span style="font-size:10px;color:var(--muted)">المتبقي</span></div>`;return `<div class="chart-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div class="chart-center">${center}</div></div><div class="legend">${groups.map(g=>{const pct=(g.total/chartTotal*100);return `<div class="legend-item"><div class="legend-name"><span class="dot" style="background:${g.color}"></span>${g.name}</div><div class="legend-val">${money(g.total)} · ${pct.toFixed(1)}%</div></div>`}).join('')}${remaining<0?`<div class="legend-item"><div class="legend-name"><span class="dot" style="background:#ef4b55"></span>العجز</div><div class="legend-val">${money(Math.abs(remaining))}</div></div>`:''}</div></div>`}

).style.width=Math.min(100,income/total*100)+'%';if($('homeExpenseBar'))$('homeExpenseBar').style.width=Math.min(100,expense/total*100)+'%';const alerts=[];if(paidPending)alerts.push(`<div class="home-alert"><span class="alert-title">اشتراكات عليها مبالغ متبقية</span><span class="alert-value">${paidPending} طفل</span></div>`);if(endsSoon)alerts.push(`<div class="home-alert"><span class="alert-title">اشتراكات تنتهي خلال 7 أيام</span><span class="alert-value">${endsSoon} طفل</span></div>`);if(expired)alerts.push(`<div class="home-alert"><span class="alert-title">اشتراكات منتهية</span><span class="alert-value">${expired} طفل</span></div>`);if(!alerts.length)alerts.push(`<div class="home-empty">لا توجد تنبيهات حالية ✓</div>`);if($('homeAlerts'))$('homeAlerts').innerHTML=alerts.join('')}

function printMonthlyReport(m){
 const {monthLabel}=buildMonthlyReport(m);
 const oldTitle=document.title;
 document.title=`تقرير مالي - ${monthLabel} - مركز ابتسام`;
 setTimeout(()=>{window.print();setTimeout(()=>{$('printReport').setAttribute('aria-hidden','true');document.title=oldTitle},700)},100);
}
async function saveMonthlyPDF(m){
 const {monthLabel}=buildMonthlyReport(m);
 const report=$('printReport');
 try{
  report.style.display='block';
  if(!window.html2canvas || !window.jspdf){
   alert('تعذر تجهيز ملف PDF. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.');
   return;
  }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const canvas=await html2canvas(report,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:Math.max(report.scrollWidth,794)});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  const pageW=210,pageH=297,margin=7;
  const imgW=pageW-margin*2;
  const imgH=canvas.height*imgW/canvas.width;
  const pageContentH=pageH-margin*2;
  if(imgH<=pageContentH){
   pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,imgW,imgH,undefined,'FAST');
  }else{
   const pxPerMm=canvas.width/imgW;
   const pagePx=Math.floor(pageContentH*pxPerMm);
   let offset=0;
   let page=0;
   while(offset<canvas.height){
    const sliceH=Math.min(pagePx,canvas.height-offset);
    const slice=document.createElement('canvas');
    slice.width=canvas.width;slice.height=sliceH;
    const ctx=slice.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas,0,offset,canvas.width,sliceH,0,0,canvas.width,sliceH);
    if(page>0)pdf.addPage();
    pdf.addImage(slice.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,imgW,sliceH/pxPerMm,undefined,'FAST');
    offset+=sliceH;page++;
   }
  }
  pdf.save(`تقرير مالي - ${monthLabel} - مركز ابتسام.pdf`);
 }catch(e){
  alert('تعذر حفظ ملف PDF: '+(e.message||'خطأ غير معروف'));
 }finally{
  report.style.display='';
  report.setAttribute('aria-hidden','true');
 }
}
