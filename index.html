<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL="https://dwifylcibtawffnjyzmu.supabase.co";
const KEY_STORAGE="ibtisam_supabase_key";
const LOCAL_STORAGE="ibtisam_finance_entries";
const CAT_STORAGE="ibtisam_finance_categories";
const DEFAULT_CATS={income:["اشتراك الأطفال","دعم آخر"],expense:["الرواتب","الإيجار","الكهرباء","مصروفات أخرى"]};
let supabaseClient=null,entries=[],editId=null,busy=false,activeTab="all",childrenEditId=null;
function money(n){return Number(n||0).toLocaleString("ar-SA",{maximumFractionDigits:2})+" ر.س"}
function monthValue(){return $("month")?.value||new Date().toISOString().slice(0,7)}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function showMessage(id,msg){if($(id))$(id).textContent=msg||""}
function getCats(){try{const x=JSON.parse(localStorage.getItem(CAT_STORAGE)||"null");if(x?.income&&x?.expense)return x}catch(e){}const fresh=JSON.parse(JSON.stringify(DEFAULT_CATS));saveCats(fresh);return fresh}
function saveCats(c){localStorage.setItem(CAT_STORAGE,JSON.stringify(c))}
function getChildren(){try{const x=JSON.parse(localStorage.getItem(CHILDREN_STORAGE)||"[]");return Array.isArray(x)?x:[]}catch(e){return []}}
function saveChildren(list){localStorage.setItem(CHILDREN_STORAGE,JSON.stringify(list))}
function childPaidThisMonth(childName,m=monthValue()){return entries.filter(x=>x.type==='income'&&x.month.slice(0,7)===m&&splitCategory(x.category).main==='اشتراك الأطفال'&&splitCategory(x.category).detail===childName).reduce((a,x)=>a+x.amount,0)}
function childStatus(child,paid){const total=Number(child.subscription||0);if(total<=0)return ['غير محدد','neutral'];if(paid<=0)return ['غير مدفوع','danger'];if(paid<total)return ['مدفوع جزئي','warn'];return ['مدفوع','good']}
function childLifeStatus(child){const today=new Date();today.setHours(0,0,0,0);if(child.endDate){const end=new Date(child.endDate+'T00:00:00');if(end<today)return ['منتهي','danger']}if(child.startDate){const start=new Date(child.startDate+'T00:00:00');if(start>today)return ['لم يبدأ','neutral']}return ['نشط','good']}
function childCardHtml(child,m){const paid=childPaidThisMonth(child.name,m), total=Number(child.subscription||0), remain=Math.max(total-paid,0), st=childStatus(child,paid), life=childLifeStatus(child);return `<div class="child-card" onclick="openChildDetails('${esc(child.id)}')"><div class="child-card-top"><div class="child-avatar">${esc((child.name||'ط').trim().slice(0,1))}</div><div class="child-main"><div class="child-name">${esc(child.name)}</div><div class="child-meta">${esc(child.guardian||'ولي الأمر غير مضاف')}${child.phone?' · '+esc(child.phone):''}</div></div><span class="child-status ${life[1]}">${life[0]}</span></div><div class="child-finance"><div><span>نوع الاشتراك</span><strong>${esc(child.subscriptionType||'شهري')}</strong></div><div><span>قيمة الاشتراك</span><strong>${money(total)}</strong></div><div><span>المقبوض هذا الشهر</span><strong class="paid">${money(paid)}</strong></div></div><div class="child-footer"><div class="child-dates">${child.startDate?`من ${esc(child.startDate)}`:''}${child.endDate?` إلى ${esc(child.endDate)}`:''}<br><span class="${st[1]}">${st[0]} · المتبقي ${money(remain)}</span></div><div class="child-actions" onclick="event.stopPropagation()"><button class="mini child-pay" onclick="openChildPayment('${esc(child.id)}')">+ تسجيل دفعة</button><button class="mini" onclick="openChildModal('${esc(child.id)}')">تعديل</button><button class="mini danger" onclick="deleteChild('${esc(child.id)}')"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button></div></div></div>`}
function childrenShell(){const m=localStorage.getItem('ibtisam_children_month')||monthValue();const list=getChildren();const q=String(window.childrenSearch||'').trim().toLowerCase();const filtered=list.filter(c=>!q||`${c.name} ${c.guardian||''} ${c.phone||''}`.toLowerCase().includes(q));const today=new Date();today.setHours(0,0,0,0);const active=list.filter(c=>childLifeStatus(c)[0]==='نشط').length;const expired=list.filter(c=>childLifeStatus(c)[0]==='منتهي').length;return `<div class="app"><div class="top"><div class="brand"><div class="logo"><img src="ibtisam-icon-full-512.png" alt="مركز ابتسام"></div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>إدارة الأطفال والاشتراكات</p></div></div><div class="actions"><button class="ghost" onclick="signOut()">تسجيل الخروج</button></div></div><div class="toolbar"><div><h2>الأطفال</h2><div style="color:var(--muted);font-size:12px;margin-top:4px">بيانات الأطفال والاشتراكات والمبالغ المقبوضة فعليًا</div></div><button class="primary" onclick="openChildModal()">+ إضافة طفل</button></div><div class="children-tools"><input class="search-box" value="${esc(window.childrenSearch||'')}" placeholder="ابحث باسم الطفل أو ولي الأمر..." oninput="window.childrenSearch=this.value;renderChildren()"><input class="month" id="childrenMonth" type="month" value="${esc(m)}" onchange="setChildrenMonth(this.value)"></div><div class="child-stats"><div class="child-stat"><span>عدد الأطفال المسجلين</span><strong>${list.length}</strong></div><div class="child-stat"><span>الأطفال النشطين</span><strong class="good-text">${active}</strong></div><div class="child-stat"><span>الاشتراكات المنتهية</span><strong class="warn-text">${expired}</strong></div></div><div class="children-list">${filtered.length?filtered.map(c=>childCardHtml(c,m)).join(''):`<div class="empty children-empty">${list.length?'ما لقيت نتيجة مطابقة':'ما أضفت أطفال للحين'}<br><button class="primary" style="margin-top:10px" onclick="openChildModal()">+ إضافة أول طفل</button></div>`}</div><nav class="bottom-nav"><div class="nav-inner"><button class="nav-item disabled" onclick="return false"><span class="nav-icon">⌂</span><span>الرئيسية</span></button><button class="nav-item" onclick="navFinancial(this)"><span class="nav-icon">▥</span><span>المالية</span></button><button class="nav-item active"><span class="nav-icon">♙</span><span>الأطفال</span></button><button class="nav-item" onclick="showSettings(this)"><span class="nav-icon">⚙︎</span><span>الإعدادات</span></button></div></nav></div>`}
function renderChildren(){const root=$('root');if(root)root.innerHTML=childrenShell();applyTheme()}
function showChildren(el){setNav(el);window.childrenSearch='';renderChildren()}
function setChildrenMonth(v){const month=v||monthValue();localStorage.setItem('ibtisam_children_month',month);renderChildren()}
function openChildModal(id=null){childrenEditId=id;const c=id?getChildren().find(x=>String(x.id)===String(id)):null;$('sheet').innerHTML=`<h3>${c?'تعديل بيانات الطفل':'إضافة طفل'}</h3><label class="field"><span>اسم الطفل</span><input id="cName" value="${esc(c?.name||'')}" placeholder="اسم الطفل"></label><label class="field"><span>ولي الأمر</span><input id="cGuardian" value="${esc(c?.guardian||'')}" placeholder="اسم ولي الأمر"></label><label class="field"><span>رقم التواصل</span><input id="cPhone" type="tel" inputmode="tel" value="${esc(c?.phone||'')}" placeholder="05xxxxxxxx"></label><label class="field"><span>نوع الاشتراك</span><input id="cSubscriptionType" value="${esc(c?.subscriptionType||'شهري')}" placeholder="شهري"></label><label class="field"><span>قيمة الاشتراك</span><input id="cSubscription" type="number" inputmode="decimal" value="${c?.subscription??''}" placeholder="1000"></label><div class="date-fields"><label class="field date-field"><span><i>◷</i> بداية الاشتراك</span><div class="date-input-wrap"><input id="cStart" type="date" value="${esc(c?.startDate||'')}" onclick="this.showPicker&&this.showPicker()" onfocus="this.showPicker&&this.showPicker()"></div></label><label class="field date-field"><span><i>◷</i> نهاية الاشتراك</span><div class="date-input-wrap"><input id="cEnd" type="date" value="${esc(c?.endDate||'')}" onclick="this.showPicker&&this.showPicker()" onfocus="this.showPicker&&this.showPicker()"></div></label></div><div class="hint">تسجيل الطفل لا يُسجل دخلًا. الدخل يُضاف فقط عند تسجيل مبلغ مقبوض فعليًا.</div><div id="cMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" id="saveChildBtn" class="primary" onclick="saveChild();return false;">${c?'حفظ التعديل':'حفظ وإضافة طفل آخر'}</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('cName')?.focus(),50)}
function saveChild(){
  const btn=$('saveChildBtn');
  if(btn && btn.dataset.saving==='1') return;
  const name=$('cName')?.value.trim()||'',
        guardian=$('cGuardian')?.value.trim()||'',
        phone=$('cPhone')?.value.trim()||'',
        subscriptionType=$('cSubscriptionType')?.value.trim()||'شهري',
        subscription=Number($('cSubscription')?.value||0),
        startDate=$('cStart')?.value||'',
        endDate=$('cEnd')?.value||'';
  if(!name){showMessage('cMsg','اكتب اسم الطفل.');$('cName')?.focus();return}
  if(subscription<0){showMessage('cMsg','قيمة الاشتراك غير صحيحة.');return}
  if(btn) { btn.dataset.saving='1'; btn.disabled=true; }
  try{
    let list=getChildren();
    if(childrenEditId){
      const i=list.findIndex(x=>String(x.id)===String(childrenEditId));
      if(i>=0) list[i]={...list[i],name,guardian,phone,subscriptionType,subscription,startDate,endDate};
      saveChildren(list);
      closeModal();
      renderChildren();
      return;
    }
    list.push({id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name,guardian,phone,subscriptionType,subscription,startDate,endDate});
    saveChildren(list);
    $('cName').value='';
    $('cGuardian').value='';
    $('cPhone').value='';
    $('cSubscriptionType').value='شهري';
    $('cSubscription').value='';
    $('cStart').value='';
    $('cEnd').value='';
    showMessage('cMsg','انضاف الطفل بنجاح ✓');
    if(btn){
      btn.disabled=false;
      btn.dataset.saving='0';
      btn.textContent='حفظ وإضافة طفل آخر';
    }
    setTimeout(()=>$('cName')?.focus(),50);
  }catch(e){
    showMessage('cMsg','تعذر حفظ الطفل: '+(e?.message||'خطأ غير معروف'));
    if(btn){btn.disabled=false;btn.dataset.saving='0';}
  }
}
function openChildDetails(id){const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;const m=localStorage.getItem('ibtisam_children_month')||monthValue(),paid=childPaidThisMonth(c.name,m),total=Number(c.subscription||0),remain=Math.max(total-paid,0),life=childLifeStatus(c),st=childStatus(c,paid);$('sheet').innerHTML=`<h3>${esc(c.name)}</h3><div class="child-detail-grid"><div><span>ولي الأمر</span><strong>${esc(c.guardian||'غير مضاف')}</strong></div><div><span>رقم التواصل</span><strong>${esc(c.phone||'غير مضاف')}</strong></div><div><span>نوع الاشتراك</span><strong>${esc(c.subscriptionType||'شهري')}</strong></div><div><span>قيمة الاشتراك</span><strong>${money(total)}</strong></div><div><span>المقبوض هذا الشهر</span><strong class="good-text">${money(paid)}</strong></div><div><span>المتبقي</span><strong class="warn-text">${money(remain)}</strong></div><div><span>حالة الاشتراك</span><strong>${life[0]}</strong></div><div><span>حالة الدفع</span><strong>${st[0]}</strong></div></div><div class="hint">من ${esc(c.startDate||'غير محدد')} إلى ${esc(c.endDate||'غير محدد')}</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إغلاق</button><button class="primary" onclick="openChildPayment('${esc(c.id)}')">+ تسجيل دفعة</button></div>`;$('modal').classList.add('show')}
function deleteChild(id){const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;if(!confirm(`حذف الطفل ${c.name}؟\nبياناته ستُحذف من قائمة الأطفال، أما العمليات المالية السابقة فتبقى.`))return;saveChildren(getChildren().filter(x=>String(x.id)!==String(id)));renderChildren()}
function openChildPayment(id){const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;const paid=childPaidThisMonth(c.name,localStorage.getItem('ibtisam_children_month')||monthValue());const remain=Math.max(Number(c.subscription||0)-paid,0);if(remain<=0){alert('الاشتراك مدفوع بالكامل لهذا الشهر.');return}childrenEditId=null;$('sheet').innerHTML=`<h3>تسجيل دفعة</h3><div class="hint" style="margin-bottom:10px"><strong>${esc(c.name)}</strong><br>قيمة الاشتراك: ${money(c.subscription)} · المقبوض: ${money(paid)} · المتبقي: ${money(remain)}</div><label class="field"><span>المبلغ المقبوض</span><input id="pAmount" type="number" inputmode="decimal" value="${remain}" max="${remain}" placeholder="0"></label><label class="field"><span>تاريخ القبض</span><input id="pDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><div id="pMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveChildPayment('${esc(c.id)}')">حفظ الدفعة</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('pAmount')?.focus(),50)}
async function saveChildPayment(id){if(busy)return;const c=getChildren().find(x=>String(x.id)===String(id));if(!c)return;const amount=Number($('pAmount').value),date=$('pDate').value||new Date().toISOString().slice(0,10);const m=date.slice(0,7);const paid=childPaidThisMonth(c.name,m),remain=Math.max(Number(c.subscription||0)-paid,0);if(!amount||amount<=0){showMessage('pMsg','اكتب مبلغ المقبوض.');return}if(amount>remain){showMessage('pMsg',`المتبقي فقط ${money(remain)}.`);return}busy=true;showMessage('pMsg','جاري تسجيل الدفعة...');try{const {data,error}=await supabaseClient.from('financial_entries').insert({month:m+'-01',type:'income',category:makeCategory('اشتراك الأطفال',c.name),amount}).select('id,month,type,category,amount').single();if(error)throw error;entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)});closeModal();localStorage.setItem('ibtisam_children_month',m);renderChildren()}catch(e){showMessage('pMsg','تعذر تسجيل الدفعة: '+e.message)}finally{busy=false}}

function keyScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>ربط قاعدة البيانات</p></div></div><h2>مفتاح Supabase</h2><p>أدخل Publishable key الخاص بمشروعك.</p><label class="field"><span>Publishable key</span><input id="sbKey" type="password" placeholder="sb_publishable_..."></label><div class="hint">المفتاح يحفظ على هذا الجهاز فقط.</div><div id="keyMsg" class="msg">${esc(message)}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px" onclick="saveKey()">متابعة</button></div></div>`}
function authScreen(message=""){return `<div class="auth"><div class="authbox"><div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div><h2>تسجيل الدخول</h2><p>سجّل الدخول بحساب Supabase المرتبط بالموقع.</p><label class="field"><span>البريد الإلكتروني</span><input id="email" type="email" autocomplete="email"></label><label class="field"><span>كلمة المرور</span><input id="password" type="password" autocomplete="current-password"></label><div id="authMsg" class="msg">${esc(message)}</div><div style="display:flex;gap:8px"><button class="primary" style="flex:1;padding:13px;border-radius:13px" onclick="signIn()">دخول</button><button class="ghost" style="flex:1;padding:13px;border-radius:13px" onclick="signUp()">إنشاء حساب</button></div><button class="ghost" style="width:100%;margin-top:9px;padding:12px;border-radius:13px" onclick="changeKey()">تغيير المفتاح</button></div></div>`}
async function boot(){const key=localStorage.getItem(KEY_STORAGE);if(!key){$("root").innerHTML=keyScreen();return}try{supabaseClient=window.supabase.createClient(SUPABASE_URL,key);const {data:{session}}=await supabaseClient.auth.getSession();if(session){await loadEntries();showApp()}else $("root").innerHTML=authScreen()}catch(e){$("root").innerHTML=keyScreen("خطأ تهيئة Supabase: "+(e?.message||String(e))) }}
function saveKey(){const key=$("sbKey").value.trim();if(!key){showMessage("keyMsg","أدخل المفتاح أولًا.");return}localStorage.setItem(KEY_STORAGE,key);boot()}
function changeKey(){localStorage.removeItem(KEY_STORAGE);supabaseClient=null;$("root").innerHTML=keyScreen()}
async function signIn(){const email=$("email").value.trim(),password=$("password").value,key=localStorage.getItem(KEY_STORAGE)||"";if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}showMessage("authMsg","جاري الاتصال...");try{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);let r;try{r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":key},body:JSON.stringify({email,password}),signal:c.signal})}finally{clearTimeout(t)}const raw=await r.text();let b={};try{b=raw?JSON.parse(raw):{}}catch(_){b={raw}}if(!r.ok){showMessage("authMsg",`خطأ الدخول: ${b.error_description||b.msg||b.message||b.raw||"غير معروف"} (HTTP ${r.status})`);return}const s=await supabaseClient.auth.setSession({access_token:b.access_token,refresh_token:b.refresh_token});if(s.error){showMessage("authMsg",s.error.message);return}await loadEntries();showApp()}catch(e){showMessage("authMsg",`تعذر الاتصال بـ Supabase: ${e?.name==="AbortError"?"انتهت مهلة الاتصال":e.message||e}`)}}
async function signUp(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return}if(password.length<6){showMessage("authMsg","كلمة المرور 6 أحرف على الأقل.");return}const {data,error}=await supabaseClient.auth.signUp({email,password});if(error){showMessage("authMsg",error.message);return}if(data.session){await loadEntries();showApp()}else showMessage("authMsg","تم إنشاء الحساب. إذا طُلب تأكيد البريد، أكده ثم سجّل الدخول.")}
async function loadEntries(){const {data,error}=await supabaseClient.from("financial_entries").select("id,month,type,category,amount,created_at").order("created_at",{ascending:true});if(error)throw new Error(error.message);entries=(data||[]).map(x=>({id:String(x.id),month:String(x.month).slice(0,10),type:x.type,category:x.category,amount:Number(x.amount)}));}
function splitCategory(v){const parts=String(v||'').split('::');return {main:parts[0]||'',detail:parts.slice(1).join('::')||''}}
function makeCategory(main,detail){return detail?.trim()?main+'::'+detail.trim():main}
function categoryHash(v){return 'cat_'+encodeURIComponent(String(v)).replace(/%/g,'_').replace(/[^a-zA-Z0-9_]/g,'').slice(0,80)}
function toggleCategory(id){const el=$(id);if(el)el.classList.toggle('open')}
function categoryGroups(type,list,search=''){const base=getCats()[type]||[];const q=String(search||'').trim().toLowerCase();const discovered=list.map(x=>splitCategory(x.category).main).filter(Boolean);let cats=[...base,...discovered.filter(c=>!base.includes(c))];if(q)cats=cats.filter(cat=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);return cat.toLowerCase().includes(q)||arr.length>0});return cats.map((cat,idx)=>{const arr=list.filter(x=>splitCategory(x.category).main===cat);const sum=arr.reduce((a,x)=>a+x.amount,0);const id=categoryHash(type+'|'+cat+'|'+idx);const safeType=esc(type);const encodedCat=encodeURIComponent(String(cat));const matched=q&&arr.length>0;const open=matched||(!q&&false);return `<div class="main-category ${type}${open?' open':''}" id="${id}" data-category-type="${safeType}" data-category-key="${encodedCat}"><div class="category-toggle" role="button" tabindex="0" onclick="toggleCategory('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCategory('${id}')}"><div class="main-left"><div class="main-icon">${type==='income'?'↗':'↘'}</div><div><div class="main-name">${esc(cat)}</div><div class="main-total">${money(sum)}</div></div></div><div class="category-actions"><button type="button" class="mini" data-action="rename-main" data-type="${safeType}" data-name="${encodedCat}">تعديل</button><button type="button" class="mini danger" data-action="delete-main" data-type="${safeType}" data-name="${encodedCat}"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button><span class="chev" aria-hidden="true">⌄</span></div></div><div class="sub-list">${arr.length?arr.map(x=>subEntryHtml(x)).join(''):`<div class="empty">${q?'لا توجد نتائج مطابقة':'لا توجد تفاصيل بعد'}</div>`}<button type="button" class="mini" style="justify-self:start" onclick="event.stopPropagation();openEntryModal('${safeType}',null,decodeURIComponent('${encodedCat}'))">+ إضافة عنوان فرعي</button></div></div>`}).join('')}
function mainCategoryAction(event,button){event.preventDefault();event.stopPropagation();const type=button.dataset.type;const name=decodeURIComponent(button.dataset.name||'');if(button.dataset.action==='rename-main')renameMainCategory(type,name);else if(button.dataset.action==='delete-main')removeMainCategory(type,name)}
document.addEventListener('click',function(event){
 const b=event.target.closest('[data-action="rename-main"],[data-action="delete-main"]');
 if(b){mainCategoryAction(event,b);return}
 const m=event.target.closest('[data-modal-action]');
 if(m){
  event.preventDefault();event.stopPropagation();
  const action=m.dataset.modalAction;
  const type=m.dataset.type||'';
  const name=decodeURIComponent(m.dataset.name||'');
  if(action==='apply-rename-main') applyRenameMainCategory(type,name);
  if(action==='apply-delete-main') applyRemoveMainCategory(type,name);
 }
});
function subEntryHtml(x){const p=splitCategory(x.category);const name=p.detail||'بدون عنوان فرعي';return `<div class="sub-row"><div><div class="sub-name">${esc(name)}</div><div class="sub-main">العنوان الفرعي · ${esc(p.month||x.month)}</div></div><div style="display:flex;align-items:center;gap:7px"><div class="sub-amount ${x.type}">${money(x.amount)}</div><button class="mini" onclick="event.stopPropagation();editEntry('${x.id}')">تعديل</button><button class="mini danger" onclick="event.stopPropagation();deleteEntry('${x.id}')"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button></div></div>`}

function applyMonthLockUI(locked){const badge=$('lockBadge'),btnText=$('lockBtnText'),btnIcon=$('lockBtnIcon'),icon=$('lockIcon'),iconWrap=$('lockIconWrap');if(badge){badge.textContent=locked?'مقفل':'مفتوح';badge.classList.toggle('locked',locked)}if(btnText)btnText.textContent=locked?'فتح الشهر':'قفل الشهر';if(btnIcon)btnIcon.textContent=locked?'♙':'⌑';if(icon)icon.textContent=locked?'♙':'⌑';if(iconWrap){iconWrap.style.background=locked?'#fff0f1':'#eafaf3';iconWrap.style.borderColor=locked?'#f3c7d0':'#ccefe0';iconWrap.style.color=locked?'var(--red)':'var(--green)'}document.querySelectorAll('.add').forEach(b=>b.disabled=locked);document.querySelectorAll('.category-actions .mini,.sub-row .mini').forEach(b=>b.disabled=locked);}
function compareMonth(list,prevList){const now=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)-list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);const prev=prevList.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)-prevList.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);if(prev===0&&now===0)return ['—','لا يوجد تغير'];if(prev===0)return [now>0?'↑ '+money(now):'↓ '+money(Math.abs(now)),'لا توجد قيمة سابقة للمقارنة'];const pct=((now-prev)/Math.abs(prev))*100;return [(pct>=0?'↑ ':'↓ ')+Math.abs(pct).toFixed(1)+'%',pct>=0?'تحسن في المتبقي':'انخفاض في المتبقي']}

function searchResultsHtml(allMonth,search){const q=String(search||'').trim().toLowerCase();if(!q)return '';const matches=[];for(const x of allMonth){const p=splitCategory(x.category);const hay=`${p.main} ${p.detail} ${x.amount}`.toLowerCase();if(hay.includes(q))matches.push({x,p})}const seen=new Set();const rows=[];for(const {x,p} of matches){const key=`${x.type}|${p.main}|${p.detail}|${x.amount}`;if(seen.has(key))continue;seen.add(key);rows.push(`<button type="button" class="search-result" onclick="goToSearchResult('${esc(x.type)}','${encodeURIComponent(p.main)}','${encodeURIComponent(String(x.id))}')"><div><div class="search-result-main">${esc(p.detail||p.main)}</div><div class="search-result-detail">${esc(p.detail?p.main:'العنوان الرئيسي')} · ${x.type==='income'?'الدخل':'المصروفات'}</div></div><div class="search-result-amount">${money(x.amount)}</div></button>`)}return rows.length?rows.slice(0,12).join(''):`<div class="search-empty">لا توجد نتائج مطابقة</div>`}
function goToSearchResult(type,encodedMain,id){const main=decodeURIComponent(encodedMain||'');const el=document.querySelector(`.main-category[data-category-type="${type}"][data-category-key="${encodeURIComponent(main)}"]`);if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});const entry=document.querySelector(`.sub-row button[onclick*="editEntry('${id}')"]`)?.closest('.sub-row');if(entry){entry.scrollIntoView({behavior:'smooth',block:'center'});entry.animate([{transform:'scale(1)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:450})}}}

function render(){const m=monthValue();const search=($('financeSearch')?.value||'').trim().toLowerCase();const clearSearch=$('clearSearch');if(clearSearch)clearSearch.style.display=search?'block':'none';let list=entries.filter(x=>x.month.slice(0,7)===m);const allMonth=list;renderSearchResults(allMonth,search);const prevKey=previousMonthKey(m);const prevList=entries.filter(x=>x.month.slice(0,7)===prevKey);const incAll=list.filter(x=>x.type==='income'),expAll=list.filter(x=>x.type==='expense');const ti=incAll.reduce((a,x)=>a+x.amount,0),te=expAll.reduce((a,x)=>a+x.amount,0),rem=ti-te;const match=x=>{const p=splitCategory(x.category);const hay=`${p.main} ${p.detail} ${x.amount}`.toLowerCase();return !search||hay.includes(search)};if(financeFilter!=='all')list=list.filter(x=>x.type===financeFilter);list=list.filter(match);$('totalIncome').textContent=money(ti);$('totalExpense').textContent=money(te);$('remaining').textContent=money(rem);$('remaining').style.color=rem<0?'var(--red)':'var(--blue)';$('incomeRows').innerHTML=categoryGroups('income',list.filter(x=>x.type==='income'),search);$('expenseRows').innerHTML=categoryGroups('expense',list.filter(x=>x.type==='expense'),search);$('incomeTotalSmall').textContent=money(incAll.reduce((a,x)=>a+x.amount,0));$('expenseTotalSmall').textContent=money(expAll.reduce((a,x)=>a+x.amount,0));const rate=ti?te/ti*100:0;$('expenseRate').textContent=rate.toFixed(1)+'%';const cmp=compareMonth(allMonth,prevList);$('monthCompare').textContent=cmp[0];$('monthCompare').className='insight-value '+(cmp[0].startsWith('↑')?'positive':cmp[0].startsWith('↓')?'negative':'');$('monthCompareNote').textContent=cmp[1];$('expenseChart').innerHTML=expenseChart(allMonth);applyMonthLockUI(isMonthLocked(m));}

function entryHtml(x){return `<div class="entry ${x.type}"><div class="entry-main"><div class="entry-name">${esc(x.category)}</div><div class="entry-meta">${x.month}</div></div><div class="entry-actions"><button class="mini" onclick="editEntry('${x.id}')">تعديل</button><button class="mini" onclick="deleteEntry('${x.id}')">حذف</button></div><div class="entry-amount">${money(x.amount)}</div></div>`}
function openEntryModal(type,id=null,preCat=''){if(isMonthLocked()&&!id){return}if(isMonthLocked()&&id){showMessage('authMsg','');return}editId=id;const x=id?entries.find(e=>String(e.id)===String(id)):null;const p=x?splitCategory(x.category):{main:preCat,detail:''};const cats=getCats()[type]||[];const options=cats.map(c=>`<option value="${esc(c)}"></option>`).join('');$("sheet").innerHTML=`<h3>${id?'تعديل الحركة':type==='income'?'إضافة دخل':'إضافة مصروف'}</h3><label class="field"><span>العنوان الرئيسي</span><input id="mCategory" list="categoryOptions" type="text" value="${esc(p.main)}" placeholder="اكتب أي عنوان تريده"><datalist id="categoryOptions">${options}</datalist></label><label class="field"><span>العنوان الفرعي</span><input id="mDetail" type="text" value="${esc(p.detail)}" placeholder="اكتب العنوان الفرعي"></label><label class="field"><span>المبلغ</span><input id="mAmount" type="number" inputmode="decimal" value="${x?.amount||''}" placeholder="0"></label><div id="mMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveEntry('${type}')">حفظ</button></div>`;$("modal").classList.add('show')}
function editEntry(id){if(isMonthLocked())return;const x=entries.find(e=>String(e.id)===String(id));if(x)openEntryModal(x.type,id)}
function closeModal(){$("modal").classList.remove('show');editId=null}
async function saveEntry(type){if(busy)return;const main=$("mCategory").value.trim(),detail=$("mDetail").value.trim(),amount=Number($("mAmount").value);if(!main||!amount){showMessage('mMsg','اكتب العنوان الرئيسي والمبلغ.');return}const cats=getCats();if(!cats[type].includes(main)){cats[type].push(main);saveCats(cats)}busy=true;showMessage('mMsg','جاري الحفظ...');const category=makeCategory(main,detail);try{if(editId){const x=entries.find(e=>String(e.id)===String(editId));const {data,error}=await supabaseClient.from('financial_entries').update({month:monthValue()+'-01',type,category,amount}).eq('id',Number(editId)).select('id,month,type,category,amount').single();if(error)throw error;Object.assign(x,{id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)});closeModal();render()}else{const {data,error}=await supabaseClient.from('financial_entries').insert({month:monthValue()+'-01',type,category,amount}).select('id,month,type,category,amount').single();if(error)throw error;entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)});render();editId=null;$("mDetail").value='';$("mAmount").value='';$("mMsg").innerHTML='<span style="color:var(--green);font-weight:800">انضافت بنجاح ✓</span>';$("mDetail").focus();$("sheet").querySelector('.modal-actions').innerHTML='<button class="ghost" onclick="closeModal()">إغلاق</button><button class="primary" onclick="saveEntry(\''+type+'\')">+ إضافة أخرى</button>';}}catch(e){showMessage('mMsg','تعذر الحفظ: '+e.message)}finally{busy=false}}
async function deleteEntry(id){if(isMonthLocked())return;if(!confirm('حذف هذه الحركة؟'))return;const {error}=await supabaseClient.from('financial_entries').delete().eq('id',Number(id));if(error){alert('تعذر الحذف: '+error.message);return}entries=entries.filter(x=>String(x.id)!==String(id));render()}
function renameMainCategory(type,name){
 const old=String(name);
 const cats=getCats();
 const current=old;
 $("sheet").innerHTML=`<h3>تعديل العنوان الرئيسي</h3><div class="field"><span>العنوان الرئيسي</span><input id="mainRenameInput" type="text" value="${esc(current)}" autocomplete="off"></div><div id="mainActionMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" class="primary" data-modal-action="apply-rename-main" data-type="${esc(type)}" data-name="${encodeURIComponent(old)}">حفظ التعديل</button></div>`;
 $("modal").classList.add('show');
 setTimeout(()=>{$("mainRenameInput")?.focus();},50);
}
async function applyRenameMainCategory(type,old){
 const input=$("mainRenameInput");
 const next=input?.value.trim()||'';
 if(!next){showMessage('mainActionMsg','اكتب اسم العنوان الرئيسي.');return}
 if(next===old){closeModal();return}
 const cats=getCats();
 if((cats[type]||[]).includes(next)){showMessage('mainActionMsg','هذا العنوان موجود مسبقًا.');return}
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 try{
  for(const x of affected){const category=makeCategory(next,splitCategory(x.category).detail);const {error}=await supabaseClient.from('financial_entries').update({category}).eq('id',Number(x.id));if(error)throw error;x.category=category}
  cats[type]=(cats[type]||[]).map(c=>c===old?next:c);
  if(!cats[type].includes(next))cats[type].push(next);
  saveCats(cats);closeModal();render();
 }catch(e){showMessage('mainActionMsg','تعذر التعديل: '+(e.message||e));}
}
function removeMainCategory(type,name){
 const old=String(name);
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 const count=affected.length;
 $("sheet").innerHTML=`<h3>حذف العنوان الرئيسي</h3><div class="confirm-box"><div class="confirm-title">${esc(old)}</div><div class="confirm-text">${count?`سيتم حذف ${count} عملية مرتبطة بهذا العنوان من قاعدة البيانات.`:'لا توجد عمليات مرتبطة بهذا العنوان.'}</div></div><div id="mainActionMsg" class="msg"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button type="button" class="danger-solid" data-modal-action="apply-delete-main" data-type="${esc(type)}" data-name="${encodeURIComponent(old)}">حذف العنوان</button></div>`;
 $("modal").classList.add('show');
}
async function applyRemoveMainCategory(type,old){
 const cats=getCats();
 const affected=entries.filter(x=>x.type===type&&splitCategory(x.category).main===old);
 try{
  if(affected.length){const ids=affected.map(x=>Number(x.id));const {error}=await supabaseClient.from('financial_entries').delete().in('id',ids);if(error)throw error;entries=entries.filter(x=>!ids.includes(Number(x.id)))}
  cats[type]=(cats[type]||[]).filter(c=>c!==old);saveCats(cats);closeModal();render();
 }catch(e){showMessage('mainActionMsg','تعذر الحذف: '+(e.message||e));}
}
function manageCategories(type){const cats=getCats()[type]||[];$('sheet').innerHTML=`<h3>عناوين ${type==='income'?'الدخل':'المصروفات'}</h3><div class="menu-list">${cats.map(c=>`<div class="menu-item"><span class="menu-name">${esc(c)}</span><span><button class="mini" onclick="renameMainCategory('${type}',${JSON.stringify(c)})">تعديل</button> <button class="mini danger" onclick="removeMainCategory('${type}',${JSON.stringify(c)})"><span class="delete-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>حذف</button></span></div>`).join('')||'<div class="empty">لا توجد عناوين رئيسية</div>'}</div><button class="primary" style="width:100%;padding:13px;border-radius:13px;margin-top:12px" onclick="addCategory('${type}')">+ إضافة عنوان رئيسي</button><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:8px" onclick="closeModal()">إغلاق</button>`;$('modal').classList.add('show')}

function openMonthlyReport(){const m=monthValue();const list=entries.filter(x=>x.month.slice(0,7)===m);const inc=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),rem=inc-exp;const prev=previousMonthKey(m);const prevList=entries.filter(x=>x.month.slice(0,7)===prev);const cmp=compareMonth(list,prevList);const byType=t=>{const map={};list.filter(x=>x.type===t).forEach(x=>{const p=splitCategory(x.category);map[p.main]=(map[p.main]||0)+x.amount});return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="menu-item"><span class="menu-name">${esc(k)}</span><strong>${money(v)}</strong></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'};$('sheet').innerHTML=`<h3>تقرير ${m}</h3><div class="insights" style="margin-top:0"><div class="insight"><div class="insight-title">الدخل</div><div class="insight-value positive">${money(inc)}</div></div><div class="insight"><div class="insight-title">المصروفات</div><div class="insight-value negative">${money(exp)}</div></div><div class="insight"><div class="insight-title">المتبقي</div><div class="insight-value ${rem<0?'negative':'positive'}">${money(rem)}</div></div><div class="insight"><div class="insight-title">مقارنة السابق</div><div class="insight-value">${cmp[0]}</div></div></div><h4>تفاصيل الدخل</h4><div class="menu-list">${byType('income')}</div><h4>تفاصيل المصروفات</h4><div class="menu-list">${byType('expense')}</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">إغلاق</button><button class="ghost" onclick="printMonthlyReport('${m}')">طباعة</button><button class="primary" onclick="saveMonthlyPDF('${m}')">حفظ PDF</button></div>`;$('modal').classList.add('show')}
function itemsLabel(n){if(n===0)return '0 عمليات'; if(n===1)return '1 عملية'; if(n===2)return 'عمليتان'; return n+' عملية'}
function buildMonthlyReport(m){
 const list=entries.filter(x=>x.month.slice(0,7)===m),inc=list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),rem=inc-exp,prev=previousMonthKey(m),prevList=entries.filter(x=>x.month.slice(0,7)===prev),cmp=compareMonth(list,prevList),rate=inc?exp/inc*100:0;
 const d=new Date(m+'-01T00:00:00');
 const monthLabel=d.toLocaleDateString('ar-SA-u-ca-gregory',{month:'long',year:'numeric'});
 const logoSrc=document.querySelector('.logo img')?.getAttribute('src')||'ibtisam-icon-full-512.png';
 const ordered=[...list].sort((a,b)=>String(a.created_at||a.month).localeCompare(String(b.created_at||b.month)));
 const makeMini=(type)=>{
   const items=ordered.filter(x=>x.type===type);
   if(!items.length)return `<div class="ledger-empty">لا توجد عمليات</div>`;
   const mid=Math.ceil(items.length/2), cols=[items.slice(0,mid),items.slice(mid)];
   return `<div class="ledger-mini-grid">${cols.map((col,ci)=>`<table class="ledger-mini"><tbody>${col.map((x,i)=>{const p=splitCategory(x.category);const n=ci*mid+i+1;return `<tr><td>${n}</td><td><span class="ledger-mini-name">${esc(p.detail||p.main)}</span><span class="ledger-mini-sub">${esc(p.detail?p.main:x.month)}</span></td><td>${money(x.amount)}</td></tr>`}).join('')}</tbody></table>`).join('')}</div>`;
 };
 const incomeRows=makeMini('income'), expenseRows=makeMini('expense');
 $('printReport').innerHTML=`<div class="print-report">
  <header class="print-head">
   <div class="print-brand"><img class="print-logo" src="${esc(logoSrc)}"><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div>
   <div class="print-title"><div class="print-official">كشف حساب شهري</div><h2>التقرير المالي</h2><p class="print-greg">${esc(monthLabel)}</p></div>
  </header>
  <div class="print-summary">
   <div class="print-card print-income"><div class="k">إجمالي الدخل</div><div class="v">${money(inc)}</div></div>
   <div class="print-card print-expense"><div class="k">إجمالي المصروفات</div><div class="v">${money(exp)}</div></div>
   <div class="print-card print-remain"><div class="k">${rem<0?'العجز':'المتبقي'}</div><div class="v">${money(rem)}</div></div>
  </div>
  <div class="print-meta">
   <div class="print-meta-box"><strong>نسبة المصروفات من الدخل</strong><span>${rate.toFixed(1)}%</span></div>
   <div class="print-meta-box"><strong>عدد العمليات</strong><span>${list.length} عملية</span></div>
   <div class="print-meta-box"><strong>مقارنة بالشهر السابق</strong><span>${esc(cmp[0])} — ${esc(cmp[1])}</span></div>
  </div>
  <div class="ledger-title"><span>كشف تفاصيل الشهر</span><small>الدخل والمصروفات في صفحة واحدة</small></div>
  <div class="ledger-columns">
   <section class="ledger-section income"><div class="ledger-section-head"><strong>الدخل</strong><span>${itemsLabel(list.filter(x=>x.type==='income').length)}</span></div>${incomeRows}<div class="ledger-total"><span>إجمالي الدخل</span><strong>${money(inc)}</strong></div></section>
   <section class="ledger-section expense"><div class="ledger-section-head"><strong>المصروفات</strong><span>${itemsLabel(list.filter(x=>x.type==='expense').length)}</span></div>${expenseRows}<div class="ledger-total"><span>إجمالي المصروفات</span><strong>${money(exp)}</strong></div></section>
  </div>
  <footer class="print-footer"><span>تقرير ${esc(monthLabel)}</span><span>مركز ابتسام لرياض الأطفال</span><span>الإدارة المالية</span></footer>
 </div>`;
 $('printReport').setAttribute('aria-hidden','false');
 return {monthLabel};
}
function printMonthlyReport(m){
 const {monthLabel}=buildMonthlyReport(m);
 const oldTitle=document.title;
 document.title=`تقرير مالي - ${monthLabel} - مركز ابتسام`;
 setTimeout(()=>{window.print();setTimeout(()=>{$('printReport').setAttribute('aria-hidden','true');document.title=oldTitle},700)},100);
}
async function saveMonthlyPDF(m){
 const {monthLabel}=buildMonthlyReport(m);
 const report=$('printReport');
 try{
  report.style.display='block';
  if(!window.html2canvas || !window.jspdf){
   alert('تعذر تجهيز ملف PDF. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.');
   return;
  }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const canvas=await html2canvas(report,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:Math.max(report.scrollWidth,794)});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  const pageW=210,pageH=297,margin=7;
  const imgW=pageW-margin*2;
  const imgH=canvas.height*imgW/canvas.width;
  const pageContentH=pageH-margin*2;
  if(imgH<=pageContentH){
   pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,imgW,imgH,undefined,'FAST');
  }else{
   const pxPerMm=canvas.width/imgW;
   const pagePx=Math.floor(pageContentH*pxPerMm);
   let offset=0;
   let page=0;
   while(offset<canvas.height){
    const sliceH=Math.min(pagePx,canvas.height-offset);
    const slice=document.createElement('canvas');
    slice.width=canvas.width;slice.height=sliceH;
    const ctx=slice.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas,0,offset,canvas.width,sliceH,0,0,canvas.width,sliceH);
    if(page>0)pdf.addPage();
    pdf.addImage(slice.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,imgW,sliceH/pxPerMm,undefined,'FAST');
    offset+=sliceH;page++;
   }
  }
  pdf.save(`تقرير مالي - ${monthLabel} - مركز ابتسام.pdf`);
 }catch(e){
  alert('تعذر حفظ ملف PDF: '+(e.message||'خطأ غير معروف'));
 }finally{
  report.style.display='';
  report.setAttribute('aria-hidden','true');
 }
}
function openSettings(){const c=getCats();$("sheet").innerHTML=`<h3>الإعدادات</h3><div class="menu-list"><button class="menu-item" onclick="manageCategories('income')"><span class="menu-name">عناوين الدخل</span><span>›</span></button><button class="menu-item" onclick="manageCategories('expense')"><span class="menu-name">عناوين المصروفات</span><span>›</span></button><button class="menu-item" onclick="signOut()"><span class="menu-name danger">تسجيل الخروج</span><span>›</span></button></div><button class="ghost" style="width:100%;padding:12px;border-radius:13px;margin-top:12px" onclick="closeModal()">إغلاق</button>`;$("modal").classList.add('show')}
async function signOut(){closeModal();await supabaseClient.auth.signOut();$("root").innerHTML=authScreen()}
applyTheme();
boot();
</script>
