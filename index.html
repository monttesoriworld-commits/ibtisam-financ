<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مركز ابتسام | الملخص المالي</title>
<link rel="icon" type="image/png" href="ibtisam-icon-full-512.png">
<link rel="apple-touch-icon" href="ibtisam-icon-full-512.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--panel2:#101f33;--line:#1d3047;--text:#f4f7fb;--muted:#91a1b5;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--shadow:0 18px 45px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06101d,#0a1626 55%,#07111f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;padding:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#1d4ed8);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 25px #2563eb33}.brand h1{font-size:18px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:9px}.ghost,.primary{padding:11px 15px;border-radius:12px}.ghost{background:#102137;color:#cbd5e1;border:1px solid var(--line)}.primary{background:var(--blue);color:white;box-shadow:0 10px 25px #2563eb33}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0 16px}.toolbar h2{font-size:25px;margin:0}.month{background:var(--panel);border:1px solid var(--line);color:white;border-radius:12px;padding:10px 13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(160deg,#0e1c2e,#0b1727);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.label{color:var(--muted);font-size:13px}.amount{font-size:29px;font-weight:800;margin-top:9px}.income .amount{color:#5ee78a}.expense .amount{color:#ff7777}.remain .amount{color:#6ca8ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.section{background:linear-gradient(160deg,#0e1c2e,#0b1727);border:1px solid var(--line);border-radius:18px;padding:19px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section h3{margin:0;font-size:17px}.add{background:#142943;color:#7eb0ff;border:1px solid #21456e;border-radius:10px;padding:8px 12px}.rows{display:flex;flex-direction:column;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;background:#0a1626;border:1px solid #172a40;padding:12px 13px;border-radius:12px}.cat{font-size:14px}.val{font-weight:700}.income .val{color:#7bf0a0}.expense .val{color:#ff8585}.empty{color:var(--muted);text-align:center;padding:22px 5px}.bottom{margin-top:14px}.bar-wrap{height:12px;background:#132338;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:99px}.footnote{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.authbox{width:min(440px,100%);background:#0d1a2b;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.authbox h2{margin:0 0 7px}.authbox p{color:var(--muted);font-size:13px}.field{display:block;margin:12px 0}.field span{display:block;color:#b8c5d6;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#091525;color:white;outline:none}.msg{color:#ff9b9b;font-size:12px;min-height:18px;margin:8px 0}.setup{background:#091525;border:1px dashed #315070;border-radius:14px;padding:12px;margin:15px 0;color:#a9bad0;font-size:12px;line-height:1.6}.hint{background:#0a1626;border:1px solid #172a40;border-radius:12px;padding:11px;color:#a9bad0;font-size:12px;line-height:1.7}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:end;justify-content:center;padding:14px;z-index:10}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#0d1a2b;border:1px solid var(--line);border-radius:20px;padding:20px}.sheet h3{margin-top:0}.sheet input,.sheet select{width:100%;background:#091525;color:white;border:1px solid var(--line);border-radius:12px;padding:13px;margin:7px 0 12px}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}
@media(max-width:760px){.app{padding:15px}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;gap:10px;flex-direction:column}.toolbar h2{font-size:22px}.actions .ghost{display:none}.top{margin-bottom:17px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal">
 <div class="sheet">
  <h3 id="modalTitle">إضافة حركة مالية</h3>
  <label class="field"><span>النوع</span><select id="mType"><option value="income">دخل</option><option value="expense">مصروف</option></select></label>
  <label class="field"><span>التصنيف</span><input id="mCategory" placeholder="مثال: اشتراكات الأطفال"></label>
  <label class="field"><span>المبلغ</span><input id="mAmount" type="number" inputmode="decimal" placeholder="0"></label>
  <div class="modal-actions"><button class="ghost" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveEntry()">حفظ</button></div>
  <div id="mMsg" class="msg"></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL="https://dwifylcibtawffniyzmu.supabase.co";
const KEY_STORAGE="ibtisam_supabase_key";
const LOCAL_STORAGE="ibtisam_finance_entries";
let supabaseClient=null, entries=[], editId=null, busy=false;

function money(n){return Number(n||0).toLocaleString("ar-SA",{maximumFractionDigits:2})+" ر.س";}
function monthValue(){return $("month").value;}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function showMessage(id,msg){$(id).textContent=msg||"";}

function keyScreen(message=""){
 return `<div class="auth"><div class="authbox">
  <div class="brand"><div class="logo">إ</div><div><h1 style="font-size:18px;margin:0">مركز ابتسام لرياض الأطفال</h1><p style="margin:4px 0 0;color:var(--muted);font-size:12px">ربط قاعدة البيانات</p></div></div>
  <h2 style="margin-top:22px">مفتاح Supabase</h2>
  <p>أدخل <b>Publishable key</b> الخاص بمشروعك. لا تستخدم Secret أو Service Role key.</p>
  <label class="field"><span>Publishable key</span><input id="sbKey" type="password" autocomplete="off" placeholder="sb_publishable_..."></label>
  <div class="hint">المفتاح يُحفظ على هذا الجهاز فقط، ولا نحتاج منك إرساله لنا.</div>
  <div id="keyMsg" class="msg">${esc(message)}</div>
  <button class="primary" style="width:100%" onclick="saveKey()">متابعة</button>
 </div></div>`;
}

function authScreen(message=""){
 return `<div class="auth"><div class="authbox">
  <div class="brand"><div class="logo">إ</div><div><h1 style="font-size:18px;margin:0">مركز ابتسام لرياض الأطفال</h1><p style="margin:4px 0 0;color:var(--muted);font-size:12px">الإدارة المالية</p></div></div>
  <h2 style="margin-top:22px">تسجيل الدخول</h2>
  <p>سجّل الدخول بحساب Supabase المرتبط بالموقع.</p>
  <label class="field"><span>البريد الإلكتروني</span><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></label>
  <label class="field"><span>كلمة المرور</span><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></label>
  <div id="authMsg" class="msg">${esc(message)}</div>
  <div style="display:flex;gap:8px"><button class="primary" style="flex:1" onclick="signIn()">دخول</button><button class="ghost" style="flex:1" onclick="signUp()">إنشاء حساب</button></div>
  <button class="ghost" style="width:100%;margin-top:9px" onclick="changeKey()">تغيير المفتاح</button>
 </div></div>`;
}

async function boot(){
 const key=localStorage.getItem(KEY_STORAGE);
 if(!key){$("root").innerHTML=keyScreen();return;}
 try{
  supabaseClient=window.supabase.createClient(SUPABASE_URL,key);
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session){await loadEntries();showApp();}
  else $("root").innerHTML=authScreen();
 }catch(e){$("root").innerHTML=keyScreen("تعذر تهيئة الاتصال. تأكد من أن المفتاح هو Publishable key الصحيح.");}
}

function saveKey(){
 const key=$("sbKey").value.trim();
 if(!key){showMessage("keyMsg","أدخل المفتاح أولًا.");return;}
 localStorage.setItem(KEY_STORAGE,key);
 boot();
}
function changeKey(){localStorage.removeItem(KEY_STORAGE);supabaseClient=null;$("root").innerHTML=keyScreen();}
async function signIn(){
 const email=$("email").value.trim(), password=$("password").value;
 if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return;}
 const key=localStorage.getItem(KEY_STORAGE)||"";
 showMessage("authMsg","جاري الاتصال بـ Supabase...");
 try{
  // Direct Auth request: this avoids masking the real browser/network error as “Load failed”.
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);
  let response;
  try{
   response=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":key},
    body:JSON.stringify({email,password}),
    signal:controller.signal
   });
  }finally{clearTimeout(timer);}
  const raw=await response.text();
  let body={};
  try{body=raw?JSON.parse(raw):{};}catch(_){body={raw};}
  if(!response.ok){
   const detail=body.error_description||body.msg||body.message||body.raw||`HTTP ${response.status}`;
   showMessage("authMsg",`خطأ الدخول: ${detail} (HTTP ${response.status})`);
   console.error("Supabase direct auth error",response.status,body);
   return;
  }
  if(!body.access_token||!body.refresh_token){
   showMessage("authMsg","وصل رد من Supabase لكنه لا يحتوي على جلسة دخول.");
   console.error("Unexpected Supabase auth response",body);
   return;
  }
  const sessionResult=await supabaseClient.auth.setSession({access_token:body.access_token,refresh_token:body.refresh_token});
  if(sessionResult.error){
   showMessage("authMsg",`تم التحقق من الحساب لكن تعذر إنشاء الجلسة: ${sessionResult.error.message}`);
   console.error("Supabase setSession error",sessionResult.error);
   return;
  }
  try{await loadEntries();}catch(e){
   showMessage("authMsg",`تم تسجيل الدخول، لكن تعذر تحميل البيانات: ${e.message||"خطأ غير معروف"}`);
   console.error("Supabase data load error",e);
   return;
  }
  showApp();
 }catch(e){
  const detail=e?.name==="AbortError"?"انتهت مهلة الاتصال (15 ثانية)":(e?.message||String(e)||"خطأ غير معروف");
  showMessage("authMsg",`تعذر الاتصال بـ Supabase: ${detail}`);
  console.error("Supabase direct auth exception",e);
 }
}
async function signUp(){
 const email=$("email").value.trim(), password=$("password").value;
 if(!email||!password){showMessage("authMsg","أدخل البريد وكلمة المرور.");return;}
 if(password.length<6){showMessage("authMsg","كلمة المرور يجب أن تكون 6 أحرف على الأقل.");return;}
 showMessage("authMsg","جاري إنشاء الحساب...");
 const {data,error}=await supabaseClient.auth.signUp({email,password});
 if(error){showMessage("authMsg",error.message);return;}
 if(data.session){await loadEntries();showApp();}
 else showMessage("authMsg","تم إنشاء الحساب. إذا كان تأكيد البريد مفعّلًا، افتح رسالة البريد ثم ارجع وسجّل الدخول.");
}

async function loadEntries(){
 const {data,error}=await supabaseClient.from("financial_entries").select("id,month,type,category,amount,created_at").order("created_at",{ascending:true});
 if(error){throw new Error(error.message);}
 entries=(data||[]).map(x=>({id:String(x.id),month:String(x.month).slice(0,10),type:x.type,category:x.category,amount:Number(x.amount)}));
 // Migrate old local data only if the Supabase table is empty.
 if(entries.length===0){
  const local=JSON.parse(localStorage.getItem(LOCAL_STORAGE)||"[]");
  if(Array.isArray(local)&&local.length){
   const payload=local.map(x=>({month:String(x.month).slice(0,10),type:x.type,category:String(x.category),amount:Number(x.amount)||0}));
   const {error:insertError}=await supabaseClient.from("financial_entries").insert(payload);
   if(!insertError){
    const {data:after}=await supabaseClient.from("financial_entries").select("id,month,type,category,amount,created_at").order("created_at",{ascending:true});
    entries=(after||[]).map(x=>({id:String(x.id),month:String(x.month).slice(0,10),type:x.type,category:x.category,amount:Number(x.amount)}));
   }
  }
 }
}
function appShell(){
 return `<div class="app">
  <div class="top">
   <div class="brand"><div class="logo">إ</div><div><h1>مركز ابتسام لرياض الأطفال</h1><p>الإدارة المالية</p></div></div>
   <div class="actions"><button class="ghost" onclick="signOut()">تسجيل الخروج</button></div>
  </div>
  <div class="toolbar"><h2>الملخص المالي</h2><input id="month" class="month" type="month" onchange="render()"></div>
  <div class="cards">
   <div class="card income"><div class="label">إجمالي الدخل</div><div id="totalIncome" class="amount">0 ر.س</div></div>
   <div class="card expense"><div class="label">إجمالي المصروفات</div><div id="totalExpense" class="amount">0 ر.س</div></div>
   <div class="card remain"><div class="label">المتبقي</div><div id="remaining" class="amount">0 ر.س</div></div>
  </div>
  <div class="grid">
   <div class="section"><div class="section-head"><h3>الدخل</h3><button class="add" onclick="openModal('income')">+ إضافة دخل</button></div><div id="incomeRows" class="rows"></div></div>
   <div class="section"><div class="section-head"><h3>المصروفات</h3><button class="add" onclick="openModal('expense')">+ إضافة مصروف</button></div><div id="expenseRows" class="rows"></div></div>
  </div>
  <div class="section bottom"><div class="section-head"><h3>توزيع المصروفات</h3><span id="ratioText" class="label"></span></div><div class="bar-wrap"><div id="bar" class="bar" style="width:0%"></div></div><div class="footnote"><span>الدخل</span><span>المصروفات</span></div></div>
 </div>`;
}
function showApp(){
 $("root").innerHTML=appShell();
 const now=new Date();
 $("month").value=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,7);
 render();
}
function render(){
 const m=$("month").value;
 const list=entries.filter(x=>x.month.slice(0,7)===m);
 const inc=list.filter(x=>x.type==="income"), exp=list.filter(x=>x.type==="expense");
 const ti=inc.reduce((a,x)=>a+Number(x.amount),0), te=exp.reduce((a,x)=>a+Number(x.amount),0);
 $("totalIncome").textContent=money(ti);$("totalExpense").textContent=money(te);$("remaining").textContent=money(ti-te);
 $("remaining").style.color=(ti-te<0)?"#ff7777":"#6ca8ff";
 $("incomeRows").innerHTML=rows(inc);$("expenseRows").innerHTML=rows(exp);
 const ratio=ti?Math.min(100,(te/ti)*100):0;$("bar").style.width=ratio+"%";$("ratioText").textContent=ti?Math.round(ratio)+"% من الدخل":"";
}
function rows(list){
 if(!list.length)return '<div class="empty">لا توجد حركات لهذا الشهر</div>';
 return list.map(x=>`<div class="row"><div><div class="cat">${esc(x.category)}</div><div class="label">${money(x.amount)}</div></div><div style="display:flex;gap:6px"><button class="ghost" style="padding:7px 9px" onclick="editEntry('${x.id}')">تعديل</button><button class="ghost" style="padding:7px 9px" onclick="deleteEntry('${x.id}')">حذف</button></div></div>`).join("");
}
function openModal(type,id=null){
 editId=id;$("modalTitle").textContent=id?"تعديل الحركة":(type==="income"?"إضافة دخل":"إضافة مصروف");$("mType").value=type;
 const x=id?entries.find(e=>String(e.id)===String(id)):null;$("mCategory").value=x?.category||"";$("mAmount").value=x?.amount||"";$("mMsg").textContent="";$("modal").classList.add("show");
}
function editEntry(id){const x=entries.find(e=>String(e.id)===String(id));if(x)openModal(x.type,id);}
function closeModal(){$("modal").classList.remove("show");editId=null;}
async function saveEntry(){
 if(busy)return; const type=$("mType").value,category=$("mCategory").value.trim(),amount=Number($("mAmount").value);
 if(!category||!amount){showMessage("mMsg","اكتب التصنيف والمبلغ.");return;}
 busy=true;showMessage("mMsg","جاري الحفظ...");
 try{
  if(editId){
   const x=entries.find(e=>String(e.id)===String(editId));
   const {data,error}=await supabaseClient.from("financial_entries").update({month:monthValue()+"-01",type,category,amount}).eq("id",Number(editId)).select("id,month,type,category,amount").single();
   if(error)throw error;
   Object.assign(x,{id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)});
  }else{
   const {data,error}=await supabaseClient.from("financial_entries").insert({month:monthValue()+"-01",type,category,amount}).select("id,month,type,category,amount").single();
   if(error)throw error;
   entries.push({id:String(data.id),month:String(data.month).slice(0,10),type:data.type,category:data.category,amount:Number(data.amount)});
  }
  closeModal();render();
 }catch(e){showMessage("mMsg","تعذر الحفظ: "+(e.message||"خطأ غير معروف"));}
 finally{busy=false;}
}
async function deleteEntry(id){
 if(!confirm("حذف هذه الحركة؟"))return;
 const {error}=await supabaseClient.from("financial_entries").delete().eq("id",Number(id));
 if(error){alert("تعذر الحذف: "+error.message);return;}
 entries=entries.filter(x=>String(x.id)!==String(id));render();
}
async function signOut(){await supabaseClient.auth.signOut();$("root").innerHTML=authScreen();}
boot();
</script>
</body>
</html>
